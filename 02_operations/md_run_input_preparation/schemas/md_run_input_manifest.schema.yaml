$schema: https://json-schema.org/draft/2020-12/schema
$id: md_run_input_manifest.schema.yaml
title: MD Run Input Manifest
type: object
required:
  - schema_version
  - task_id
  - workstream_id
  - protocol_spec_id
  - protocol_spec
  - plan_id
  - plan
  - run_unit_id
  - source_artifact_set_ids
  - mdp
  - input_files
  - grompp
  - output_tpr
  - resolved_decision_ids
  - warnings
properties:
  schema_version: {type: integer, const: 2}
  task_id: {type: string, minLength: 1}
  workstream_id: {type: string, minLength: 1}
  protocol_spec_id: {type: string, minLength: 1}
  protocol_spec: {$ref: '#/$defs/file_identity'}
  plan_id: {type: string, minLength: 1}
  plan: {$ref: '#/$defs/file_identity'}
  run_unit_id: {type: string, minLength: 1}
  source_artifact_set_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  mdp:
    type: object
    required: [source_kind, source, rendered, rendering_policy, typed_overrides]
    properties:
      source_kind: {enum: [FINAL_FILE, TEMPLATE_WITH_TYPED_OVERRIDES]}
      source: {$ref: '#/$defs/file_identity'}
      rendered: {$ref: '#/$defs/file_identity'}
      rendering_policy: {enum: [USE_FILE_UNCHANGED, EXACT_PARAMETER_REPLACEMENT]}
      typed_overrides:
        type: array
        items:
          type: object
          required: [parameter, value_type, value, unit, provenance_source_id]
          properties:
            parameter: {type: string, minLength: 1}
            value_type: {enum: [STRING, INTEGER, NUMBER, BOOLEAN, STRING_LIST]}
            value:
              oneOf:
                - type: string
                - type: integer
                - type: number
                - type: boolean
                - type: array
                  items: {type: string}
            unit: {type: [string, 'null']}
            provenance_source_id: {type: string, minLength: 1}
          additionalProperties: false
    additionalProperties: false
  input_files:
    type: object
    required: [coordinates, topology_root, topology_includes, index, reference_coordinates, input_checkpoint]
    properties:
      coordinates: {$ref: '#/$defs/file_identity'}
      topology_root: {$ref: '#/$defs/file_identity'}
      topology_includes:
        type: array
        items: {$ref: '#/$defs/file_identity'}
      index:
        oneOf:
          - type: 'null'
          - $ref: '#/$defs/file_identity'
      reference_coordinates:
        oneOf:
          - type: 'null'
          - $ref: '#/$defs/file_identity'
      input_checkpoint:
        oneOf:
          - type: 'null'
          - $ref: '#/$defs/file_identity'
    additionalProperties: false
  grompp:
    type: object
    required: [executable, executable_version, argv, maxwarn, return_code, stdout_path, stderr_path]
    properties:
      executable: {type: string, minLength: 1}
      executable_version: {type: [string, 'null']}
      argv:
        type: array
        minItems: 1
        items: {type: string}
      maxwarn: {type: integer, minimum: 0}
      return_code: {type: integer}
      stdout_path: {type: string, minLength: 1}
      stderr_path: {type: string, minLength: 1}
    additionalProperties: false
  output_tpr: {$ref: '#/$defs/file_identity'}
  resolved_decision_ids:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  warnings:
    type: array
    items:
      type: object
      required: [code, message, blocking]
      properties:
        code: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
        blocking: {type: boolean}
      additionalProperties: false
additionalProperties: false
$defs:
  file_identity:
    type: object
    required: [path, sha256]
    properties:
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
      artifact_set_id: {type: [string, 'null']}
      size_bytes: {type: integer, minimum: 0}
    additionalProperties: false