$schema: https://json-schema.org/draft/2020-12/schema
$id: selection_spec.schema.yaml
title: Chain and Component Selection Specification
type: object
required:
  - schema_version
  - task_id
  - workstream_id
  - source_structure
  - classification_result
  - selected_model_id
  - selected_component_ids
  - resolved_decision_ids
  - output
  - policies
properties:
  schema_version:
    type: integer
    const: 1
  task_id:
    type: string
    minLength: 1
  workstream_id:
    type: string
    minLength: 1
  source_structure:
    $ref: '#/$defs/file_identity'
  classification_result:
    $ref: '#/$defs/file_identity'
  selected_model_id:
    type: string
    minLength: 1
  selected_component_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  resolved_decision_ids:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  output:
    type: object
    required: [path, format]
    properties:
      path:
        type: string
        minLength: 1
      format:
        enum: [PDB, MMCIF]
    additionalProperties: false
  policies:
    type: object
    required:
      - selection_level
      - covalent_closure
      - preserve_all_atoms
      - preserve_all_altlocs
      - preserve_source_order
      - preserve_coordinates
    properties:
      selection_level:
        const: COMPONENT_ONLY
      covalent_closure:
        const: REQUIRE_COMPLETE
      preserve_all_atoms:
        const: true
      preserve_all_altlocs:
        const: true
      preserve_source_order:
        const: true
      preserve_coordinates:
        const: true
    additionalProperties: false
  notes:
    type: array
    items:
      type: string
additionalProperties: false
$defs:
  file_identity:
    type: object
    required: [path, sha256]
    properties:
      path:
        type: string
        minLength: 1
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
    additionalProperties: false
