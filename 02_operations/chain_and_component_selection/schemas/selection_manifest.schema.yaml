$schema: https://json-schema.org/draft/2020-12/schema
$id: selection_manifest.schema.yaml
title: Chain and Component Selection Manifest
type: object
required:
  - schema_version
  - task_id
  - workstream_id
  - source_structure
  - classification_result
  - selection_spec
  - output_structure
  - selected_model_id
  - requested_component_ids
  - actual_component_ids
  - selected_residue_ids
  - excluded_residue_ids
  - counts
  - preserved_explicit_connections
  - excluded_explicit_connections
  - cross_boundary_coordination_relations
  - cross_boundary_covalent_candidates
  - resolved_decision_ids
  - policies
  - warnings
properties:
  schema_version:
    type: integer
    const: 1
  task_id:
    type: string
    minLength: 1
  workstream_id:
    type: string
    minLength: 1
  source_structure:
    $ref: '#/$defs/file_identity'
  classification_result:
    $ref: '#/$defs/file_identity'
  selection_spec:
    $ref: '#/$defs/file_identity'
  output_structure:
    allOf:
      - $ref: '#/$defs/file_identity'
      - type: object
        required: [format]
        properties:
          format:
            enum: [PDB, MMCIF]
  selected_model_id:
    type: string
    minLength: 1
  requested_component_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  actual_component_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  selected_residue_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  excluded_residue_ids:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  counts:
    type: object
    required:
      - source_component_count
      - selected_component_count
      - excluded_component_count
      - source_residue_count
      - selected_residue_count
      - excluded_residue_count
      - source_atom_count
      - selected_atom_count
      - excluded_atom_count
    properties:
      source_component_count: {type: integer, minimum: 0}
      selected_component_count: {type: integer, minimum: 0}
      excluded_component_count: {type: integer, minimum: 0}
      source_residue_count: {type: integer, minimum: 0}
      selected_residue_count: {type: integer, minimum: 0}
      excluded_residue_count: {type: integer, minimum: 0}
      source_atom_count: {type: integer, minimum: 0}
      selected_atom_count: {type: integer, minimum: 0}
      excluded_atom_count: {type: integer, minimum: 0}
    additionalProperties: false
  preserved_explicit_connections:
    type: array
    items: {$ref: '#/$defs/relation_ref'}
  excluded_explicit_connections:
    type: array
    items: {$ref: '#/$defs/relation_ref'}
  cross_boundary_coordination_relations:
    type: array
    items: {$ref: '#/$defs/relation_ref'}
  cross_boundary_covalent_candidates:
    type: array
    items: {$ref: '#/$defs/relation_ref'}
  resolved_decision_ids:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  policies:
    type: object
    required:
      - selection_level
      - covalent_closure
      - preserve_all_atoms
      - preserve_all_altlocs
      - preserve_source_order
      - preserve_coordinates
    properties:
      selection_level: {const: COMPONENT_ONLY}
      covalent_closure: {const: REQUIRE_COMPLETE}
      preserve_all_atoms: {const: true}
      preserve_all_altlocs: {const: true}
      preserve_source_order: {const: true}
      preserve_coordinates: {const: true}
    additionalProperties: false
  warnings:
    type: array
    items: {type: string}
additionalProperties: false
$defs:
  file_identity:
    type: object
    required: [path, sha256]
    properties:
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
      size_bytes: {type: integer, minimum: 0}
    additionalProperties: false
  relation_ref:
    type: object
    required: [relation_id, relation_type, endpoint_1_id, endpoint_2_id]
    properties:
      relation_id: {type: string, minLength: 1}
      relation_type: {type: string, minLength: 1}
      endpoint_1_id: {type: string, minLength: 1}
      endpoint_2_id: {type: string, minLength: 1}
      notes: {type: string}
    additionalProperties: false
