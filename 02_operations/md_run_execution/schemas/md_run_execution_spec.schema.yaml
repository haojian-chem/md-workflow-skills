$schema: https://json-schema.org/draft/2020-12/schema
$id: md_run_execution_spec.schema.yaml
title: MD Run Execution Specification
type: object
required:
  - schema_version
  - task_id
  - workstream_id
  - run_unit
  - input
  - execution
  - expected_outputs
  - completion_criteria
  - output_records
  - policies
properties:
  schema_version: {type: integer, const: 1}
  task_id: {type: string, minLength: 1}
  workstream_id: {type: string, minLength: 1}
  run_unit:
    type: object
    required: [plan_id, run_unit_id, role, sequence, depends_on, work_directory]
    properties:
      plan_id: {type: string, minLength: 1}
      run_unit_id: {type: string, minLength: 1}
      role:
        enum: [ENERGY_MINIMIZATION, EQUILIBRATION, PRODUCTION, CONTINUATION, CUSTOM]
      sequence: {type: integer, minimum: 1}
      depends_on:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      work_directory: {type: string, minLength: 1}
    additionalProperties: false
  input:
    type: object
    required:
      - simulation_plan
      - md_input_artifact_set_ids
      - input_manifest
      - tpr
      - checkpoint
    properties:
      simulation_plan: {$ref: '#/$defs/file_identity'}
      md_input_artifact_set_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      input_manifest: {$ref: '#/$defs/file_identity'}
      tpr: {$ref: '#/$defs/file_identity'}
      checkpoint:
        oneOf:
          - type: 'null'
          - $ref: '#/$defs/file_identity'
    additionalProperties: false
  execution:
    type: object
    required: [engine, mode, backend, gromacs, restart, resources]
    properties:
      engine: {const: GROMACS}
      mode: {enum: [SYNCHRONOUS, ASYNCHRONOUS]}
      backend: {$ref: '#/$defs/backend'}
      gromacs:
        type: object
        required: [executable, executable_version, deffnm, extra_argv]
        properties:
          executable: {type: string, minLength: 1}
          executable_version: {type: [string, 'null']}
          deffnm: {type: string, minLength: 1}
          extra_argv:
            type: array
            items: {type: string}
        additionalProperties: false
      restart:
        type: object
        required: [mode, append_mode]
        properties:
          mode: {enum: [FRESH, CONTINUE_FROM_CHECKPOINT]}
          append_mode: {enum: [NOT_APPLICABLE, APPEND, NOAPPEND]}
        allOf:
          - if:
              properties: {mode: {const: FRESH}}
            then:
              properties: {append_mode: {const: NOT_APPLICABLE}}
          - if:
              properties: {mode: {const: CONTINUE_FROM_CHECKPOINT}}
            then:
              properties: {append_mode: {enum: [APPEND, NOAPPEND]}}
        additionalProperties: false
      resources:
        type: object
        required: [mpi_ranks, omp_threads, gpu_ids, memory_mb, walltime]
        properties:
          mpi_ranks: {type: [integer, 'null'], minimum: 1}
          omp_threads: {type: [integer, 'null'], minimum: 1}
          gpu_ids:
            type: array
            items: {type: string, minLength: 1}
          memory_mb: {type: [integer, 'null'], minimum: 1}
          walltime: {type: [string, 'null']}
        additionalProperties: false
    additionalProperties: false
  expected_outputs:
    type: array
    minItems: 1
    items:
      type: object
      required: [path, role, required]
      properties:
        path: {type: string, minLength: 1}
        role: {type: string, minLength: 1}
        required: {type: boolean}
      additionalProperties: false
  completion_criteria:
    type: object
    required:
      - require_normal_termination
      - target_nsteps
      - target_time_ps
      - require_checkpoint
      - role_specific_checks
    properties:
      require_normal_termination: {type: boolean}
      target_nsteps: {type: [integer, 'null'], minimum: 0}
      target_time_ps: {type: [number, 'null'], minimum: 0}
      require_checkpoint: {type: boolean}
      role_specific_checks:
        type: array
        items:
          type: object
          required: [check_id, metric_id, operator, value, unit, blocking]
          properties:
            check_id: {type: string, minLength: 1}
            metric_id: {type: string, minLength: 1}
            operator: {enum: [LT, LE, EQ, GE, GT, BETWEEN]}
            value:
              oneOf:
                - type: number
                - type: array
                  minItems: 2
                  maxItems: 2
                  items: {type: number}
            unit: {type: [string, 'null']}
            blocking: {type: boolean}
          additionalProperties: false
    additionalProperties: false
  output_records:
    type: object
    required: [command_record, operation_report, submission_evidence, execution_log]
    properties:
      command_record: {type: string, minLength: 1}
      operation_report: {type: string, minLength: 1}
      submission_evidence: {type: string, minLength: 1}
      execution_log: {type: string, minLength: 1}
    additionalProperties: false
  policies:
    type: object
    required: [allow_overwrite, allow_shell_interpretation, preserve_inputs, submit_once]
    properties:
      allow_overwrite: {const: false}
      allow_shell_interpretation: {const: false}
      preserve_inputs: {const: true}
      submit_once: {const: true}
    additionalProperties: false
additionalProperties: false
$defs:
  file_identity:
    type: object
    required: [path, sha256]
    properties:
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
      artifact_set_id: {type: [string, 'null']}
    additionalProperties: false
  backend:
    type: object
    required: [type, host, session_name, submission_script, submission_argv, status_argv]
    properties:
      type: {enum: [LOCAL, TMUX, LSF, SLURM, PBS]}
      host: {type: [string, 'null']}
      session_name: {type: [string, 'null']}
      submission_script:
        oneOf:
          - type: 'null'
          - $ref: '#/$defs/file_identity'
      submission_argv:
        type: array
        items: {type: string}
      status_argv:
        type: array
        items: {type: string}
    allOf:
      - if:
          properties: {type: {const: TMUX}}
        then:
          properties: {session_name: {type: string, minLength: 1}}
      - if:
          properties: {type: {enum: [LSF, SLURM, PBS]}}
        then:
          properties: {submission_script: {$ref: '#/$defs/file_identity'}}
    additionalProperties: false