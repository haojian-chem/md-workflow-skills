notes:
  - v1 requires an explicit selection_spec; natural-language or convention-based implicit selection is prohibited.
  - Selection is component-level and exactly one model; residue-range and atom-level selection are not supported.
  - A confirmed covalent relation crossing the boundary blocks the Operation; the selection is not auto-expanded.
  - Metal coordination and rejected geometry-only candidates are reported but do not force component inclusion.
  - The deterministic entry point preserves complete observed residue instances and creates an UNVALIDATED STRUCTURE candidate for the dedicated Validator.
  - The shared result builder emits a validated STRUCTURE artifact candidate only after the dedicated Validator explicitly accepts and covers the candidate, manifest, and mapping hashes.
