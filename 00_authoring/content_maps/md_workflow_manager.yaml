notes:
  - Manager and Task Execution Agent run in different conversations; ordinary execution does not bounce back through Manager between steps.
  - Planning index contains only lightweight initial-planning data and explicit stage-specific planning modes; it contains no conditional/applicability science.
  - Stage 4 initial planning records a planned run route but does not allocate formal run-unit IDs.
  - Stage 5 initial planning creates 5.1 and preserves the user's explicit analysis requirement; 5.1 designs the concrete analysis plan.
