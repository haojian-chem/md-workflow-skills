notes:
  - Manager and Task Execution Agent are expected to run in different conversations; ordinary execution does not bounce back through Manager between steps.
  - `task_index.md` is task navigation only; `Txxxx.md` is the current task plan and recovery context.
  - `project_result_index.md` is organized by step and contains result locations, not current-step state.
  - The planning index contains only step order, names, work directories, and conditional markers; it must not grow into a compact scientific Workflow Skill.
  - Root `AGENTS.md` and authoring rules now select Lightweight Runtime v2 as the default architecture.
  - A dedicated Task Execution Agent runtime interface and lightweight scientific Step migrations are still pending; Manager refactor alone does not make 1.1-1.3 fully migrated.
