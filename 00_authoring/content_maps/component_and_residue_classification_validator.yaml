notes:
  - Residue and atom names in the redesign are exact and case-sensitive; uppercase normalization and alias matching are being removed.
  - Model scope is resolved before full classification; one model is automatic and multiple models require a recorded user selection.
  - Project-defined covalent and coordination checks are separate from baseline classification and will be implemented as separate deterministic entry points.
  - Metal coordination may promote a nonstandard component to the linked topology route only when the project definition explicitly enables that effect and the relation is confirmed.
  - The legacy parser and wrapper remain the current executable draft until the full redesigned pipeline and tests are complete; redesign files must not yet be treated as a production-complete validator.
