notes:
  - Runtime STRUCTURE input is taken from the schema-valid subagent task file record and independently revalidated; the draft source_recognition business report is not a runtime dependency.
  - General Manager, Workflow, Operation and Validator permissions are owned only by layer_boundaries.md and must not be duplicated in local Skill documentation.
  - Local execution flow and model branching are owned by SKILL.md; scientific classification semantics are owned by references/classification_rules.md; CLI and module interfaces are owned by scripts/README.md.
  - Residue and atom names are exact and case-sensitive; uppercase normalization, alias matching, regular expressions and fuzzy-name matching are prohibited.
  - Residue and relation endpoint identity is dual: immutable source_* provenance and current_* STRUCTURE identity use distinct field names; chain_index remains an external logical grouping field.
  - Final component, residue, endpoint and relation IDs are opaque versioned values materialized by 1.2; downstream selection must read them and must not reconstruct them from chain_index or display fields.
  - Aggregated solvent, ion and repeated-small-molecule groups retain every observed residue record; residue_ids list coordinate-bearing members and missing_residue_ids preserve expected-but-unobserved metadata.
  - Model scope is resolved before full classification; one model is automatic and multiple models require a recorded user selection.
  - Structural entity/polymer facts are authoritative for chain grouping; unresolved or conflicting topology classification remains unchanged in residue output.
  - Missing-residue checks use MAPPING_UNRESOLVED when the author residue identifier or target chain cannot be mapped; duplicate cross-stage reports of the same issue and subject are merged while preserving evidence.
  - Real 1VNS source metadata differ by format: PDB REMARK 465 records 35 missing residues, while mmCIF unobserved-residue metadata records 46; each source is preserved rather than forced into artificial equality.
  - Multiple altLoc residues skip heavy-atom comparison; altLoc-specific relation endpoints retain exact altLoc identity; duplicate exact RTP names require confirmation except for ordinary water context.
  - Heavy-atom output separates execution status from parallel findings and preserves raw exact-name differences even when CCD mapping candidates exist.
  - Project CCD snapshots are authoritative; identical local candidates collapse by hash and differing valid local candidates require confirmation.
  - Confirmed Mg/Zn coordination with promote=false remains relation-only and does not alter topology grouping.
  - Confirmed HEM-CYS/HIE coordination with promote=true moves HEM into the polymer chain and marks it TOPOLOGY_LINKED_NONSTANDARD.
  - TOPOLOGY_LINKED_NONSTANDARD describes connected-topology membership only; relation types remain separate, and deprecated enum, registry path and summary field names are prohibited.
  - Real AlphaFold Server acceptance verifies source chain B FE/HEM identities separately from aggregated chain-group representation; FE is an ION_GROUP and HEM is an INDEPENDENT_COMPONENT.
  - Real GROMACS acceptance confirms internal RTP parsing and confirms that terminal residues do not silently fall back when only n.tdb/c.tdb patches exist.
  - Manager closure confirms wrapper boundaries, one FAST validation, direct-reference checking, atomic commit, terminal event and visible closure summary.
