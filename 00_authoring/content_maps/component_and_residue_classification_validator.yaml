notes:
  - Existing deterministic scripts and scientific schemas are retained; the refactor changes runtime ownership, directory isolation, reuse, and completion recording rather than the scientific classification engine.
  - Stable base directory may be initialized globally, but actual mutable/output state is isolated under `02_component_and_residue_classification/<task_id>/`.
  - Direct reuse references another task's official result files and does not create an empty current-task directory.
  - classification_result.yaml preserves the opaque 1.2 to 1.3 identity contract; downstream code must not reconstruct IDs.
  - reference_manifest.yaml and optional relation_decisions.yaml provide the provenance needed for cross-task reuse equivalence checks.
