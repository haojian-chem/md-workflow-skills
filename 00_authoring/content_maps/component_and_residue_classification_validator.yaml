notes:
  - Residue and atom names are exact and case-sensitive; uppercase normalization, alias matching, regular expressions and fuzzy-name matching are prohibited.
  - Model scope is resolved before full classification; one model is automatic and multiple models require a recorded user selection.
  - Project-defined possible covalent connections and coordination are separate deterministic checks after baseline classification.
  - Metal coordination may promote a nonstandard component to the linked topology route only when the project definition explicitly enables that effect and the relation is confirmed.
  - The v1.2 implementation, public entry points, result builder and shared wrapper are present; formal test evidence, real PDB/mmCIF/AF3 validation and Manager closure remain required before overall PASS.
