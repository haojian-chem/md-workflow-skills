notes:
  - New or refactored Skills target Lightweight Runtime v2 by default.
  - Step-facing Skills collectively expose purpose, object requirements, reuse conditions, execution rules, validation requirements, and official results with one owner per rule.
  - Stable Step base directories are distinct from task-scoped <base_work_directory>/<task_id>/ execution directories.
  - Manager records task-scoped work paths but does not create them; Task Execution Agent creates them only when local execution is required after reuse checking.
  - Legacy runtime protocols remain for history/migration only and must not be copied into new Skill interfaces.
