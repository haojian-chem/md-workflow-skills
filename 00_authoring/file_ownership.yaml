tool_directory_policy:
  registry_owner: main
  authoring_skill: 00_authoring/md-workflow-tool-authoring/SKILL.md
  directory_pattern: 05_tools/<tool-name>/
  assignment_rule: 同一 Tool 目录同一时间只能分配给一个编写窗口；业务运行窗口不得修改共享 Tool。
  activation_rule: 未完成可执行 tests 与 benchmark 的 Tool 不得标记为 ACTIVE。

