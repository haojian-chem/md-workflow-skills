schema_version: 5
status: ready_for_new_assignments

window_policy:
  read_scope: broad_as_needed_for_context_and_interfaces
  write_scope: explicit_owned_paths_only
  rule: reading another Skill does not grant authority to modify it or define its internal rules
  cross_skill_issue_handling: report_to_owner_or_main_window_instead_of_embedding_foreign_rules

shared_files:
  owner_window: main
  write_paths:
    - AGENTS.md
    - 00_authoring/README.md
    - 00_authoring/AUTHORING_RULES.md
    - 00_authoring/MD_WORKFLOW_MASTER_PLAN.md
    - 00_authoring/SYNC_STATUS.md
    - 00_authoring/WORKFLOW*_ARCHITECTURE_FREEZE*.md
    - 00_authoring/md-workflow-skill-authoring/
    - 00_authoring/md-workflow-tool-authoring/
    - 00_authoring/skill_inventory.yaml
    - 00_authoring/file_ownership.yaml
    - 00_authoring/content_maps/
    - 00_manager/md_workflow_manager/references/
    - 03_contracts/
    - 05_tools/tool_registry.yaml
  notes: Shared architecture/index/authoring files are modified only by the main authoring window. Business windows may read them and other relevant Skills as needed.

tool_directory_policy:
  registry_owner: main
  authoring_skill: 00_authoring/md-workflow-tool-authoring/SKILL.md
  directory_pattern: 05_tools/<tool-name>/
  assignment_rule: 同一 Tool 目录同一时间只能分配给一个编写窗口；业务运行窗口不得修改共享 Tool。
  activation_rule: 未完成可执行 tests 与 benchmark 的 Tool 不得标记为 ACTIVE。

scientific_skill_policy:
  forced_workflow_operation_validator_split: false
  default_structure: main_skill_plus_references_and_only_justified_supporting_skills
  historical_paths_are_not_templates:
    - 01_workflows/
    - 02_operations/
    - 02_validators/

assignments: []

review_queue:
  - skill_name: md_workflow_manager
    required_action: validate_current_lightweight_planning_including_stage4_exception_and_stage5_5_1_handoff
  - skill_name: structure_preparation_workflow
    required_action: representative_validation_and_future_layout_migration_review
  - skill_name: source_recognition
    required_action: real_file_copy_hash_conflict_and_manager_integration_tests
  - skill_name: component_and_residue_classification_validator
    required_action: revalidate_residue_records_ordering_contract_and existing guide boundary
  - skill_name: chain_and_residue_selection
    required_action: validate_selection_guidance_record_formats_and_real_pdb_materialization
  - skill_name: chain_and_residue_selection_validator
    required_action: validate_selection_structure_organization_mapping checks and future merge boundary
  - skill_name: altloc_occupancy_resolution
    required_action: representative_validation
  - skill_name: structure_completeness_validator
    required_action: representative_validation
  - skill_name: missing_region_completion
    required_action: representative_completion_validation
  - skill_name: protein_protonation_assignment
    required_action: representative_propka_and_force_field_naming_validation
  - skill_name: structure_reorder_and_mapping
    required_action: representative_mapping_validation
  - skill_name: structure_preparation_validator
    required_action: representative_stage1_final_validation
  - skill_name: md_simulation
    required_action: validate_stage4_planned_run_binding_run_unit_maintenance_top_lineage_and_result_registration
  - skill_name: energy_minimization
    required_action: validate_em_execution_and_checks
  - skill_name: equilibration
    required_action: validate_nvt_npt_execution_and_checks
  - skill_name: production_simulation
    required_action: validate_production_execution_and_checks
  - skill_name: analysis
    required_action: populate capability inventory then validate stage5 planning reuse dependency orchestration and result registration

alignment_queue:
  - review_legacy_scientific_skill_layouts_without_forcing_mass_migration

unassigned_skills: []

unassigned_tools:
  - state_transaction
  - incremental_reference_checker
  - task_closure_renderer
