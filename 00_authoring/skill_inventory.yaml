schema_version: 4
status: lightweight_runtime_v2_authoring_guide_aligned_structure_workflow_1_1_1_2_refactored_1_3_draft_pending

runtime_architecture:
  default_runtime: lightweight_runtime_v2
  project_model: task_sheet
  records:
    task_index: 00_project_records/task_index.md
    task_sheets: 00_project_records/tasks/Txxxx.md
    project_result_index: 00_project_records/project_result_index.md
  directory_policy:
    stable_step_base_directories_initialized_without_task_subdirectories: true
    task_execution_directory_pattern: "<base_work_directory>/<task_id>/"
    manager_records_but_does_not_create_task_execution_directories: true
    task_execution_agent_creates_directory_only_when_local_execution_is_required: true
    direct_reuse_does_not_require_empty_task_directory: true
  conversations:
    manager:
      role: task_location_creation_initial_planning_and_project_level_management
      skill: 00_manager/md_workflow_manager/SKILL.md
    task_execution_agent:
      role: continuous_multi_step_task_execution
      manager_roundtrip_between_steps: false
      dedicated_runtime_interface_status: not_required_root_agents_rules_apply
  scientific_layers:
    workflow: 01_workflows
    operation: 02_operations
    validator: 02_validators
    tool: 05_tools
  legacy_runtime:
    status: frozen_not_default_runtime
    project_model: workstream_route_event_transaction
    runtime_projection: runtime/
    contracts: 03_contracts/
    rule: retain_for_history_migration_and_explicit_legacy_maintenance_only

