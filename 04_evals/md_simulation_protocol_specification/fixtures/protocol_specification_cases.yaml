schema_version: 2
skill_name: md_simulation_protocol_specification
cases:
  - case_id: final_mdp_file_protocol
    input:
      system_validated: true
      run_unit_id: em.1
      role: ENERGY_MINIMIZATION
      mdp_source_kind: FINAL_FILE
      mdp_hash_valid: true
      typed_overrides: []
      completion_mode: ROLE_SPECIFIC
      role_specific_checks: [maximum_force]
    expected:
      status: DONE
      outcome_code: SIMULATION_PROTOCOL_SPECIFIED

  - case_id: template_with_typed_overrides
    input:
      run_unit_id: eq.1
      role: EQUILIBRATION
      mdp_source_kind: TEMPLATE_WITH_TYPED_OVERRIDES
      template_hash_valid: true
      typed_overrides:
        - {parameter: ref_t, value_type: NUMBER, value: 300, unit: K}
        - {parameter: nsteps, value_type: INTEGER, value: 50000, unit: null}
    expected:
      status: DONE
      rendering_policy: EXACT_PARAMETER_REPLACEMENT

  - case_id: ambiguous_standard_workflow_phrase
    input:
      user_statement: 按标准流程跑
      structured_protocol_input: null
    expected:
      status: BLOCKED
      outcome_code: PROTOCOL_INPUT_INCOMPLETE_OR_AMBIGUOUS
      confirmation_item_required: true

  - case_id: continuation_role_rejected
    input:
      run_unit_id: md.continue
      role: CONTINUATION
    expected:
      status: BLOCKED
      outcome_code: PROTOCOL_RUN_UNIT_OR_DEPENDENCY_INVALID

  - case_id: runtime_backend_not_written_to_protocol
    input:
      scientific_fields_complete: true
      backend_requested: SLURM
      resource_profile_id: gpu-large
    expected:
      protocol_contains_backend: false
      unresolved_item_blocking_stage: ATTEMPT_SPECIFICATION

  - case_id: system_start_with_checkpoint_rejected
    input:
      start_state_source: SYSTEM
      input_checkpoint_present: true
    expected:
      status: BLOCKED
      outcome_code: PROTOCOL_START_STATE_INVALID

  - case_id: target_mode_without_target
    input:
      completion_mode: TARGET_STEP_OR_TIME
      target_nsteps: null
      target_time_ps: null
    expected:
      status: BLOCKED
      outcome_code: PROTOCOL_COMPLETION_CRITERIA_INVALID

  - case_id: final_file_with_override_rejected
    input:
      mdp_source_kind: FINAL_FILE
      typed_overrides:
        - {parameter: nsteps, value_type: INTEGER, value: 1000, unit: null}
    expected:
      status: BLOCKED
      outcome_code: PROTOCOL_MDP_SPEC_INVALID

  - case_id: template_free_text_replacement_rejected
    input:
      mdp_source_kind: TEMPLATE_WITH_TYPED_OVERRIDES
      replacement_mode: FREE_TEXT_SEARCH_REPLACE
    expected:
      status: BLOCKED
      outcome_code: PROTOCOL_MDP_SPEC_INVALID

  - case_id: missing_field_provenance
    input:
      scientific_field: run_units[0].completion_criteria.target_time_ps
      value: 100000
      provenance_present: false
    expected:
      status: BLOCKED
      outcome_code: PROTOCOL_FIELD_PROVENANCE_INCOMPLETE

  - case_id: deferred_input_gate
    input:
      scientific_fields_complete: true
      index_selection_unresolved: true
    expected:
      status: DONE
      outcome_code: SIMULATION_PROTOCOL_SPECIFIED_WITH_DEFERRED_GATES
      blocking_stage: INPUT_PREPARATION

  - case_id: approximate_duration_requires_confirmation
    input:
      user_statement: 跑大约100 ns
      exact_typed_value: null
    expected:
      confirmation_item_required: true
      inferred_exact_value: false

  - case_id: scientific_item_misclassified_as_attempt_gate
    input:
      unresolved_field: run_units[0].completion_criteria.target_time_ps
      blocking_stage: ATTEMPT_SPECIFICATION
    expected:
      status: BLOCKED
      outcome_code: PROTOCOL_COMPLETION_CRITERIA_INVALID

  - case_id: protocol_revision_preserves_old_version
    input:
      old_spec_id: protocol.v1
      scientific_change: extend_with_new_run_unit
      output_path_is_new: true
      revision_reason_present: true
    expected:
      supersedes_spec_id: protocol.v1
      old_spec_modified: false