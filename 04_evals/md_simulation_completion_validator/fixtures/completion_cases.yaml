schema_version: 3
skill_name: md_simulation_completion_validator
cases:
  - case_id: workflow_completed_with_stage_output
    input:
      workflow_exit_required: true
      protocol_validated: true
      plan_validated: true
      route_matches_plan: true
      required_run_units: [em.1, eq.1, md.1, md.2]
      validated_md_inputs: [em.1, eq.1, md.1, md.2]
      accepted_attempts_closed: true
      validated_run_outputs: [em.1, eq.1, md.1, md.2]
      stage_output_validated: true
      stage_output_included_runs: [em.1, eq.1, md.1, md.2]
    expected:
      outcome_code: MD_SIMULATION_WORKFLOW_COMPLETED
      gate_recommendation: COMPLETE_WORKFLOW

  - case_id: scope_complete_without_stage_output
    input:
      workflow_exit_required: false
      scope_end: validate_run_output:eq.1
      required_run_units: [em.1, eq.1]
      validated_md_inputs: [em.1, eq.1]
      accepted_attempts_closed: true
      validated_run_outputs: [em.1, eq.1]
      stage_output_present: false
    expected:
      outcome_code: MD_SIMULATION_SCOPE_COMPLETED
      gate_recommendation: COMPLETE_SCOPE

  - case_id: protocol_or_plan_missing
    input:
      protocol_validated: false
      plan_validated: false
    expected:
      outcome_code: SIMULATION_PROTOCOL_OR_PLAN_MISSING_OR_STALE

  - case_id: route_uses_superseded_plan
    input:
      active_route_plan_id: plan.v1
      current_plan_id: plan.v2
    expected:
      outcome_code: ROUTE_PLAN_MISMATCH
      gate_recommendation: REVISE_ROUTE

  - case_id: required_md_input_missing
    input:
      required_run_units: [em.1, md.1]
      validated_md_inputs: [em.1]
    expected:
      outcome_code: REQUIRED_MD_INPUT_NOT_VALIDATED

  - case_id: active_attempt_remains
    input:
      attempts:
        - {run_unit_id: md.1, attempt_id: attempt.001, status: RUNNING}
    expected:
      outcome_code: ACTIVE_OR_UNVERIFIED_ATTEMPT_REMAINS
      gate_recommendation: PAUSE_FOR_DECISION

  - case_id: finished_unverified_attempt_remains
    input:
      attempts:
        - {run_unit_id: md.1, attempt_id: attempt.001, status: FINISHED_UNVERIFIED}
    expected:
      outcome_code: ACTIVE_OR_UNVERIFIED_ATTEMPT_REMAINS

  - case_id: failed_attempt_without_replacement
    input:
      attempts:
        - {attempt_id: attempt.001, status: FAILED}
      replacement_or_exclusion_lineage_present: false
    expected:
      outcome_code: FAILED_OR_CANCELLED_ATTEMPT_UNRESOLVED

  - case_id: failed_attempt_replaced
    input:
      attempts:
        - {attempt_id: attempt.001, status: FAILED}
        - {attempt_id: attempt.002, status: FINISHED_UNVERIFIED}
      accepted_attempt_chain: [attempt.002]
      replacement_lineage_present: true
      run_output_validated: true
    expected:
      failed_attempt_blocks_completion: false

  - case_id: required_run_output_missing
    input:
      required_run_units: [md.1, md.2]
      validated_run_outputs: [md.2]
    expected:
      outcome_code: REQUIRED_RUN_OUTPUT_NOT_VALIDATED

  - case_id: workflow_exit_without_stage_output
    input:
      workflow_exit_required: true
      all_run_outputs_validated: true
      stage_output_present: false
    expected:
      outcome_code: STAGE_MD_OUTPUT_MISSING_OR_NOT_VALIDATED

  - case_id: stage_output_not_validated
    input:
      stage_output_present: true
      stage_output_validation_status: UNVALIDATED
    expected:
      outcome_code: STAGE_MD_OUTPUT_MISSING_OR_NOT_VALIDATED

  - case_id: stage_output_omits_early_segment
    input:
      required_run_units: [md.1, md.2]
      validated_run_outputs: [md.1, md.2]
      stage_output_included_runs: [md.2]
    expected:
      outcome_code: STAGE_MD_OUTPUT_SCOPE_OR_LINEAGE_INVALID

  - case_id: stage_output_derived_ids_wrong
    input:
      required_run_output_artifacts: [artifact-md1, artifact-md2]
      stage_output_derived_from: [artifact-md2]
    expected:
      outcome_code: STAGE_MD_OUTPUT_SCOPE_OR_LINEAGE_INVALID

  - case_id: dependency_cycle
    input:
      dependency_graph: {a: [b], b: [a]}
    expected:
      outcome_code: RUN_UNIT_SET_OR_DEPENDENCY_INVALID

  - case_id: directory_extra_run_not_in_scope
    input:
      route_required_runs: [md.1]
      directory_runs: [old.md.0, md.1]
    expected:
      required_runs_used: [md.1]
      old_run_auto_included: false

  - case_id: completion_does_not_claim_convergence
    input:
      all_technical_gates_pass: true
      convergence_analysis_present: false
    expected:
      outcome_code: MD_SIMULATION_WORKFLOW_COMPLETED
      scientific_convergence_claimed: false

  - case_id: completion_scope_missing
    input:
      route_id: null
      scope: null
    expected:
      component_status: BLOCKED
      outcome_code: COMPLETION_SCOPE_UNRESOLVED