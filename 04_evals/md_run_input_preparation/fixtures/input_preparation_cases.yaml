schema_version: 2
skill_name: md_run_input_preparation
cases:
  - case_id: final_mdp_file_unchanged
    input:
      protocol_validated: true
      plan_validated: true
      mdp_source_kind: FINAL_FILE
      source_hash_valid: true
      typed_overrides: []
      grompp_return_code: 0
      tpr_readable: true
    expected:
      status: DONE
      outcome_code: MD_RUN_INPUT_PREPARED
      rendered_mdp_hash_equals_source: true

  - case_id: template_exact_typed_rendering
    input:
      mdp_source_kind: TEMPLATE_WITH_TYPED_OVERRIDES
      template_hash_valid: true
      typed_overrides:
        - {parameter: ref_t, value_type: NUMBER, value: 300, unit: K}
        - {parameter: nsteps, value_type: INTEGER, value: 50000, unit: null}
      parameters_unique_in_template: true
      grompp_return_code: 0
    expected:
      status: DONE
      rendering_policy: EXACT_PARAMETER_REPLACEMENT
      undeclared_parameters_changed: []

  - case_id: duplicate_override_parameter
    input:
      typed_overrides:
        - {parameter: nsteps, value: 1000}
        - {parameter: nsteps, value: 2000}
    expected:
      status: BLOCKED
      outcome_code: MDP_TEMPLATE_OVERRIDE_INVALID

  - case_id: override_target_missing
    input:
      override_parameter: ref_p
      parameter_present_in_template: false
    expected:
      status: BLOCKED
      outcome_code: MDP_TEMPLATE_OVERRIDE_INVALID

  - case_id: free_text_replacement_rejected
    input:
      rendering_method: REGEX_REPLACE_ARBITRARY_TEXT
    expected:
      status: BLOCKED
      outcome_code: MDP_TEMPLATE_OVERRIDE_INVALID

  - case_id: protocol_or_plan_not_validated
    input:
      protocol_validated: true
      plan_validated: false
    expected:
      status: BLOCKED
      outcome_code: PROTOCOL_OR_PLAN_INVALID_OR_STALE

  - case_id: input_gate_blocked
    input:
      input_gate_status: BLOCKED_BY_UNRESOLVED_ITEM
    expected:
      status: BLOCKED
      outcome_code: RUN_UNIT_NOT_FOUND_OR_INPUT_GATE_BLOCKED

  - case_id: system_start_with_checkpoint
    input:
      start_state: SYSTEM
      input_checkpoint_present: true
    expected:
      status: BLOCKED
      outcome_code: RUN_INPUT_SOURCE_AMBIGUOUS_OR_INVALID

  - case_id: prior_output_source_valid
    input:
      start_state: PRIOR_RUN_OUTPUT
      source_run_unit_id: em.1
      source_run_output_validated: true
      dependency_closure: [em.1]
      source_structure_unique: true
    expected:
      status: DONE
      outcome_code: MD_RUN_INPUT_PREPARED

  - case_id: latest_checkpoint_not_auto_selected
    input:
      checkpoint_candidates: [a.cpt, b.cpt]
      selected_checkpoint_identity: null
    expected:
      status: BLOCKED
      outcome_code: RUN_INPUT_SOURCE_AMBIGUOUS_OR_INVALID

  - case_id: topology_include_missing
    input:
      missing_include_count: 1
    expected:
      status: BLOCKED
      outcome_code: TOPOLOGY_INCLUDE_INCOMPLETE

  - case_id: maxwarn_not_raised
    input:
      protocol_maxwarn: 0
      warning_count: 1
    expected:
      status: FAILED
      outcome_code: GROMPP_WARNING_LIMIT_EXCEEDED
      automatic_retry: false

  - case_id: runtime_version_recorded_not_protocolized
    input:
      actual_gromacs_version: 2026.1
      protocol_contains_runtime_version: false
    expected:
      status: DONE
      runtime_evidence_recorded: true
      protocol_modified: false

  - case_id: output_conflict
    input:
      output_tpr_exists_with_other_hash: true
    expected:
      status: BLOCKED
      outcome_code: RUN_INPUT_OUTPUT_CONFLICT

  - case_id: candidate_stays_unvalidated
    input:
      grompp_success: true
      validator_not_run: true
    expected:
      artifact_type: MD_INPUT
      validation_status: UNVALIDATED
      mdrun_invoked: false