schema_version: 1
skill_name: md_execution_attempt_specification
cases:
  - case_id: fresh_local_attempt
    input:
      attempt_id: attempt.001
      attempt_kind: FRESH
      parent_attempt_id: null
      checkpoint: null
      md_input_validated: true
      runtime_mode: SYNCHRONOUS
      backend: LOCAL
    expected:
      status: DONE
      outcome_code: EXECUTION_ATTEMPT_SPECIFIED

  - case_id: retry_same_input
    input:
      attempt_id: attempt.002
      attempt_kind: RETRY_SAME_INPUT
      parent_attempt_id: attempt.001
      tpr_matches_parent: true
      checkpoint: null
      replacement_reason_present: true
    expected:
      status: DONE
      prior_attempt_modified: false

  - case_id: continue_noappend
    input:
      attempt_id: attempt.002
      attempt_kind: CONTINUE_NOAPPEND
      parent_attempt_id: attempt.001
      tpr_matches_parent: true
      checkpoint_belongs_to_parent: true
      output_directory_is_new: true
    expected:
      status: DONE
      append_existing_outputs: false

  - case_id: continuation_without_checkpoint
    input:
      attempt_kind: CONTINUE_NOAPPEND
      parent_attempt_id: attempt.001
      checkpoint: null
    expected:
      status: BLOCKED
      outcome_code: CONTINUATION_CHECKPOINT_INVALID

  - case_id: fresh_with_parent
    input:
      attempt_kind: FRESH
      parent_attempt_id: attempt.000
    expected:
      status: BLOCKED
      outcome_code: ATTEMPT_KIND_INVALID

  - case_id: retry_uses_checkpoint
    input:
      attempt_kind: RETRY_SAME_INPUT
      parent_attempt_id: attempt.001
      checkpoint_present: true
    expected:
      status: BLOCKED
      outcome_code: ATTEMPT_KIND_INVALID

  - case_id: asynchronous_without_prepared_submission
    input:
      runtime_mode: ASYNCHRONOUS
      prepared_submission_id: null
    expected:
      status: BLOCKED
      outcome_code: PREPARED_SUBMISSION_IDENTITY_MISSING

  - case_id: implicit_gpu_selection
    input:
      gpu_ids: []
      profile_or_decision_present: false
      environment_has_gpu: true
    expected:
      status: BLOCKED
      outcome_code: BACKEND_OR_RESOURCE_UNRESOLVED

  - case_id: append_requested
    input:
      append_existing_engine_outputs: true
    expected:
      status: BLOCKED
      outcome_code: EXECUTION_COMMAND_POLICY_INVALID

  - case_id: attempt_directory_collision
    input:
      attempt_id: attempt.002
      output_directory_exists_with_other_spec: true
    expected:
      status: BLOCKED
      outcome_code: ATTEMPT_ID_OR_PATH_CONFLICT