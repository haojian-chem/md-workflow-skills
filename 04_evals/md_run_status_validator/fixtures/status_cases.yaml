schema_version: 2
skill_name: md_run_status_validator
cases:
  - case_id: lsf_attempt_running
    input:
      attempt_id: attempt.001
      execution_spec_id: exec-001
      backend: LSF
      previous_status: SUBMITTED
      raw_backend_state: RUN
      job_identity_matches: true
    expected:
      component_status: DONE
      outcome_code: ATTEMPT_STILL_ACTIVE
      recommended_status: RUNNING

  - case_id: slurm_attempt_terminal
    input:
      attempt_id: attempt.001
      backend: SLURM
      raw_backend_state: COMPLETED
      exit_code: 0
    expected:
      outcome_code: ATTEMPT_FINISHED_UNVERIFIED
      recommended_status: FINISHED_UNVERIFIED
      run_output_validated: false

  - case_id: pbs_attempt_failed
    input:
      attempt_id: attempt.002
      backend: PBS
      raw_backend_state: FAILED
      exit_code: 1
      failure_evidence_present: true
    expected:
      outcome_code: ATTEMPT_FAILED_WITH_EVIDENCE
      recommended_status: FAILED

  - case_id: tmux_attempt_active
    input:
      session_exists: true
      expected_process_exists: true
      attempt_directory_matches: true
    expected:
      outcome_code: ATTEMPT_STILL_ACTIVE
      recommended_status: RUNNING

  - case_id: tmux_missing_with_terminal_marker
    input:
      session_exists: false
      normal_terminal_evidence: true
      failure_evidence: false
    expected:
      outcome_code: ATTEMPT_FINISHED_UNVERIFIED

  - case_id: tmux_missing_without_terminal_evidence
    input:
      session_exists: false
      normal_terminal_evidence: false
      failure_evidence: false
    expected:
      outcome_code: ATTEMPT_STATUS_UNKNOWN
      automatic_resubmit_allowed: false

  - case_id: local_pid_reused
    input:
      pid_exists: true
      process_command_matches_execution_spec: false
    expected:
      outcome_code: ATTEMPT_STATUS_UNKNOWN

  - case_id: explicit_attempt_cancelled
    input:
      raw_backend_state: CANCELLED
      cancellation_evidence_present: true
    expected:
      outcome_code: ATTEMPT_CANCELLED_WITH_EVIDENCE
      recommended_status: CANCELLED

  - case_id: status_adapter_unavailable
    input:
      status_capability_available: false
      terminal_evidence_available: false
    expected:
      outcome_code: ATTEMPT_BACKEND_STATUS_CHECK_UNAVAILABLE
      recommended_status: UNKNOWN

  - case_id: submission_attempt_mismatch
    input:
      record_work_directory: 04_md_simulation/md.1/attempts/attempt.001
      spec_work_directory: 04_md_simulation/md.1/attempts/attempt.002
    expected:
      component_status: BLOCKED
      outcome_code: ATTEMPT_SUBMISSION_RECORD_MISMATCH

  - case_id: one_on_demand_check_only
    input:
      requested_retry_count: 10
    expected:
      checks_executed: 1
      sleep_called: false