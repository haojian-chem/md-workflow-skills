schema_version: 1
skill_name: md_run_status_validator
cases:
  - case_id: lsf_job_running
    input:
      backend: LSF
      previous_status: SUBMITTED
      raw_backend_state: RUN
      job_identity_matches: true
    expected:
      component_status: DONE
      outcome_code: RUN_STILL_ACTIVE
      recommended_status: RUNNING

  - case_id: slurm_job_completed
    input:
      backend: SLURM
      previous_status: RUNNING
      raw_backend_state: COMPLETED
      exit_code: 0
    expected:
      component_status: DONE
      outcome_code: RUN_FINISHED_UNVERIFIED
      recommended_status: FINISHED_UNVERIFIED

  - case_id: pbs_job_failed
    input:
      backend: PBS
      raw_backend_state: FAILED
      exit_code: 1
      failure_evidence_present: true
    expected:
      component_status: DONE
      outcome_code: RUN_FAILED_WITH_EVIDENCE
      recommended_status: FAILED

  - case_id: tmux_session_and_process_active
    input:
      backend: TMUX
      session_exists: true
      expected_process_exists: true
    expected:
      outcome_code: RUN_STILL_ACTIVE
      recommended_status: RUNNING

  - case_id: tmux_session_missing_normal_marker
    input:
      backend: TMUX
      session_exists: false
      normal_terminal_evidence: true
      failure_evidence: false
    expected:
      outcome_code: RUN_FINISHED_UNVERIFIED
      recommended_status: FINISHED_UNVERIFIED

  - case_id: tmux_session_missing_no_terminal_evidence
    input:
      backend: TMUX
      session_exists: false
      normal_terminal_evidence: false
      failure_evidence: false
    expected:
      outcome_code: RUN_STATUS_UNKNOWN
      recommended_status: UNKNOWN
      automatic_resubmit_allowed: false

  - case_id: local_pid_reused_by_other_process
    input:
      backend: LOCAL
      pid_exists: true
      command_identity_matches: false
    expected:
      outcome_code: RUN_STATUS_UNKNOWN
      recommended_status: UNKNOWN

  - case_id: explicit_cancelled_state
    input:
      backend: SLURM
      raw_backend_state: CANCELLED
    expected:
      outcome_code: RUN_CANCELLED_WITH_EVIDENCE
      recommended_status: CANCELLED

  - case_id: status_command_unavailable
    input:
      backend: LSF
      status_command_available: false
      terminal_evidence_available: false
    expected:
      component_status: DONE
      outcome_code: BACKEND_STATUS_CHECK_UNAVAILABLE
      recommended_status: UNKNOWN

  - case_id: submission_record_job_id_mismatch
    input:
      backend: PBS
      record_job_id: '100'
      evidence_job_id: '101'
    expected:
      component_status: BLOCKED
      outcome_code: SUBMISSION_RECORD_MISMATCH

  - case_id: no_polling_loop
    input:
      requested_check_mode: ON_DEMAND
      requested_retry_count: 10
    expected:
      checks_executed: 1
      sleep_called: false