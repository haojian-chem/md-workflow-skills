schema_version: 3
skill_name: md_simulation_workflow
cases:
  - case_id: missing_protocol_limits_route_to_protocol_gate
    input:
      system_validated: true
      protocol_validated: false
      scope: {start: WORKFLOW_ENTRY, end: WORKFLOW_EXIT}
    expected:
      fragment_status: PARTIAL
      step_ids: [specify_and_validate_simulation_protocol]
      invented_run_units: []

  - case_id: validated_protocol_without_plan
    input:
      protocol_validated: true
      plan_validated: false
    expected:
      decision: EXECUTE
      operation: md_simulation_plan_materialization
      validator: md_simulation_plan_validator

  - case_id: input_preparation_before_attempt
    input:
      plan_validated: true
      current_run_unit: md.1
      input_gate: READY
      md_input_validated: false
    expected:
      decision: EXECUTE
      operation: md_run_input_preparation
      validator: md_run_input_validator

  - case_id: validated_input_requires_attempt_spec
    input:
      current_run_unit: md.1
      md_input_validated: true
      current_attempt_spec_present: false
    expected:
      decision: EXECUTE
      operation: md_execution_attempt_specification
      validator: md_execution_attempt_validator
      attempt_kind: FRESH

  - case_id: execute_validated_attempt
    input:
      current_run_unit: md.1
      attempt_id: attempt.001
      attempt_spec_validated: true
      execution_not_started: true
    expected:
      decision: EXECUTE
      operation: md_run_execution
      validator: null

  - case_id: async_attempt_running_pauses
    input:
      attempt_id: attempt.001
      submission_status: RUNNING
      status_evidence_fresh: true
      status_refresh_required: false
    expected:
      decision: PAUSE
      next_task_unit: null

  - case_id: async_attempt_status_refresh
    input:
      attempt_id: attempt.001
      submission_status: UNKNOWN
      status_refresh_required: true
    expected:
      decision: EXECUTE
      validator: md_run_status_validator

  - case_id: terminal_attempt_requires_run_output_validation
    input:
      current_run_unit: md.1
      attempts:
        - {attempt_id: attempt.001, status: FINISHED_UNVERIFIED}
      run_output_validated: false
    expected:
      decision: EXECUTE
      validator: md_run_output_validator

  - case_id: incomplete_same_tpr_requests_new_attempt
    input:
      current_run_unit: md.1
      run_output_outcome: RUN_OUTPUT_TARGET_NOT_REACHED
      same_tpr_continuation_possible: true
      checkpoint_valid: true
    expected:
      route_revision_required: true
      next_attempt_id: attempt.002
      next_attempt_kind: CONTINUE_NOAPPEND
      protocol_revision_required: false

  - case_id: append_continuation_rejected
    input:
      requested_attempt_kind: CONTINUE_APPEND
    expected:
      decision: BLOCKED
      reason_contains: APPEND unsupported in v1

  - case_id: new_tpr_stays_in_md_simulation
    input:
      mdp_or_tpr_changed: true
      system_changed: false
    expected:
      route_revision_required: true
      target_workflow: md_simulation_workflow
      target_substep: specify_and_validate_simulation_protocol

  - case_id: system_change_returns_md_preparation
    input:
      system_topology_or_box_changed: true
    expected:
      route_revision_required: true
      target_workflow: md_preparation_workflow

  - case_id: workflow_exit_requires_stage_output_assembly
    input:
      all_required_run_outputs_validated: true
      stage_output_validated: false
      scope_end: WORKFLOW_EXIT
    expected:
      decision: EXECUTE
      operation: md_simulation_output_assembly
      validator: md_simulation_output_validator

  - case_id: segmented_production_stage_output_includes_all
    input:
      required_run_units: [md.1, md.2, md.3]
      validated_run_outputs: [md.1, md.2, md.3]
      stage_output_included_runs: [md.1, md.2, md.3]
    expected:
      early_segments_omitted: false
      stage_output_scope_matches: true

  - case_id: validated_stage_output_requires_completion_gate
    input:
      stage_output_validated: true
      completion_validator_passed: false
      scope_end: WORKFLOW_EXIT
    expected:
      decision: EXECUTE
      validator: md_simulation_completion_validator

  - case_id: workflow_complete
    input:
      protocol_validated: true
      plan_validated: true
      all_required_inputs_validated: true
      all_attempts_closed: true
      all_run_outputs_validated: true
      stage_output_validated: true
      completion_validator_passed: true
    expected:
      decision: COMPLETE
      workflow_status: DONE