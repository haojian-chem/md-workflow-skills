schema_version: 3
skill_name: md_run_execution
cases:
  - case_id: valid_local_fresh_attempt
    input:
      attempt_spec_validated: true
      attempt_id: attempt.001
      attempt_kind: FRESH
      md_input_validated: true
      backend: LOCAL
      mode: SYNCHRONOUS
      process_exit_code: 0
    expected:
      status: DONE
      outcome_code: ATTEMPT_PROCESS_FINISHED_UNVERIFIED
      artifact_candidates: []

  - case_id: valid_tmux_async_attempt
    input:
      attempt_spec_validated: true
      attempt_id: attempt.001
      backend: TMUX
      mode: ASYNCHRONOUS
      prepared_submission_id: prepared-1
      session_unique: true
      submission_accepted: true
    expected:
      status: DONE
      outcome_code: ATTEMPT_SUBMISSION_ACCEPTED

  - case_id: scheduler_attempt_accepted
    input:
      attempt_spec_validated: true
      backend: SLURM
      prepared_submission_id: prepared-2
      script_hash_valid: true
      job_id: '12345'
    expected:
      outcome_code: ATTEMPT_SUBMISSION_ACCEPTED

  - case_id: attempt_spec_not_validated
    input:
      attempt_spec_present: true
      attempt_spec_validated: false
    expected:
      status: BLOCKED
      outcome_code: EXECUTION_ATTEMPT_NOT_VALIDATED
      process_started: false

  - case_id: attempt_identity_mismatch
    input:
      task_attempt_id: attempt.002
      spec_attempt_id: attempt.001
    expected:
      status: BLOCKED
      outcome_code: EXECUTION_ATTEMPT_SPEC_MISSING_OR_INVALID

  - case_id: tpr_hash_mismatch
    input:
      spec_tpr_hash_matches_validated_input: false
    expected:
      status: BLOCKED
      outcome_code: ATTEMPT_INPUT_ARTIFACT_MISMATCH

  - case_id: continuation_checkpoint_missing
    input:
      attempt_kind: CONTINUE_NOAPPEND
      checkpoint_present: false
    expected:
      status: BLOCKED
      outcome_code: ATTEMPT_CHECKPOINT_MISSING_OR_MISMATCH

  - case_id: append_flag_in_command
    input:
      attempt_kind: CONTINUE_NOAPPEND
      final_argv_contains_append: true
    expected:
      status: BLOCKED
      outcome_code: EXECUTION_ATTEMPT_SPEC_MISSING_OR_INVALID

  - case_id: writes_prior_attempt_directory
    input:
      attempt_id: attempt.002
      output_path: 04_md_simulation/md.1/attempts/attempt.001/md.xtc
    expected:
      status: BLOCKED
      outcome_code: ATTEMPT_OUTPUT_CONFLICT

  - case_id: async_missing_prepared_submission
    input:
      mode: ASYNCHRONOUS
      prepared_submission_id: null
    expected:
      status: BLOCKED
      outcome_code: EXECUTION_ATTEMPT_SPEC_MISSING_OR_INVALID

  - case_id: unsupported_backend
    input:
      backend: OTHER
    expected:
      status: BLOCKED
      outcome_code: ATTEMPT_BACKEND_UNSUPPORTED_OR_UNAVAILABLE

  - case_id: scheduler_rejects_attempt
    input:
      backend: PBS
      submission_exit_code: 1
      job_id: null
    expected:
      status: FAILED
      outcome_code: ATTEMPT_SUBMISSION_REJECTED

  - case_id: submission_identity_unresolved
    input:
      backend: LSF
      submission_exit_code: 0
      job_id: null
    expected:
      status: BLOCKED
      outcome_code: ATTEMPT_SUBMISSION_ID_UNRESOLVED
      automatic_resubmit_allowed: false

  - case_id: synchronous_nonzero_exit
    input:
      mode: SYNCHRONOUS
      process_exit_code: 1
      fatal_evidence_present: true
    expected:
      status: FAILED
      outcome_code: ATTEMPT_PROCESS_EXITED_NONZERO

  - case_id: possible_submit_after_interruption
    input:
      result_missing: true
      partial_submission_evidence: true
      backend_object_may_exist: true
    expected:
      automatic_resubmit_allowed: false
      next_step: recovery_or_attempt_status_check