schema_version: 2
skill_name: md_simulation_protocol_validator
cases:
  - case_id: valid_final_file_protocol
    input:
      schema_v2_valid: true
      all_scientific_fields_match_sources: true
      field_provenance_complete: true
      runtime_fields_present: false
    expected:
      status: DONE
      outcome_code: SIMULATION_PROTOCOL_VALIDATED

  - case_id: valid_template_override_protocol
    input:
      source_kind: TEMPLATE_WITH_TYPED_OVERRIDES
      template_hash_valid: true
      overrides_typed_and_unique: true
      rendered_policy_exact: true
    expected:
      outcome_code: SIMULATION_PROTOCOL_VALIDATED

  - case_id: operation_report_not_trusted
    input:
      operation_report_says_complete: true
      actual_field_provenance_missing: true
    expected:
      outcome_code: PROTOCOL_FIELD_PROVENANCE_INVALID

  - case_id: implicit_nvt_npt_detected
    input:
      authoritative_run_units: [md.1]
      protocol_run_units: [nvt.1, npt.1, md.1]
    expected:
      outcome_code: PROTOCOL_IMPLICIT_DEFAULT_DETECTED

  - case_id: continuation_role_detected
    input:
      role: CONTINUATION
    expected:
      outcome_code: PROTOCOL_RUN_UNIT_OR_DAG_INVALID

  - case_id: system_checkpoint_detected
    input:
      start_state_source: SYSTEM
      input_checkpoint_present: true
    expected:
      outcome_code: PROTOCOL_START_STATE_INVALID

  - case_id: final_file_contains_overrides
    input:
      source_kind: FINAL_FILE
      typed_overrides_count: 1
    expected:
      outcome_code: PROTOCOL_MDP_SPEC_INVALID

  - case_id: template_override_not_typed
    input:
      source_kind: TEMPLATE_WITH_TYPED_OVERRIDES
      override_value_type: null
    expected:
      outcome_code: PROTOCOL_MDP_SPEC_INVALID

  - case_id: target_mode_without_target
    input:
      completion_mode: TARGET_STEP_OR_TIME
      target_nsteps: null
      target_time_ps: null
    expected:
      outcome_code: PROTOCOL_COMPLETION_CRITERIA_INVALID

  - case_id: role_specific_mode_without_check
    input:
      completion_mode: ROLE_SPECIFIC
      checks: []
    expected:
      outcome_code: PROTOCOL_COMPLETION_CRITERIA_INVALID

  - case_id: backend_field_misplaced
    input:
      protocol_contains_backend_type: SLURM
    expected:
      outcome_code: PROTOCOL_RUNTIME_FIELD_MISPLACED

  - case_id: resource_field_misplaced
    input:
      protocol_contains_gpu_ids: ['0']
    expected:
      outcome_code: PROTOCOL_RUNTIME_FIELD_MISPLACED

  - case_id: deferred_input_gate_valid
    input:
      unresolved_item:
        blocking_stage: INPUT_PREPARATION
        affected_run_unit_ids: [md.1]
        affected_field_paths: [run_units[0].preprocessing_policy.require_index]
    expected:
      outcome_code: SIMULATION_PROTOCOL_VALIDATED_WITH_DEFERRED_GATES

  - case_id: scientific_field_misclassified_as_attempt
    input:
      unresolved_item:
        field: run_units[0].completion_criteria.target_time_ps
        blocking_stage: ATTEMPT_SPECIFICATION
    expected:
      outcome_code: PROTOCOL_UNRESOLVED_ITEM_MISCLASSIFIED

  - case_id: provenance_source_missing
    input:
      field_provenance_source_exists: false
    expected:
      outcome_code: PROTOCOL_FIELD_PROVENANCE_INVALID

  - case_id: valid_revision
    input:
      supersedes_spec_id: protocol.v1
      revision_reason_present: true
      old_spec_unchanged: true
      new_path_unique: true
    expected:
      outcome_code: SIMULATION_PROTOCOL_VALIDATED

  - case_id: revision_overwrites_old_spec
    input:
      new_path_equals_old_path: true
    expected:
      outcome_code: PROTOCOL_REVISION_CHAIN_INVALID