schema_version: 3
skill_name: md_run_output_validator
cases:
  - case_id: single_fresh_attempt_validates
    input:
      protocol_plan_input_valid: true
      attempts:
        - {attempt_id: attempt.001, kind: FRESH, status: FINISHED_UNVERIFIED, parent: null}
      required_attempt_outputs_valid: true
      final_step: 1000000
      target_nsteps: 1000000
      blocking_checks_pass: true
    expected:
      outcome_code: MD_RUN_OUTPUT_VALIDATED
      accepted_attempt_order: [attempt.001]
      artifact_candidate_type: MD_OUTPUT

  - case_id: fresh_plus_noappend_continuation
    input:
      attempts:
        - {attempt_id: attempt.001, kind: FRESH, status: FINISHED_UNVERIFIED, parent: null, final_step: 600000}
        - {attempt_id: attempt.002, kind: CONTINUE_NOAPPEND, status: FINISHED_UNVERIFIED, parent: attempt.001, final_step: 1000000}
      same_tpr: true
      checkpoint_continuity: true
      step_time_continuity: true
      target_nsteps: 1000000
    expected:
      outcome_code: MD_RUN_OUTPUT_VALIDATED
      accepted_attempt_order: [attempt.001, attempt.002]
      both_attempt_segments_in_candidate: true

  - case_id: active_attempt_blocks
    input:
      attempts:
        - {attempt_id: attempt.001, status: RUNNING}
    expected:
      component_status: BLOCKED
      outcome_code: RUN_OUTPUT_ACTIVE_OR_UNKNOWN_ATTEMPT

  - case_id: unknown_attempt_blocks
    input:
      attempts:
        - {attempt_id: attempt.001, status: UNKNOWN}
    expected:
      outcome_code: RUN_OUTPUT_ACTIVE_OR_UNKNOWN_ATTEMPT

  - case_id: retry_supersedes_failed_root
    input:
      attempts:
        - {attempt_id: attempt.001, kind: FRESH, status: FAILED}
        - {attempt_id: attempt.002, kind: RETRY_SAME_INPUT, status: FINISHED_UNVERIFIED, parent: attempt.001}
      replacement_decision_present: true
      attempt_002_outputs_valid: true
    expected:
      accepted_attempt_order: [attempt.002]
      excluded_attempts: [attempt.001]

  - case_id: two_successful_retry_branches_unresolved
    input:
      attempts:
        - {attempt_id: attempt.001, kind: FRESH, status: FAILED}
        - {attempt_id: attempt.002, kind: RETRY_SAME_INPUT, status: FINISHED_UNVERIFIED, parent: attempt.001}
        - {attempt_id: attempt.003, kind: RETRY_SAME_INPUT, status: FINISHED_UNVERIFIED, parent: attempt.001}
      branch_selection_decision: null
    expected:
      outcome_code: RUN_OUTPUT_ATTEMPT_BRANCH_UNRESOLVED
      gate_recommendation: PAUSE_FOR_DECISION

  - case_id: continuation_checkpoint_not_parent
    input:
      attempt_002_kind: CONTINUE_NOAPPEND
      attempt_002_parent: attempt.001
      checkpoint_belongs_to_attempt: attempt.000
    expected:
      outcome_code: RUN_OUTPUT_CHECKPOINT_CHAIN_INVALID

  - case_id: tpr_changes_between_continuation_attempts
    input:
      attempt_001_tpr_hash: aaa
      attempt_002_tpr_hash: bbb
    expected:
      outcome_code: RUN_OUTPUT_INPUT_OR_COMMAND_MISMATCH

  - case_id: noappend_output_overwrites_parent
    input:
      attempt_002_output_path_inside_attempt_001: true
    expected:
      outcome_code: RUN_OUTPUT_CROSS_FILE_INCONSISTENCY

  - case_id: step_time_not_continuous
    input:
      attempt_001_final_step: 600000
      attempt_002_first_step: 500000
    expected:
      outcome_code: RUN_OUTPUT_STEP_OR_TIME_CONTINUITY_INVALID

  - case_id: target_not_reached_continuation_possible
    input:
      accepted_final_step: 900000
      target_nsteps: 1000000
      valid_final_checkpoint: true
      same_tpr_continuation_possible: true
    expected:
      outcome_code: RUN_OUTPUT_TARGET_NOT_REACHED
      route_revision_recommendation: CONTINUE_NOAPPEND

  - case_id: required_attempt_trajectory_missing
    input:
      required_output_role: TRAJECTORY_COMPRESSED
      required_output_exists: false
    expected:
      outcome_code: RUN_OUTPUT_REQUIRED_ATTEMPT_FILE_MISSING

  - case_id: trajectory_truncated
    input:
      trajectory_readable: false
    expected:
      outcome_code: RUN_OUTPUT_FILE_UNREADABLE_OR_TRUNCATED

  - case_id: fatal_marker_detected
    input:
      normal_marker_present: true
      fatal_marker_present: true
    expected:
      outcome_code: RUN_OUTPUT_FATAL_OR_NONZERO_EXIT

  - case_id: explicit_metric_fails
    input:
      metric_registered: true
      blocking_check_status: FAIL
    expected:
      outcome_code: RUN_OUTPUT_ROLE_SPECIFIC_CHECK_FAILED

  - case_id: no_implicit_metric
    input:
      explicit_checks: []
      measured_max_force: 1200
    expected:
      implicit_check_added: false

  - case_id: failed_attempt_files_excluded
    input:
      attempts:
        - {attempt_id: attempt.001, classification: FAILED}
        - {attempt_id: attempt.002, classification: ACCEPTED}
    expected:
      candidate_includes_attempts: [attempt.002]
      candidate_excludes_attempts: [attempt.001]

  - case_id: new_tpr_required_stays_in_simulation
    input:
      new_tpr_required: true
      system_change_required: false
    expected:
      route_revision_target_workflow: md_simulation_workflow
      route_revision_target_substep: specify_and_validate_simulation_protocol