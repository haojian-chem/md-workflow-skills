schema_version: 3
skill_name: md_simulation_plan_materialization
cases:
  - case_id: single_run_projection
    input:
      protocol_validated: true
      protocol_run_units:
        - {run_unit_id: em.1, role: ENERGY_MINIMIZATION, depends_on: [], source_type: SYSTEM}
    expected:
      status: DONE
      outcome_code: SIMULATION_PLAN_MATERIALIZED
      projected_run_units: [em.1]

  - case_id: segmented_production_projection
    input:
      protocol_validated: true
      protocol_run_units:
        - {run_unit_id: md.1, role: PRODUCTION, depends_on: [], source_type: SYSTEM}
        - {run_unit_id: md.2, role: PRODUCTION, depends_on: [md.1], source_type: PRIOR_RUN_OUTPUT}
    expected:
      dependency_order: [md.1, md.2]
      invented_run_units: []

  - case_id: protocol_not_validated
    input:
      protocol_validation_outcome: PROTOCOL_IMPLICIT_DEFAULT_DETECTED
    expected:
      status: BLOCKED
      outcome_code: VALIDATED_PROTOCOL_MISSING_OR_INVALID

  - case_id: stale_protocol
    input:
      protocol_validated: true
      protocol_superseded: true
    expected:
      status: BLOCKED
      outcome_code: VALIDATED_PROTOCOL_MISSING_OR_INVALID

  - case_id: deferred_input_gate_projection
    input:
      protocol_unresolved_items:
        - {item_id: index.1, blocking_stage: INPUT_PREPARATION, affected_run_unit_ids: [md.1]}
    expected:
      run_unit_id: md.1
      input_gate_status: BLOCKED_BY_UNRESOLVED_ITEM
      attempt_gate_status: READY

  - case_id: deferred_attempt_gate_projection
    input:
      protocol_unresolved_items:
        - {item_id: backend.1, blocking_stage: ATTEMPT_SPECIFICATION, affected_run_unit_ids: [md.1]}
    expected:
      run_unit_id: md.1
      input_gate_status: READY
      attempt_gate_status: BLOCKED_BY_UNRESOLVED_ITEM

  - case_id: plan_does_not_copy_mdp_fields
    input:
      protocol_contains_mdp_spec: true
    expected:
      plan_contains_mdp_spec: false
      protocol_is_scientific_owner: true

  - case_id: plan_does_not_embed_runtime
    input:
      runtime_profile_available: true
      backend_available: SLURM
    expected:
      plan_contains_backend: false
      plan_contains_resources: false

  - case_id: plan_does_not_store_progress
    input:
      existing_md_input_validated: true
      existing_attempt_running: true
    expected:
      plan_contains_input_status: false
      plan_contains_attempt_status: false

  - case_id: duplicate_run_unit_id
    input:
      protocol_run_unit_ids: [md.1, md.1]
    expected:
      status: BLOCKED
      outcome_code: PLAN_RUN_UNIT_OR_DAG_INVALID

  - case_id: dependency_cycle
    input:
      dependencies: {md.1: [md.2], md.2: [md.1]}
    expected:
      status: BLOCKED
      outcome_code: PLAN_RUN_UNIT_OR_DAG_INVALID

  - case_id: prior_output_not_dependency
    input:
      run_unit_id: md.2
      depends_on: []
      source_run_unit_id: md.1
    expected:
      status: BLOCKED
      outcome_code: PLAN_RUN_UNIT_OR_DAG_INVALID

  - case_id: path_collision
    input:
      run_directories: [04_md_simulation/md.1, 04_md_simulation/md.1]
    expected:
      status: BLOCKED
      outcome_code: PLAN_PATH_CONFLICT

  - case_id: plan_revision_preserves_old
    input:
      old_plan_id: plan.v1
      new_output_path: 04_md_simulation/00_plan/plan.v2.yaml
      revision_reason_present: true
    expected:
      status: DONE
      supersedes_plan_id: plan.v1
      old_plan_modified: false

  - case_id: backend_change_does_not_require_plan_revision
    input:
      protocol_unchanged: true
      run_projection_unchanged: true
      backend_changed: true
    expected:
      new_plan_required: false
      new_attempt_spec_required: true