schema_version: 3
skill_name: md_simulation_plan_validator
cases:
  - case_id: exact_projection_valid
    input:
      protocol_validation_outcome: SIMULATION_PROTOCOL_VALIDATED
      protocol_run_units: [em.1, md.1]
      plan_projection_run_units: [em.1, md.1]
      dag_valid: true
      paths_valid: true
      gates_valid: true
    expected:
      status: DONE
      outcome_code: SIMULATION_PLAN_VALIDATED

  - case_id: deferred_attempt_gate_valid
    input:
      protocol_validation_outcome: SIMULATION_PROTOCOL_VALIDATED_WITH_DEFERRED_GATES
      unresolved_item:
        item_id: backend.1
        blocking_stage: ATTEMPT_SPECIFICATION
        affected_run_unit_ids: [md.1]
      plan_attempt_gate: BLOCKED_BY_UNRESOLVED_ITEM
    expected:
      outcome_code: SIMULATION_PLAN_VALIDATED_WITH_DEFERRED_GATES

  - case_id: missing_protocol_validation
    input:
      protocol_validation_result_present: false
    expected:
      outcome_code: PLAN_PROTOCOL_OR_SYSTEM_MISMATCH

  - case_id: extra_default_run_unit
    input:
      protocol_run_units: [md.1]
      plan_projection_run_units: [nvt.1, npt.1, md.1]
    expected:
      outcome_code: PLAN_PROJECTION_SET_MISMATCH

  - case_id: missing_run_projection
    input:
      protocol_run_units: [eq.1, md.1]
      plan_projection_run_units: [md.1]
    expected:
      outcome_code: PLAN_PROJECTION_SET_MISMATCH

  - case_id: dependency_cycle
    input:
      dependencies: {a: [b], b: [a]}
    expected:
      outcome_code: PLAN_DAG_OR_START_STATE_INVALID

  - case_id: prior_source_not_dependency
    input:
      run_unit_id: md.2
      source_run_unit_id: md.1
      dependency_closure: []
    expected:
      outcome_code: PLAN_DAG_OR_START_STATE_INVALID

  - case_id: invalid_attempts_directory
    input:
      run_unit_id: md.1
      attempts_directory: 04_md_simulation/md.2/attempts
    expected:
      outcome_code: PLAN_PATH_CONFLICT

  - case_id: management_path_used
    input:
      run_directory: 00_project_records/md.1
    expected:
      outcome_code: PLAN_PATH_CONFLICT

  - case_id: wrong_input_gate_projection
    input:
      protocol_item:
        blocking_stage: INPUT_PREPARATION
        affected_run_unit_ids: [md.1]
      plan_input_gate: READY
    expected:
      outcome_code: PLAN_GATE_PROJECTION_INVALID

  - case_id: plan_copies_mdp_spec
    input:
      plan_contains_field: run_unit_projection[0].mdp_spec
    expected:
      outcome_code: PLAN_OWNER_SEPARATION_VIOLATION

  - case_id: plan_copies_completion_target
    input:
      plan_contains_field: run_unit_projection[0].completion_criteria.target_time_ps
    expected:
      outcome_code: PLAN_OWNER_SEPARATION_VIOLATION

  - case_id: plan_embeds_backend
    input:
      plan_contains_backend_type: SLURM
    expected:
      outcome_code: PLAN_OWNER_SEPARATION_VIOLATION

  - case_id: plan_embeds_input_status
    input:
      plan_contains_input_preparation_status: VALIDATED
    expected:
      outcome_code: PLAN_RUNTIME_STATUS_EMBEDDED

  - case_id: plan_embeds_running_attempt
    input:
      plan_contains_attempt_status: RUNNING
    expected:
      outcome_code: PLAN_RUNTIME_STATUS_EMBEDDED

  - case_id: valid_revision
    input:
      old_plan_id: plan.v1
      new_supersedes_plan_id: plan.v1
      revision_reason_present: true
      old_plan_unchanged: true
      new_path_unique: true
    expected:
      outcome_code: SIMULATION_PLAN_VALIDATED

  - case_id: revision_overwrites_old_path
    input:
      new_path_equals_old_path: true
    expected:
      outcome_code: PLAN_REVISION_CHAIN_INVALID