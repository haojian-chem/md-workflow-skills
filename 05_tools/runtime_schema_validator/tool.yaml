schema_version: 1
name: runtime_schema_validator
version: 0.1.0
status: ACTIVE
owner: 00_authoring/md-workflow-tool-authoring/SKILL.md
entrypoint: validate.py
purpose:
  - validate runtime project records with shared contracts
  - avoid repeated LLM-based field inspection
  - cache schema meta-validation by content hash
  - validate candidate files against their future logical project paths
modes:
  FAST:
    scope: explicitly changed runtime instances and direct references
    requires_changed_paths: true
  FULL:
    scope: all recognized runtime instances plus optional candidate overlays and project-level references
    requires_changed_paths: false
inputs:
  - project_root
  - contracts_dir_from_skill_architecture_root
  - mode
  - changed_paths
  - optional schema overrides
  - optional actual-to-logical path mappings
outputs:
  format: json
  fields:
    - status
    - mode
    - schema_bundle_hash
    - schema_cache_hit
    - validated
    - errors
    - warnings
    - elapsed_ms
  caller_audit_must_record:
    - tool_name
    - tool_version
    - project_root
    - contracts_dir
permissions:
  read:
    - 03_contracts/** under Skill architecture root
    - 00_project_state/** under MD project root
    - 00_project_records/** under MD project root
    - explicitly supplied candidate paths
  write:
    - .md_workflow_cache/runtime_schema_validator/** under MD project root
    - explicit output path
side_effects:
  project_authoritative_files_modified: false
cache:
  enabled: true
  key: SHA-256 over all applicable schema file contents
  location: .md_workflow_cache/runtime_schema_validator/
candidate_overlay:
  cli_option: --logical-map ACTUAL_PATH=PROJECT_PATH
  semantics:
    - infer schema from the future logical path
    - include candidate IDs and paths in direct-reference checks
    - do not modify the future target
error_model:
  pass_exit_code: 0
  validation_failure_exit_code: 1
  tool_failure_exit_code: 2
compatibility:
  minimum_python: '3.10'
  dependencies:
    - PyYAML
    - jsonschema
security:
  network_access: false
  follows_symlinks: false
  arbitrary_code_execution: false
tests:
  path: 04_evals/runtime_schema_validator/
  evidence: 04_evals/runtime_schema_validator/VALIDATION.md
  tested_code_blob_sha: 7f22d0419b16bdd5cb6e4a7bcf433da4703ff36b
  tested_test_blob_sha: cfe72649429a616c6581cf1ebd33f0fdc2615349
  result: 5 passed
benchmark:
  evidence: 04_evals/runtime_schema_validator/VALIDATION.md
  fast_cold_median_ms: 5.977
  fast_warm_median_ms: 3.311
  full_warm_median_ms: 4.181
release:
  active_by_default: true
  activated_at: '2026-07-23'
  activation_evidence:
    - executable fixtures passed
    - FAST and FULL benchmark recorded
    - candidate overlay test passed
    - no false PASS in negative fixtures
  remaining_non_blocking_work:
    - Manager end-to-end integration test
    - real-project scale benchmark