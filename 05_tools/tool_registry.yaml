schema_version: 1
status: draft

tools:
  - name: runtime_schema_validator
    version: 0.1.0
    status: ACTIVE
    path: 05_tools/runtime_schema_validator
    entrypoint: 05_tools/runtime_schema_validator/validate.py
    callers:
      - md_workflow_manager
      - md-workflow-tool-authoring
    capabilities:
      - FAST runtime instance validation
      - FULL project runtime validation
      - schema bundle hash cache
      - direct runtime reference checks
      - candidate actual-to-logical path overlays
    read_paths:
      - 03_contracts/**
      - 00_project_state/**
      - 00_project_records/**
      - explicitly supplied candidate paths
    write_paths:
      - .md_workflow_cache/runtime_schema_validator/**
      - explicit output path
    tests: 04_evals/runtime_schema_validator/
    validation_evidence: 04_evals/runtime_schema_validator/VALIDATION.md
    active_by_default: true
    notes:
      - Executable fixtures passed and FAST/FULL benchmark recorded on 2026-07-23.
      - Manager end-to-end integration remains pending but does not block Tool activation.

  - name: state_transaction
    version: 0.1.0
    status: DESIGNED
    path: 05_tools/state_transaction
    entrypoint: null
    callers:
      - md_workflow_manager
    capabilities:
      - candidate state validation
      - backup and rollback preparation
      - controlled multi-file state commit
    read_paths:
      - 03_contracts/**
      - 00_project_state/**
    write_paths:
      - 00_project_state/**
    tests: 04_evals/state_transaction/
    active_by_default: false
    notes:
      - Optional lower-level transaction capability; R4 runtime_record_committer may reuse or supersede part of this design.

  - name: incremental_reference_checker
    version: 0.1.0
    status: DESIGNED
    path: 05_tools/incremental_reference_checker
    entrypoint: null
    callers:
      - md_workflow_manager
      - runtime_schema_validator
    capabilities:
      - direct changed-object reference checks
      - project-wide reference scan
    read_paths:
      - 00_project_state/**
      - 00_project_records/**
    write_paths: []
    tests: 04_evals/incremental_reference_checker/
    active_by_default: false

  - name: task_closure_renderer
    version: 0.1.0
    status: DESIGNED
    path: 05_tools/task_closure_renderer
    entrypoint: null
    callers:
      - md_workflow_manager
    capabilities:
      - deterministic task closure summary generation
      - artifact validation status preservation
    read_paths:
      - explicit task result and related records
    write_paths: []
    tests: 04_evals/task_closure_renderer/
    active_by_default: false

  - name: runtime_projection_compiler
    version: 0.1.0
    status: ACTIVE
    path: 05_tools/runtime_projection_compiler
    entrypoint: 05_tools/runtime_projection_compiler/compile_runtime.py
    callers:
      - md-workflow-tool-authoring
      - md-workflow-skill-authoring
    capabilities:
      - compile authoritative machine-readable authoring sources into compact runtime projections
      - enforce guarded-source Git blob identities before writes
      - record source Git blob provenance
      - detect runtime projection drift
      - validate runtime manifest/spec references and output-root confinement
    read_paths:
      - AGENTS.md
      - 00_manager/**
      - 01_workflows/**
      - 00_authoring/runtime_projection_config.yaml
      - 03_contracts/** configured by the projection
      - 05_tools/tool_registry.yaml
    write_paths:
      - runtime/**
    tests: 04_evals/runtime_projection_compiler/
    validation_evidence: 04_evals/runtime_projection_compiler/VALIDATION.md
    active_by_default: true
    notes:
      - Executable BUILD/CHECK, drift, source-guard, path-safety and idempotency fixtures passed on 2026-08-09.
      - Runtime projections are generated and remain non-authoritative; semantic authority stays in guarded authoring sources.

  - name: runtime_record_committer
    version: 0.1.0
    status: ACTIVE
    path: 05_tools/runtime_record_committer
    entrypoint: 05_tools/runtime_record_committer/commit_records.py
    callers:
      - md_workflow_manager
    capabilities:
      - deterministic task result record construction
      - terminal event construction
      - artifact/decision/submission record construction from explicit semantic inputs
      - Workstream state delta application
      - one candidate FAST validation integration
      - controlled management-record commit with rollback
      - compact commit receipt
    read_paths:
      - 03_contracts/** through runtime_schema_validator
      - target Workstream state and immutable task record
      - existing event log
      - explicit business artifact candidate files
    write_paths:
      - 00_project_state/workstreams/**
      - 00_project_records/workstreams/**
      - 00_project_records/events/project_events.jsonl
      - 00_project_records/.runtime_record_committer/**
    tests: 04_evals/runtime_record_committer/
    validation_evidence: 04_evals/runtime_record_committer/VALIDATION.md
    active_by_default: true
    design_protocol: 00_authoring/md-workflow-skill-authoring/references/runtime_record_commit_protocol.md
    notes:
      - ACTIVE only for ordinary foreground task closure in v0.1.0.
      - Does not update project_state, revise routes, infer scientific validation, or decide recovery semantics.
      - GitHub Actions run 31307633657 passed 7 acceptance tests with the real runtime_schema_validator; median closure time was 437.781 ms.

  - name: route_fast_path_evaluator
    version: 0.1.0
    status: ACTIVE
    path: 05_tools/route_fast_path_evaluator
    entrypoint: 05_tools/route_fast_path_evaluator/evaluate.py
    callers:
      - md_workflow_manager
    capabilities:
      - evaluate ADVANCE vs REENTER_WORKFLOW vs STOP_SCOPE vs BLOCKED
      - verify current route node and Workstream position consistency
      - check direct gate/artifact/decision/conditional fast-path conditions
      - produce compact route progression evidence and explicit next route position
    read_paths:
      - explicit active route
      - explicit current Workstream state
      - explicit task/result terminal summary
      - runtime/workflows/**
      - explicit evaluation context
    write_paths: []
    tests: 04_evals/route_fast_path_evaluator/
    validation_evidence: 04_evals/route_fast_path_evaluator/VALIDATION.md
    active_by_default: true
    design_protocol: 00_manager/md_workflow_manager/references/route_fast_path_protocol.md
    notes:
      - Cannot make scientific judgments or create route revisions; semantic triggers return REENTER_WORKFLOW.
      - GitHub Actions run 31307887115 passed 10 tests including R4 integration; median normal ADVANCE evaluation was 18.395 ms.

  - name: source_recognition_deterministic
    version: 0.1.0
    status: ACTIVE
    path: 05_tools/source_recognition_deterministic
    entrypoint: 05_tools/source_recognition_deterministic/run.py
    callers:
      - md_workflow_manager
      - structure_preparation_workflow
    logical_responsibility:
      layer: operation
      skill_name: source_recognition
      semantic_owner: 02_operations/source_recognition/SKILL.md
    capabilities:
      - bounded local PDB/CIF/mmCIF source recognition
      - deterministic unique-source selection
      - default atomic copy and SHA-256 integrity verification
      - identical-destination reuse
      - deterministic source ambiguity and destination-conflict confirmation generation
      - subagent_result-v2-shaped source_recognition responsibility result
    read_paths:
      - explicit task.yaml
      - task-authorized source_candidate files
      - 02_operations/source_recognition/SKILL.md for semantic guard
    write_paths:
      - task-authorized source_recognition business work_directory only
    tests: 04_evals/source_recognition_deterministic/
    validation_evidence: 04_evals/source_recognition_deterministic/VALIDATION.md
    active_by_default: true
    notes:
      - GitHub Actions run 31308634688 passed 8 tests including deterministic 1.1 -> R5 -> R4 integration.
      - Unique-copy business internal median was 8.207 ms; process wall median was 69.448 ms.
      - Explicit controlled move requests and unsupported semantic cases fall back to AGENT_TASK.
      - Tool refuses to run if source_recognition SKILL.md no longer matches guarded semantic-owner blob.

  - name: runtime_dependency_preflight
    version: 0.1.0
    status: ACTIVE
    path: 05_tools/runtime_dependency_preflight
    entrypoint: 05_tools/runtime_dependency_preflight/check.py
    callers:
      - md_workflow_manager
      - structure_preparation_workflow
    capabilities:
      - pre-Agent Python import/distribution/version dependency checks from guarded JSON manifests
      - structured PASS/BLOCKED/ERROR result without depending on checked third-party packages
      - subagent_result-v2-shaped logical blocker responsibility result for Operation/Validator owners
      - exact Git-blob guard for owner Skill and requirements source
    read_paths:
      - explicit dependency manifest inside skill root
      - guarded owner Skill file
      - guarded requirements file
      - Python import/distribution metadata
    write_paths: []
    tests: 04_evals/runtime_dependency_preflight/
    validation_evidence: 04_evals/runtime_dependency_preflight/VALIDATION.md
    active_by_default: true
    notes:
      - Python standard-library-only implementation remains runnable when gemmi/PyYAML/jsonschema/referencing are missing.
      - GitHub Actions run 31309006535 passed 6 tests including BLOCKED -> ACTIVE R4 WAITING/DEPENDENCY closure.
      - Real stage-1.2 dependency preflight internal median was 167.951 ms; subprocess wall median was 228.170 ms.
      - Does not install packages, inspect PDB content, execute scientific classification, or launch Agent contexts.

  - name: runtime_task_builder
    version: 0.1.0
    status: ACTIVE
    path: 05_tools/runtime_task_builder
    entrypoint: 05_tools/runtime_task_builder/build_task.py
    callers:
      - md_workflow_manager
      - structure_preparation_workflow
    capabilities:
      - deterministic source_recognition task.yaml construction from active route and bounded explicit local sources
      - source_candidate file_record packaging
      - candidate FAST schema validation before atomic task commit
      - compact task-build receipt
    read_paths:
      - explicit active route
      - explicit bounded local source files
      - runtime/workflows/structure_preparation.runtime.yaml
      - 03_contracts/** through runtime_schema_validator
    write_paths:
      - 00_project_records/workstreams/**/tasks/**/task.yaml
    tests: 04_evals/runtime_task_builder/
    active_by_default: true
    notes:
      - GitHub Actions run 31336417680 passed 5 acceptance tests including builder -> source_recognition_deterministic integration.
      - Subprocess wall median was 336.715 ms; runtime_schema_validator internal median was 133.047 ms.
      - v0.1.0 supports source_recognition only; expansion to other nodes requires separate acceptance evidence.
