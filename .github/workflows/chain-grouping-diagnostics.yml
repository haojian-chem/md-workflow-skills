name: chain-grouping-diagnostics

on:
  push:
    branches:
      - fix/classification-polymer-chain-grouping
    paths:
      - ".github/workflows/chain-grouping-diagnostics.yml"
      - "04_evals/component_and_residue_classification_validator/test_v1_2_chain_grouping.py"
      - "02_validators/component_and_residue_classification_validator/scripts/classification_engine.py"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/classification-polymer-chain-grouping
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r 02_validators/component_and_residue_classification_validator/scripts/requirements.txt
          python -m pip install pytest
      - name: Run grouping test and save log
        id: grouping_test
        continue-on-error: true
        run: |
          pytest -q -vv 04_evals/component_and_residue_classification_validator/test_v1_2_chain_grouping.py > 04_evals/component_and_residue_classification_validator/CHAIN_GROUPING_TEST_LOG.txt 2>&1
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04_evals/component_and_residue_classification_validator/CHAIN_GROUPING_TEST_LOG.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record polymer chain grouping diagnostic result"
            git push origin HEAD:fix/classification-polymer-chain-grouping
          fi
      - name: Fail when grouping test failed
        if: steps.grouping_test.outcome == 'failure'
        run: exit 1
