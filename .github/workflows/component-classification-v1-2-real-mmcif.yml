name: component-classification-v1-2-real-mmcif

on:
  pull_request:
    paths:
      - "01_structure_preparation/1.2_component_and_residue_classification/**"
      - "04_evals/component_and_residue_classification_validator/test_v1_2_real_mmcif_acceptance.py"
      - ".github/workflows/component-classification-v1-2-real-mmcif.yml"
  workflow_dispatch:

jobs:
  real-mmcif-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 01_structure_preparation/1.2_component_and_residue_classification/scripts/requirements.txt
          python -m pip install pytest
      - name: Download official RCSB mmCIF entries
        run: |
          set -euo pipefail
          mkdir -p real_mmcif_inputs
          for pdb_id in 1VNS 1A6M 1CRN; do
            curl --fail --location --retry 5 --retry-all-errors \
              --output "real_mmcif_inputs/${pdb_id}.cif" \
              "https://files.rcsb.org/download/${pdb_id}.cif"
          done
          sha256sum real_mmcif_inputs/*.cif | tee real_mmcif_inputs/sha256sums.txt
          {
            echo "downloaded_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_1VNS=https://files.rcsb.org/download/1VNS.cif"
            echo "source_1A6M=https://files.rcsb.org/download/1A6M.cif"
            echo "source_1CRN=https://files.rcsb.org/download/1CRN.cif"
          } | tee real_mmcif_inputs/provenance.txt
      - name: Run real mmCIF acceptance
        env:
          V1_2_REAL_MMCIF_DIR: ${{ github.workspace }}/real_mmcif_inputs
        run: |
          set -o pipefail
          mkdir -p real_mmcif_outputs
          pytest -q \
            04_evals/component_and_residue_classification_validator/test_v1_2_real_mmcif_acceptance.py \
            --basetemp=real_mmcif_outputs/pytest_tmp \
            2>&1 | tee real_mmcif_outputs/pytest.log
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-classification-v1-2-real-mmcif-${{ github.run_id }}
          path: |
            real_mmcif_inputs/sha256sums.txt
            real_mmcif_inputs/provenance.txt
            real_mmcif_outputs/
          if-no-files-found: warn
          retention-days: 30
