name: apply-terminal-rtp-patch

on:
  push:
    branches:
      - feature/terminal-rtp-selection
    paths:
      - "04_evals/component_and_residue_classification_validator/apply_terminal_rtp_patch.py"
      - ".github/workflows/apply-terminal-rtp-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/terminal-rtp-selection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python 04_evals/component_and_residue_classification_validator/apply_terminal_rtp_patch.py
      - name: Commit patched engine
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 02_validators/component_and_residue_classification_validator/scripts/classification_engine.py
          git commit -m "Use explicit terminal RTP templates during classification"
          git push origin HEAD:feature/terminal-rtp-selection
