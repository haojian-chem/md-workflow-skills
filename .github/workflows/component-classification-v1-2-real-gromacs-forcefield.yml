name: component-classification-v1-2-real-gromacs-forcefield

on:
  pull_request:
    paths:
      - "02_validators/component_and_residue_classification_validator/**"
      - "04_evals/component_and_residue_classification_validator/test_v1_2_real_gromacs_forcefield.py"
      - ".github/workflows/component-classification-v1-2-real-gromacs-forcefield.yml"
  workflow_dispatch:

jobs:
  real-gromacs-forcefield-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 02_validators/component_and_residue_classification_validator/scripts/requirements.txt
          python -m pip install pytest
      - name: Install distributed GROMACS force fields
        run: |
          set -euo pipefail
          sudo apt-get update
          if ! sudo apt-get install -y gromacs-data; then
            sudo apt-get install -y gromacs
          fi
      - name: Resolve force-field root and record provenance
        run: |
          set -euo pipefail
          mkdir -p real_gromacs_forcefield_evidence
          FF_ROOT="$(find /usr/share/gromacs -type d -name amber99sb-ildn.ff -print -quit)"
          if [ -z "$FF_ROOT" ]; then
            echo "amber99sb-ildn.ff was not found under /usr/share/gromacs" >&2
            exit 1
          fi
          echo "V1_2_REAL_GROMACS_FF_ROOT=$FF_ROOT" >> "$GITHUB_ENV"
          {
            echo "resolved_force_field_root=$FF_ROOT"
            echo "recorded_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            dpkg-query -W -f='package=${Package}\nversion=${Version}\narchitecture=${Architecture}\n' gromacs-data 2>/dev/null || true
            dpkg-query -W -f='package=${Package}\nversion=${Version}\narchitecture=${Architecture}\n' gromacs 2>/dev/null || true
          } | tee real_gromacs_forcefield_evidence/provenance.txt
          find "$FF_ROOT" -maxdepth 1 -type f \
            \( -name '*.rtp' -o -name '*.n.tdb' -o -name '*.c.tdb' \) \
            -print0 | sort -z | xargs -0 sha256sum \
            | tee real_gromacs_forcefield_evidence/forcefield_sha256sums.txt
          find "$FF_ROOT" -maxdepth 1 -type f -printf '%f\n' \
            | sort | tee real_gromacs_forcefield_evidence/file_inventory.txt
      - name: Run real GROMACS force-field acceptance
        run: |
          set -o pipefail
          pytest -q \
            04_evals/component_and_residue_classification_validator/test_v1_2_real_gromacs_forcefield.py \
            2>&1 | tee real_gromacs_forcefield_evidence/pytest.log
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-classification-v1-2-real-gromacs-forcefield-${{ github.run_id }}
          path: real_gromacs_forcefield_evidence/
          if-no-files-found: warn
          retention-days: 30
