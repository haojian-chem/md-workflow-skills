name: Sync 2.3 review status

on:
  push:
    paths:
      - '.github/workflows/sync-23-review-status.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update 2.3 review milestone
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('00_authoring/project_design/MD_WORKFLOW_MASTER_PLAN.md')
          text = p.read_text()
          old = '当前 2.1 与 2.3 已生成 active Skill；2.1 已完成 post-generation authoring/interface consistency check，2.3 已完成生成后 authoring/freeze consistency self-check。2.3 current entry 为 `02_topology_preparation/2.3_topology_linked_nonstandard_parameterization/SKILL.md`；Stage 2 main Skill、2.2 与 2.4–2.6 尚未生成 active `SKILL.md`。'
          new = '当前 2.1 与 2.3 已生成 active Skill；2.1 与 2.3 均已完成 post-generation authoring/interface consistency check。2.3 current entry 为 `02_topology_preparation/2.3_topology_linked_nonstandard_parameterization/SKILL.md`；Stage 2 main Skill、2.2 与 2.4–2.6 尚未生成 active `SKILL.md`。'
          if old not in text:
              raise RuntimeError('Expected Stage 2.3 status text not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_authoring/project_design/MD_WORKFLOW_MASTER_PLAN.md
          git commit -m 'Record Stage 2.3 post-generation consistency check'
          git push