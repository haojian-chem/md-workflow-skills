name: Rename Stage 2 Merz reference files

on:
  push:
    paths:
      - '.github/workflows/rename-stage2-merz-files.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rename reference files and freeze paths
        shell: bash
        run: |
          set -euo pipefail
          mv 02_topology_preparation/references/merz_ion_lj_12-6.itp 02_topology_preparation/references/12-6.itp
          mv 02_topology_preparation/references/merz_ion_lj_12-6-4.itp 02_topology_preparation/references/12-6-4.itp
          python - <<'PY'
          from pathlib import Path
          p = Path('00_authoring/architecture_freezes/WORKFLOW2_STAGE2_2.3_SOBTOP_PARAMETERIZATION_RULES_FREEZE.md')
          text = p.read_text()
          text = text.replace('02_topology_preparation/references/merz_ion_lj_12-6.itp', '02_topology_preparation/references/12-6.itp')
          text = text.replace('02_topology_preparation/references/merz_ion_lj_12-6-4.itp', '02_topology_preparation/references/12-6-4.itp')
          p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify Stage 2 Merz LJ reference filenames'
          git push
