name: Apply classification v1 bundle

on:
  push:
    branches:
      - work/1-2-classification-v1
    paths:
      - '.classification_bundle.part*'
      - '.github/workflows/apply-classification-bundle.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: work/1-2-classification-v1
          fetch-depth: 0

      - name: Restore implementation bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import io
          import tarfile

          parts = sorted(Path('.').glob('.classification_bundle.part*'))
          if len(parts) != 5:
              raise SystemExit(f'expected 5 bundle parts, found {len(parts)}')
          encoded = ''.join(path.read_text(encoding='utf-8') for path in parts)
          raw = base64.b85decode(encoded)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as archive:
              archive.extractall('.', filter='data')
          PY

          rm -f \
            02_validators/component_and_residue_classification_validator/references/standard_residue_alias_registry.yaml \
            02_validators/component_and_residue_classification_validator/references/coordination_detection_registry.yaml \
            02_validators/component_and_residue_classification_validator/schemas/classification_outputs.schema.yaml \
            04_evals/component_and_residue_classification_validator/test_classify_structure.py \
            04_evals/component_and_residue_classification_validator/test_build_subagent_result.py \
            04_evals/component_and_residue_classification_validator/fixtures/classification_cases.yaml \
            .classification_bundle.part01 \
            .classification_bundle.part02 \
            .classification_bundle.part03 \
            .classification_bundle.part04 \
            .classification_bundle.part05 \
            .github/workflows/apply-classification-bundle.yml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 02_validators/component_and_residue_classification_validator/scripts/requirements.txt pytest

      - name: Compile and test classification v1
        run: |
          python -m py_compile 02_validators/component_and_residue_classification_validator/scripts/*.py
          pytest -q 04_evals/component_and_residue_classification_validator/test_classification_v1.py

      - name: Commit generated implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Implement component classification v1 pipeline'
          git push origin HEAD:work/1-2-classification-v1
