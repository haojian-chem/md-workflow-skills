name: runtime-projection-check

on:
  push:
    branches:
      - skill-1-2-state-redesign
    paths:
      - "runtime/**"
      - "00_authoring/runtime_projection_config.yaml"
      - "00_manager/md_workflow_manager/references/manager_runtime_source.yaml"
      - "01_workflows/structure_preparation_workflow/references/runtime_source.yaml"
      - "05_tools/runtime_projection_compiler/**"
      - "05_tools/tool_registry.yaml"
      - "03_contracts/**"
      - ".github/workflows/runtime-projection-check.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "00_authoring/runtime_projection_config.yaml"
      - "00_manager/md_workflow_manager/references/manager_runtime_source.yaml"
      - "01_workflows/structure_preparation_workflow/references/runtime_source.yaml"
      - "05_tools/runtime_projection_compiler/**"
      - "05_tools/tool_registry.yaml"
      - "03_contracts/**"
      - ".github/workflows/runtime-projection-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install PyYAML
      - name: Check generated runtime projection
        run: |
          python 05_tools/runtime_projection_compiler/compile_runtime.py \
            --skill-root "$GITHUB_WORKSPACE" \
            --mode CHECK
