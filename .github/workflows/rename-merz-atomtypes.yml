name: Rename Merz reference atomtypes

on:
  push:
    paths:
      - '.github/workflows/rename-merz-atomtypes.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rename Merz atomtypes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('02_topology_preparation/references/merz_ion_lj_12-6.itp'),
              Path('02_topology_preparation/references/merz_ion_lj_12-6-4.itp'),
          ]
          old_header = (
              '; The atomtype names are unique library identifiers; select only parameters compatible with\n'
              '; the intended ion oxidation state, parameter set, and water model.\n'
          )
          new_header = (
              '; Atomtype names use element symbol + oxidation state (e.g. Fe3, Al3, Zn2).\n'
              '; Multiple candidate parameter lines for the same ion may therefore share the same atomtype name;\n'
              '; select only the parameter compatible with the intended parameter set and water model.\n'
          )

          for path in paths:
              text = path.read_text()
              text = text.replace(old_header, new_header)
              out = []
              for line in text.splitlines():
                  if line.startswith('MERZ_'):
                      name, rest = line.split(None, 1)
                      m = re.match(r'MERZ_([A-Z][a-z]?)(\d+)plus_', name)
                      if not m:
                          raise RuntimeError(f'Unexpected atomtype: {name}')
                      short = f'{m.group(1)}{m.group(2)}'
                      line = f'{short:<35} {rest}'
                  out.append(line)
              path.write_text('\n'.join(out) + '\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 02_topology_preparation/references/merz_ion_lj_12-6.itp 02_topology_preparation/references/merz_ion_lj_12-6-4.itp
          git commit -m 'Simplify Merz reference atomtype names'
          git push
