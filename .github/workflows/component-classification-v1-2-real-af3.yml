name: component-classification-v1-2-real-af3

on:
  push:
    paths:
      - "01_structure_preparation/1.2_component_and_residue_classification/**"
      - "04_evals/component_and_residue_classification_validator/test_v1_2_real_af3_acceptance.py"
      - "04_evals/component_and_residue_classification_validator/fixtures/real_af3/**"
      - ".github/workflows/component-classification-v1-2-real-af3.yml"
  pull_request:
    paths:
      - "01_structure_preparation/1.2_component_and_residue_classification/**"
      - "04_evals/component_and_residue_classification_validator/test_v1_2_real_af3_acceptance.py"
      - "04_evals/component_and_residue_classification_validator/fixtures/real_af3/**"
      - ".github/workflows/component-classification-v1-2-real-af3.yml"
  workflow_dispatch:

jobs:
  real-af3-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 01_structure_preparation/1.2_component_and_residue_classification/scripts/requirements.txt
          python -m pip install pytest
      - name: Run real AlphaFold Server acceptance
        run: |
          set -o pipefail
          mkdir -p real_af3_acceptance_output
          pytest -q \
            04_evals/component_and_residue_classification_validator/test_v1_2_real_af3_acceptance.py \
            2>&1 | tee real_af3_acceptance_output/pytest.log
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-classification-v1-2-real-af3-${{ github.run_id }}
          path: real_af3_acceptance_output/
          if-no-files-found: warn
          retention-days: 30
