name: tmp-v1-2-scientific-contract-repair

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-v1-2-scientific-contract-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-v1-2-scientific-contract-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/chain-component-selection-core'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chain-component-selection-core
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply scientific contract repair
        shell: bash
        run: |
          cat > /tmp/repair.py <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          SKILL = ROOT / '02_validators/component_and_residue_classification_validator'
          BRANCH_FILES = []

          def read(path):
              return path.read_text(encoding='utf-8')

          def write(path, text):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
              BRANCH_FILES.append(str(path))

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          # 1. Scientific rules: authoritative heavy-atom model and altLoc identity.
          path = SKILL / 'references/classification_rules.md'
          text = read(path)
          text = replace_once(
              text,
              '关系端点分别追加 `source_atom_name` 和 `current_atom_name`。规则：',
              '关系端点分别追加 `source_atom_name`、`current_atom_name`、`source_altloc_id` 和 `current_altloc_id`；无 altLoc 时后两项为 `null`。规则：',
              'rules atom identity',
          )
          text = replace_once(
              text,
              '- `endpoint_id`：根据 source residue identity 与 exact atom name 生成；',
              '- `endpoint_id`：根据 source residue identity、exact atom name 与 exact altLoc identity 生成；',
              'rules endpoint id',
          )
          start = text.index('## 8.2 输出状态')
          end = text.index('# 9. CCD 规则')
          replacement = '''## 8.2 权威输出模型

重原子检查必须拆分为检查执行状态与零个或多个并行 findings，禁止再使用单一互斥状态覆盖其他异常：

```yaml
heavy_atom_check:
  execution_status: COMPLETED
  findings:
    - MISSING_EXPECTED_HEAVY_ATOMS
    - UNEXPECTED_HEAVY_ATOMS
    - ATOM_NAME_MAPPING_REQUIRED
  exact_comparison:
    missing_expected_atom_names: [C1]
    unexpected_observed_atom_names: [C01]
  atom_name_mapping_candidates:
    - observed_atom_name: C01
      reference_atom_name: C1
      mapping_source: CCD_ALTERNATE_ATOM_NAME
  mapping_resolution_status: PENDING_CONFIRMATION
  effective_comparison: null
```

`execution_status` 允许值：

```text
COMPLETED
NOT_PERFORMED
NOT_APPLICABLE
REFERENCE_TEMPLATE_UNAVAILABLE
```

`findings` 允许并行包含：

```text
MISSING_EXPECTED_HEAVY_ATOMS
UNEXPECTED_HEAVY_ATOMS
ATOM_NAME_MAPPING_REQUIRED
ELEMENT_MISMATCH
DUPLICATE_ATOM_NAME
```

硬规则：

- 所有适用异常必须并行记录；任何单一异常不得覆盖、终止或隐藏同一残基上的其他重原子问题；
- `exact_comparison` 必须先按结构 exact atom name 与参考 exact atom name 比较，且永久保留原始差集；
- CCD alternate atom name 只能产生 `atom_name_mapping_candidates`，禁止从 raw missing/unexpected 差集中删除对应名称；
- 未经确认时 `mapping_resolution_status: PENDING_CONFIRMATION` 且 `effective_comparison: null`；
- 用户确认应用映射后才可生成 `effective_comparison`，同时保留原始 `exact_comparison`；
- 用户拒绝映射时记录 `mapping_resolution_status: REJECTED`，禁止伪造 effective comparison；
- 无 mapping candidate 时 `mapping_resolution_status: NOT_APPLICABLE`，已完成比较可令 `effective_comparison` 与 exact comparison 相同；
- v1 的 `status`、`missing_atoms`、`unexpected_atoms` 仅作为只读兼容镜像；新消费者必须读取 `execution_status`、`findings` 和 comparison 对象。

## 8.3 altLoc

只要残基存在多个 altLoc：

```text
conformation status: MULTIPLE_CONFORMATIONS
heavy atom execution_status: NOT_PERFORMED
reason: MULTIPLE_CONFORMATIONS_PRESENT
```

禁止将多个构象的原子并集作为一个伪完整残基进行比较。关系端点若由显式结构记录精确到 altLoc，必须保留该 altLoc 身份；禁止将 A/B 等不同构象端点折叠成同一个 endpoint ID。

'''
          text = text[:start] + replacement + text[end:]
          text = replace_once(
              text,
              '项目级残基定义建立所有精确同名实例的 baseline 分类；确认的 topology-forming relation 只允许提升参与该关系的具体实例，禁止反向修改其他同名实例的 baseline。',
              '项目级残基定义建立所有精确同名实例的 baseline 分类；确认的 topology-forming relation 只允许提升参与该关系的具体实例，禁止反向修改其他同名实例的 baseline。\n- terminal cap 名称（ACE、NME、NH2）在 fallback registry 中只建立 `INDEPENDENT_NONSTANDARD` baseline；只有具体实例存在确认且应用的 topology-forming relation 后才提升。',
              'rules terminal caps',
          )
          write(path, text)

          # 2. Split terminal-cap baseline registry.
          path = SKILL / 'references/topology_linked_nonstandard_residue_registry.yaml'
          text = read(path)
          for name in ('ACE', 'NME', 'NH2'):
              pattern = re.compile(rf'  - residue_name: {name}\n    polymer_class: NONPOLYMER\n    topology_class: TOPOLOGY_LINKED_NONSTANDARD\n    ccd_id: {name}\n?')
              text, count = pattern.subn('', text)
              if count != 1:
                  raise SystemExit(f'linked registry {name}: expected one entry, found {count}')
          write(path, text.rstrip() + '\n')
          independent = '''schema_version: "1.0"
residue_definitions:
  - residue_name: ACE
    polymer_class: NONPOLYMER
    topology_class: INDEPENDENT_NONSTANDARD
    ccd_id: ACE
  - residue_name: NME
    polymer_class: NONPOLYMER
    topology_class: INDEPENDENT_NONSTANDARD
    ccd_id: NME
  - residue_name: NH2
    polymer_class: NONPOLYMER
    topology_class: INDEPENDENT_NONSTANDARD
    ccd_id: NH2
'''
          write(SKILL / 'references/independent_nonstandard_residue_registry.yaml', independent)

          # 3. Authoritative heavy-atom schema, retaining compatibility mirrors.
          heavy_schema = '''  heavy_atom_check:
    type: object
    additionalProperties: false
    required:
      - execution_status
      - findings
      - reference_type
      - reference_name
      - exact_comparison
      - atom_name_mapping_candidates
      - mapping_resolution_status
      - effective_comparison
      - reason
      - status
      - missing_atoms
      - unexpected_atoms
    properties:
      execution_status:
        enum: [COMPLETED, NOT_PERFORMED, NOT_APPLICABLE, REFERENCE_TEMPLATE_UNAVAILABLE]
      findings:
        type: array
        uniqueItems: true
        items:
          enum:
            - MISSING_EXPECTED_HEAVY_ATOMS
            - UNEXPECTED_HEAVY_ATOMS
            - ATOM_NAME_MAPPING_REQUIRED
            - ELEMENT_MISMATCH
            - DUPLICATE_ATOM_NAME
      reference_type:
        type: [string, "null"]
        enum: [CCD, RTP, null]
      reference_name:
        $ref: "#/$defs/nullable_string"
      exact_comparison:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/heavy_atom_comparison"
      atom_name_mapping_candidates:
        type: array
        items:
          $ref: "#/$defs/atom_name_mapping_candidate"
      mapping_resolution_status:
        enum: [NOT_APPLICABLE, PENDING_CONFIRMATION, APPLIED, REJECTED]
      effective_comparison:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/heavy_atom_comparison"
      reason:
        $ref: "#/$defs/nullable_string"
      status:
        description: Deprecated v1 compatibility summary; not authoritative.
        enum:
          - HEAVY_ATOMS_COMPLETE
          - MISSING_EXPECTED_HEAVY_ATOMS
          - UNEXPECTED_HEAVY_ATOMS
          - MISSING_AND_UNEXPECTED_HEAVY_ATOMS
          - ATOM_NAME_MAPPING_REQUIRED
          - REFERENCE_TEMPLATE_UNAVAILABLE
          - NOT_PERFORMED
          - NOT_APPLICABLE
      missing_atoms:
        description: Deprecated mirror of exact_comparison.missing_expected_atom_names.
        type: array
        items: {type: string, minLength: 1}
      unexpected_atoms:
        description: Deprecated mirror of exact_comparison.unexpected_observed_atom_names.
        type: array
        items: {type: string, minLength: 1}
'''
          defs = '''  heavy_atom_comparison:
    type: object
    additionalProperties: false
    required: [missing_expected_atom_names, unexpected_observed_atom_names]
    properties:
      missing_expected_atom_names:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      unexpected_observed_atom_names:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
  atom_name_mapping_candidate:
    type: object
    additionalProperties: false
    required: [observed_atom_name, reference_atom_name, mapping_source]
    properties:
      observed_atom_name: {type: string, minLength: 1}
      reference_atom_name: {type: string, minLength: 1}
      mapping_source: {enum: [CCD_ALTERNATE_ATOM_NAME, PROJECT_CONFIRMED_MAPPING]}
'''
          for schema_name in ('classification_observations.schema.yaml', 'classification_result.schema.yaml'):
              path = SKILL / 'schemas' / schema_name
              text = read(path)
              marker = '  heavy_atom_check:\n'
              start = text.index(marker)
              end = text.index('  residue_record:\n', start)
              text = text[:start] + heavy_schema + text[end:]
              insert_at = text.index('  heavy_atom_check:\n')
              text = text[:insert_at] + defs + text[insert_at:]
              write(path, text)

          # 4. AltLoc is part of authoritative atom identity in all relation schemas.
          for schema_name in (
              'classification_observations.schema.yaml',
              'classification_result.schema.yaml',
              'possible_connections_result.schema.yaml',
              'possible_coordination_result.schema.yaml',
          ):
              path = SKILL / 'schemas' / schema_name
              text = read(path)
              text = text.replace(
                  'required: [source_model_id, source_chain_id, source_resid, source_residue_name, source_atom_name]',
                  'required: [source_model_id, source_chain_id, source_resid, source_residue_name, source_atom_name, source_altloc_id]',
              )
              text = text.replace(
                  '      source_atom_name: {type: string, minLength: 1}\n',
                  '      source_atom_name: {type: string, minLength: 1}\n      source_altloc_id:\n        $ref: "#/$defs/nullable_string"\n',
              )
              text = text.replace(
                  'required: [current_model_id, current_chain_id, current_resid, current_residue_name, current_atom_name]',
                  'required: [current_model_id, current_chain_id, current_resid, current_residue_name, current_atom_name, current_altloc_id]',
              )
              text = text.replace(
                  '      current_atom_name: {type: string, minLength: 1}\n',
                  '      current_atom_name: {type: string, minLength: 1}\n      current_altloc_id:\n        $ref: "#/$defs/nullable_string"\n',
              )
              write(path, text)

          path = SKILL / 'schemas/classification_result.schema.yaml'
          text = read(path)
          text = replace_once(
              text,
              'required: [endpoint_id, residue_id, component_id, source_identity, current_identity, chain_index, source_chain_id, source_resid, residue_name, atom_name]',
              'required: [endpoint_id, residue_id, component_id, source_identity, current_identity, chain_index, source_chain_id, source_resid, residue_name, atom_name, altloc_id]',
              'final endpoint required',
          )
          text = replace_once(
              text,
              '      atom_name: {type: string, minLength: 1}\n  relation:',
              '      atom_name: {type: string, minLength: 1}\n      altloc_id:\n        $ref: "#/$defs/nullable_string"\n  relation:',
              'final endpoint altloc property',
          )
          write(path, text)

          # 5. Confirmation contract supports atom-name mapping decisions.
          path = SKILL / 'schemas/confirmation_requests.schema.yaml'
          text = read(path)
          text = replace_once(
              text,
              '          - INVALID_PROJECT_CCD_SNAPSHOT\n',
              '          - INVALID_PROJECT_CCD_SNAPSHOT\n          - ATOM_NAME_MAPPING_REQUIRED\n',
              'confirmation mapping enum',
          )
          write(path, text)

          # 6. Structure atom identities preserve altLoc.
          path = SKILL / 'scripts/structure_records.py'
          text = read(path)
          text = replace_once(
              text,
              '    output["source_atom_name"] = atom.atom_name\n    return output\n',
              '    output["source_atom_name"] = atom.atom_name\n    output["source_altloc_id"] = atom.altloc_id\n    return output\n',
              'source atom altloc',
          )
          text = replace_once(
              text,
              '    output["current_atom_name"] = atom.atom_name\n    return output\n',
              '    output["current_atom_name"] = atom.atom_name\n    output["current_altloc_id"] = atom.altloc_id\n    return output\n',
              'current atom altloc',
          )
          write(path, text)

          # 7. Endpoint IDs include altLoc.
          path = SKILL / 'scripts/selection_identity.py'
          text = read(path)
          text = replace_once(
              text,
              '    return f"endpoint:v1/{residue_id_from_source_identity(residue_identity)}/atom/{_encode(atom_name)}"\n',
              '    return (\n        f"endpoint:v1/{residue_id_from_source_identity(residue_identity)}"\n        f"/atom/{_encode(atom_name)}/altloc/{_encode(identity.get(\'source_altloc_id\'))}"\n    )\n',
              'endpoint id altloc',
          )
          write(path, text)

          # 8. CCD comparison preserves raw exact-name differences.
          path = SKILL / 'scripts/ccd_reference.py'
          text = read(path)
          old = '''    remapped_unexpected: set[str] = set()
    remapped_missing: set[str] = set()
    for structure_name in sorted(unexpected):
        ccd_name = template.alternate_atom_names.get(structure_name)
        if ccd_name is not None and ccd_name in missing:
            mapping_candidates.append(
                {
                    "structure_atom_name": structure_name,
                    "ccd_atom_id": ccd_name,
                    "mapping_source": "CCD_ALTERNATE_ATOM_NAME",
                }
            )
            remapped_unexpected.add(structure_name)
            remapped_missing.add(ccd_name)
    return (
        sorted(missing - remapped_missing),
        sorted(unexpected - remapped_unexpected),
        mapping_candidates,
    )
'''
          new = '''    for structure_name in sorted(unexpected):
        ccd_name = template.alternate_atom_names.get(structure_name)
        if ccd_name is not None and ccd_name in missing:
            mapping_candidates.append(
                {
                    "structure_atom_name": structure_name,
                    "ccd_atom_id": ccd_name,
                    "mapping_source": "CCD_ALTERNATE_ATOM_NAME",
                }
            )
    # Mapping evidence must never erase the raw exact-name comparison.
    return sorted(missing), sorted(unexpected), mapping_candidates
'''
          text = replace_once(text, old, new, 'ccd raw comparison')
          write(path, text)

          # 9. Core engine: third registry and authoritative heavy-atom model.
          path = SKILL / 'scripts/classification_engine_core.py'
          text = read(path)
          old = '''    linked_registry_path = Path(
        classification_config.get(
            "linked_registry_path",
            reference_dir / "topology_linked_nonstandard_residue_registry.yaml",
        )
    ).resolve()
    standard_defs, standard_hash = _load_definition_file(standard_registry_path, definitions_schema)
