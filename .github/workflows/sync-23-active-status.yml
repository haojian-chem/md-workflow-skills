name: Sync 2.3 active status

on:
  push:
    paths:
      - '.github/workflows/sync-23-active-status.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove stale 2.3 freeze-only wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('00_authoring/project_design/MD_WORKFLOW_MASTER_PLAN.md')
          text = p.read_text()
          old = 'These files preserve the detailed pre-authorization 2.3 / 2.5 material for later formal Skill generation; they are not runtime Skills.'
          new = 'These files remain architecture/authoring records rather than runtime Skills; 2.3 now uses its active current entry above, while 2.5 remains pending formal Skill generation.'
          if old not in text:
              raise RuntimeError('Expected stale 2.3/2.5 sentence missing')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_authoring/project_design/MD_WORKFLOW_MASTER_PLAN.md
          git commit -m 'Remove stale 2.3 freeze-only wording'
          git push
