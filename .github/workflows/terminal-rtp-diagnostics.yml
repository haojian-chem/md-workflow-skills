name: terminal-rtp-diagnostics

on:
  push:
    branches:
      - feature/terminal-rtp-selection
    paths:
      - ".github/workflows/terminal-rtp-diagnostics.yml"
      - "04_evals/component_and_residue_classification_validator/test_v1_2_terminal_rtp.py"
      - "02_validators/component_and_residue_classification_validator/scripts/classification_engine.py"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/terminal-rtp-selection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r 02_validators/component_and_residue_classification_validator/scripts/requirements.txt
          python -m pip install pytest
      - name: Run terminal test and save log
        id: terminal_test
        continue-on-error: true
        run: |
          pytest -q -vv 04_evals/component_and_residue_classification_validator/test_v1_2_terminal_rtp.py > 04_evals/component_and_residue_classification_validator/TERMINAL_TEST_LOG.txt 2>&1
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04_evals/component_and_residue_classification_validator/TERMINAL_TEST_LOG.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record terminal RTP diagnostic result"
            git push origin HEAD:feature/terminal-rtp-selection
          fi
      - name: Fail when terminal test failed
        if: steps.terminal_test.outcome == 'failure'
        run: exit 1
