name: tmp-selection-identity-contract

on:
  push:
    branches: [fix/v1-2-v1-3-selection-identity]
    paths:
      - "tmp_migrate_selection_identity.py"
      - "tmp_fix_selection_identity_fixtures.py"
      - ".github/workflows/tmp-selection-identity-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "tmp_migrate_selection_identity.py"
      - "tmp_fix_selection_identity_fixtures.py"
      - ".github/workflows/tmp-selection-identity-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1-2-v1-3-selection-identity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 02_validators/component_and_residue_classification_validator/scripts/requirements.txt
          python -m pip install pytest
      - name: Apply contract migration
        run: |
          python tmp_migrate_selection_identity.py
          python tmp_fix_selection_identity_fixtures.py
      - name: Run complete v1.2 suite
        run: |
          pytest -q \
            04_evals/component_and_residue_classification_validator/test_inspect_model_scope.py \
            04_evals/component_and_residue_classification_validator/test_classify_structure.py \
            04_evals/component_and_residue_classification_validator/test_build_subagent_result.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_redesign_foundation.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_relations_and_builder.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_classification_engine.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_polymer_grouping_conflict.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_missing_residue_paths.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_af3_server_json.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_altloc_rtp_ccd.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_coordination_topology_matrix.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_topology_class_vocabulary.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_dual_identity.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_selection_identity_contract.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_manager_closure.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_terminal_rtp.py
      - name: Commit business changes
        run: |
          find 02_validators 04_evals -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/component-classification-v1-2.yml \
            00_authoring/content_maps/component_and_residue_classification_validator.yaml \
            00_authoring/content_maps/chain_and_component_selection.yaml \
            00_authoring/content_maps/chain_and_component_selection_validator.yaml \
            02_validators/component_and_residue_classification_validator \
            02_operations/chain_and_component_selection \
            02_validators/chain_and_component_selection_validator \
            04_evals/component_and_residue_classification_validator \
            04_evals/chain_and_component_selection
          if git diff --cached --quiet; then
            echo "No business changes to commit"
            exit 0
          fi
          git commit -m "Define v1.2 to v1.3 selection identity contract"
          git pull --rebase origin fix/v1-2-v1-3-selection-identity
          git push origin HEAD:fix/v1-2-v1-3-selection-identity
