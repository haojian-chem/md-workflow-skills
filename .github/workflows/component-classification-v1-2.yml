name: component-classification-v1-2

on:
  pull_request:
    paths:
      - ".github/workflows/component-classification-v1-2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/chain-component-selection-core'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chain-component-selection-core
          fetch-depth: 0
      - name: Remove temporary migration helpers
        run: |
          rm -f \
            .github/tmp_v1_2_builder_loop_normalize.py \
            .github/tmp_v1_2_dependency_fixture_repair.py \
            .github/tmp_v1_2_dependency_repair.py \
            .github/tmp_v1_2_diagnose.py \
            .github/tmp_v1_2_monkey_patch_removal.py \
            .github/tmp_v1_2_normalize.py \
            .github/tmp_v1_2_registry_normalize.py
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u .github
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove temporary v1.2 migration helpers"
          git push origin HEAD:feat/chain-component-selection-core
