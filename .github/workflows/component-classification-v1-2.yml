name: component-classification-v1-2

on:
  pull_request:
    paths:
      - ".github/workflows/component-classification-v1-2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1-2-scientific-contract-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  migrate-and-test:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/chain-component-selection-core'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chain-component-selection-core
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract and run migration
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/tmp-v1-2-scientific-contract-repair.yml').read_text(encoding='utf-8')
          body = raw.split("cat > /tmp/repair.py <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script = '\n'.join(lines) + '\n'
          patches = {
              "text = replace_once(text, old, new, 'ccd raw comparison')": "text, count = re.subn(r'    remapped_unexpected: set\\[str\\] = set\\(\\).*?        mapping_candidates,\\n    \\)', new.rstrip(), text, count=1, flags=re.S)\nif count != 1: raise SystemExit(f'ccd raw comparison regex: {count}')",
              "text = replace_once(text, old, new, 'core registries')": "text, count = re.subn(r'    linked_registry_path = Path\\(.*?    skill_defs = \\{\\*\\*standard_defs, \\*\\*linked_defs\\}\\n', new, text, count=1, flags=re.S)\nif count != 1: raise SystemExit(f'core registries regex: {count}')",
              "text = replace_once(text, old, new, 'rtp heavy check')": "text, count = re.subn(r'            analysis\\.heavy_atom_check = \\{\\n                \\\"status\\\": _heavy_status\\(missing, unexpected\\),.*?            \\}\\n', new, text, count=1, flags=re.S)\nif count != 1: raise SystemExit(f'rtp heavy check regex: {count}')",
              "text = replace_once(text, old, new, 'ccd heavy check')": "text, count = re.subn(r'        if mappings:\\n            status = \\\"ATOM_NAME_MAPPING_REQUIRED\\\".*?            \\\"reason\\\": reason,\\n        \\}\\n', new, text, count=1, flags=re.S)\nif count != 1: raise SystemExit(f'ccd heavy check regex: {count}')",
              "text = replace_once(text, old, new, 'group heavy check')": "text, count = re.subn(r'            and item\\.heavy_atom_check\\[\\\"status\\\"\\]\\n            not in \\{.*?            \\}\\n', new, text, count=1, flags=re.S)\nif count != 1: raise SystemExit(f'group heavy check regex: {count}')",
              "text = replace_once(text, old, new, 'summary heavy issue')": "text, count = re.subn(r'            \\\"heavy_atom_issue_count\\\": sum\\(\\n                item\\[\\\"heavy_atom_check\\\"\\]\\[\\\"status\\\"\\] in heavy_issue_statuses\\n                for item in residue_records\\n            \\),\\n', new, text, count=1)\nif count != 1: raise SystemExit(f'summary heavy issue regex: {count}')",
              "text = replace_once(text, old, new, 'manifest third registry')": "text, count = re.subn(r'            \\{\\n                \\\"path\\\": str\\(linked_registry_path\\),\\n                \\\"sha256\\\": linked_hash,\\n                \\\"status\\\": \\\"LOADED\\\",\\n            \\},\\n', new, text, count=1)\nif count != 1: raise SystemExit(f'manifest third registry regex: {count}')",
              "text = replace_once(text, old, new, 'builder resolve mapping')": "text, count = re.subn(r'        if request\\[\\\"request_type\\\"\\] in CLASSIFICATION_REQUEST_TYPES and decision\\[\\\"decision\\\"\\] == \\\"SET_CLASSIFICATION\\\":\\n            resolved_requests\\.append\\(\\(request, decision\\)\\)\\n            continue\\n', new, text, count=1)\nif count != 1: raise SystemExit(f'builder resolve mapping regex: {count}')",
              "text = replace_once(text, old_special, new_special, 'special heavy check')": "text, count = re.subn(r'        \\\"heavy_atom_check\\\": \\{\\n            \\\"status\\\": \\\"NOT_PERFORMED\\\",.*?            \\\"reason\\\": \\\"GROUP_MEMBER_DETAIL_NOT_RETAINED_IN_BASELINE\\\",\\n        \\},\\n', new_special, text, count=1, flags=re.S)\nif count != 1: raise SystemExit(f'special heavy check regex: {count}')",
              "text = replace_once(text, old, new, 'builder heavy count')": "text, count = re.subn(r'            \\\"heavy_atom_issue_count\\\": sum\\(\\n                record\\[\\\"heavy_atom_check\\\"\\]\\[\\\"status\\\"\\] in heavy_issue_statuses\\n                for record in records\\n            \\),\\n', new, text, count=1)\nif count != 1: raise SystemExit(f'builder heavy count regex: {count}')",
          }
          for old, new in patches.items():
              if old not in script:
                  raise SystemExit(f'migration patch marker missing: {old}')
              script = script.replace(old, new)
          Path('/tmp/repair.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/repair.py | tee /tmp/changed-files.txt
      - name: Normalize generated Python
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          skill = Path('02_validators/component_and_residue_classification_validator')
          path = skill / 'scripts/ccd_reference.py'
          text = path.read_text(encoding='utf-8')
          marker = 'def compare_ccd_heavy_atoms('
          prefix = text[:text.index(marker)]
          function = '''def compare_ccd_heavy_atoms(
    observed_heavy_atom_names: Iterable[str],
    template: CcdTemplate,
) -> tuple[list[str], list[str], list[dict[str, str]]]:
    observed = set(observed_heavy_atom_names)
    expected = set(template.heavy_atom_names)
    missing = expected - observed
    unexpected = observed - expected
    mapping_candidates: list[dict[str, str]] = []
    for structure_name in sorted(unexpected):
        ccd_name = template.alternate_atom_names.get(structure_name)
        if ccd_name is not None and ccd_name in missing:
            mapping_candidates.append(
                {
                    "structure_atom_name": structure_name,
                    "ccd_atom_id": ccd_name,
                    "mapping_source": "CCD_ALTERNATE_ATOM_NAME",
                }
            )
    return sorted(missing), sorted(unexpected), mapping_candidates
'''
          path.write_text(prefix + function, encoding='utf-8')

          path = skill / 'scripts/build_classification_result.py'
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'\n\s*def _heavy_atom_decision_map\(.*?\ndef _record_index\(', re.S)
          replacement = '''

def _heavy_atom_decision_map(
    resolved_requests: list[tuple[dict[str, Any], dict[str, Any]]],
) -> dict[tuple[str | None, str, str | None, str], dict[str, Any]]:
    output: dict[tuple[str | None, str, str | None, str], dict[str, Any]] = {}
    for request, decision in resolved_requests:
        if request["request_type"] != "ATOM_NAME_MAPPING_REQUIRED":
            continue
        subject = request["subject"]
        source_resid = subject.get("source_resid")
        if not isinstance(source_resid, dict):
            raise ClassificationToolError("atom-name mapping subject lacks source_resid")
        key = (
            subject.get("source_chain_id"),
            str(source_resid["number"]),
            source_resid.get("insertion_code"),
            subject["residue_name"],
        )
        output[key] = copy.deepcopy(decision)
    return output


def _apply_heavy_atom_decision(
    check: dict[str, Any],
    decision: dict[str, Any] | None,
) -> dict[str, Any]:
    output = copy.deepcopy(check)
    if decision is None:
        return output
    action = decision["decision"]
    if action == "REJECT_ATOM_NAME_MAPPING":
        output["mapping_resolution_status"] = "REJECTED"
        output["effective_comparison"] = None
        return output
    if action != "APPLY_ATOM_NAME_MAPPING":
        return output
    exact = output.get("exact_comparison")
    if not isinstance(exact, dict):
        raise ClassificationToolError("cannot apply atom-name mapping without exact comparison")
    missing = set(exact["missing_expected_atom_names"])
    unexpected = set(exact["unexpected_observed_atom_names"])
    for candidate in output.get("atom_name_mapping_candidates", []):
        missing.discard(candidate["reference_atom_name"])
        unexpected.discard(candidate["observed_atom_name"])
    output["mapping_resolution_status"] = "APPLIED"
    output["effective_comparison"] = {
        "missing_expected_atom_names": sorted(missing),
        "unexpected_observed_atom_names": sorted(unexpected),
    }
    return output


def _record_index('''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'cannot normalize heavy atom decision helpers: {count}')
          path.write_text(text, encoding='utf-8')

          path = Path('04_evals/component_and_residue_classification_validator/test_v1_2_scientific_contract_repairs.py')
          text = path.read_text(encoding='utf-8')
          replacement_text = (
              '    structure.write_text(\n'
              '        "HETATM    1  C01 LIG A   1       0.000   0.000   0.000  1.00 20.00           C\\n"\n'
              '        "HETATM    2  N1  LIG A   1       1.000   0.000   0.000  1.00 20.00           N\\n"\n'
              '        "END\\n",\n'
              '        encoding="utf-8",\n'
              '    )'
          )
          text, count = re.subn(
              r'    structure\.write_text\(\n.*?        encoding="utf-8",\n    \)',
              lambda _match: replacement_text,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'cannot normalize scientific test PDB string: {count}')
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile \
            02_validators/component_and_residue_classification_validator/scripts/ccd_reference.py \
            02_validators/component_and_residue_classification_validator/scripts/classification_engine_core.py \
            02_validators/component_and_residue_classification_validator/scripts/build_classification_result.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_scientific_contract_repairs.py
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 02_validators/component_and_residue_classification_validator/scripts/requirements.txt
          python -m pip install pytest
          pytest -q \
            04_evals/component_and_residue_classification_validator/test_v1_2_scientific_contract_repairs.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_altloc_rtp_ccd.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_relations_and_builder.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_selection_identity_contract.py \
            04_evals/chain_and_component_selection/test_chain_and_component_selection.py
      - name: Commit business changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          grep -v '^\.github/workflows/' /tmp/changed-files.txt | xargs git add
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair v1.2 scientific data contracts'
          git push origin HEAD:feat/chain-component-selection-core
