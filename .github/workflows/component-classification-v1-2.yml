name: component-classification-v1-2

on:
  pull_request:
    paths:
      - ".github/workflows/component-classification-v1-2.yml"
      - ".github/tmp_v1_2_monkey_patch_removal.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1-2-monkey-patch-removal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  refactor-and-test:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/chain-component-selection-core'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chain-component-selection-core
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply side-effect-free module refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/tmp_v1_2_monkey_patch_removal.py')
          text = source.read_text(encoding='utf-8')
          old = '''text, count = re.subn(
              r'def _parse_pdb_remark_465\\(.*?\\n\\ndef _mmcif_value\\(',
              strict_parser + "def _mmcif_value(",
              text,
              count=1,
              flags=re.S,
          )'''
          new = '''text, count = re.subn(
              r'def _parse_pdb_remark_465\\(.*?\\n\\ndef _mmcif_value\\(',
              lambda _match: strict_parser + "def _mmcif_value(",
              text,
              count=1,
              flags=re.S,
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'cannot patch strict-parser replacement: {text.count(old)}')
          text = text.replace(old, new, 1)
          old_marker = 'parse_marker = "def parse_af3_sequence_references(\\n"'
          new_marker = 'parse_marker = "def parse_af3_sequence_references("'
          if text.count(old_marker) != 1:
              raise SystemExit(f'cannot patch AF3 parser marker: {text.count(old_marker)}')
          text = text.replace(old_marker, new_marker, 1)
          Path('/tmp/v1_2_monkey_patch_removal.py').write_text(
              text,
              encoding='utf-8',
          )
          PY
          python /tmp/v1_2_monkey_patch_removal.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 02_validators/component_and_residue_classification_validator/scripts/requirements.txt
          python -m pip install pytest
      - name: Compile deterministic scripts
        run: |
          python -m compileall -q \
            02_validators/component_and_residue_classification_validator/scripts \
            02_operations/chain_and_component_selection/scripts \
            02_validators/chain_and_component_selection_validator/scripts
      - name: Run v1.2 and 1.3 regression
        run: |
          pytest -q \
            04_evals/component_and_residue_classification_validator/test_inspect_model_scope.py \
            04_evals/component_and_residue_classification_validator/test_classify_structure.py \
            04_evals/component_and_residue_classification_validator/test_build_subagent_result.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_redesign_foundation.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_relations_and_builder.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_classification_engine.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_polymer_grouping_conflict.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_missing_residue_paths.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_af3_server_json.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_altloc_rtp_ccd.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_coordination_topology_matrix.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_topology_class_vocabulary.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_dual_identity.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_selection_identity_contract.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_manager_closure.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_terminal_rtp.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_scientific_contract_repairs.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_dependency_contracts.py \
            04_evals/component_and_residue_classification_validator/test_v1_2_no_runtime_monkey_patch.py \
            04_evals/chain_and_component_selection/test_chain_and_component_selection.py
      - name: Commit verified refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          sort -u /tmp/monkey-patch-changed-files.txt | xargs git add
          if git diff --cached --quiet; then
            echo "No business changes to commit"
            exit 0
          fi
          git commit -m "Remove v1.2 runtime monkey patches"
          git push origin HEAD:feat/chain-component-selection-core
