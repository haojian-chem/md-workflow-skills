name: runtime-projection-sync

on:
  push:
    branches:
      - skill-1-2-state-redesign
    paths:
      - "AGENTS.md"
      - "00_authoring/runtime_projection_config.yaml"
      - "00_manager/md_workflow_manager/SKILL.md"
      - "00_manager/md_workflow_manager/references/manager_runtime_source.yaml"
      - "00_manager/md_workflow_manager/references/stage_registry.yaml"
      - "01_workflows/structure_preparation_workflow/SKILL.md"
      - "01_workflows/structure_preparation_workflow/references/runtime_source.yaml"
      - "03_contracts/**"
      - "05_tools/tool_registry.yaml"
      - "05_tools/runtime_projection_compiler/**"
      - ".github/workflows/runtime-projection-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-projection-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compiler dependency
        run: python -m pip install PyYAML
      - name: Build deterministic runtime projection
        run: |
          python 05_tools/runtime_projection_compiler/compile_runtime.py \
            --skill-root "$GITHUB_WORKSPACE" \
            --mode BUILD
      - name: Commit generated runtime files when changed
        shell: bash
        run: |
          if git diff --quiet -- runtime; then
            echo "Runtime projection already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/
          git commit -m "sync generated runtime projection"
          git push origin "HEAD:${GITHUB_REF_NAME}"
