name: tmp-v1-2-identity-cleanup

on:
  push:
    branches: [fix/v1-2-source-current-identity]
    paths:
      - ".github/workflows/tmp-v1-2-identity-migration.yml"

permissions:
  contents: write

concurrency:
  group: tmp-v1-2-identity-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1-2-source-current-identity
          fetch-depth: 0
      - name: Remove generated and temporary files
        run: |
          find 02_validators/component_and_residue_classification_validator \
               04_evals/component_and_residue_classification_validator \
               -type d -name __pycache__ -prune -exec rm -rf {} +
          find 02_validators/component_and_residue_classification_validator \
               04_evals/component_and_residue_classification_validator \
               -type f -name '*.pyc' -delete
          rm -f \
            tmp_migrate_v1_2_identity.py \
            tmp_fix_identity_migration.py \
            tmp_fix_identity_test_fixtures.py \
            tmp_pr_marker.txt \
            tmp_pr_marker_2.txt
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            02_validators/component_and_residue_classification_validator \
            04_evals/component_and_residue_classification_validator \
            tmp_migrate_v1_2_identity.py \
            tmp_fix_identity_migration.py \
            tmp_fix_identity_test_fixtures.py \
            tmp_pr_marker.txt \
            tmp_pr_marker_2.txt
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "Remove temporary identity migration artifacts"
          git push origin HEAD:fix/v1-2-source-current-identity
