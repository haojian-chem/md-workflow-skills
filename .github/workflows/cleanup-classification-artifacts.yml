name: Clean classification generated artifacts

on:
  push:
    branches:
      - work/1-2-classification-v1
    paths:
      - '.github/workflows/cleanup-classification-artifacts.yml'

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: work/1-2-classification-v1
          fetch-depth: 0

      - name: Remove generated caches and add ignore rules
        shell: bash
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          EOF

      - name: Install and verify
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 02_validators/component_and_residue_classification_validator/scripts/requirements.txt pytest
          python -m py_compile 02_validators/component_and_residue_classification_validator/scripts/*.py
          pytest -q -p no:cacheprovider 04_evals/component_and_residue_classification_validator/test_classification_v1.py

      - name: Commit cleanup
        shell: bash
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -f .github/workflows/cleanup-classification-artifacts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean classification test artifacts'
          git push origin HEAD:work/1-2-classification-v1
