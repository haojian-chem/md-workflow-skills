name: tmp-patch-manager-candidate-dir

on:
  push:
    branches: [feat/chain-component-selection-core]
    paths:
      - "tmp_patch_manager_candidate_dir.py"
      - ".github/workflows/tmp-patch-manager-candidate-dir.yml"
  pull_request:
    branches: [main]
    paths:
      - "tmp_patch_manager_candidate_dir.py"
      - ".github/workflows/tmp-patch-manager-candidate-dir.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chain-component-selection-core
      - name: Apply patch
        run: python tmp_patch_manager_candidate_dir.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04_evals/chain_and_component_selection/test_selection_manager_closure.py
          git commit -m "Prepare Manager candidate directory"
          git pull --rebase origin feat/chain-component-selection-core
          git push origin HEAD:feat/chain-component-selection-core
