name: Sync Stage 2 2.3 freeze summary

on:
  push:
    paths:
      - '.github/workflows/sync-stage2-23-freeze.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync Stage 2 summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('00_authoring/architecture_freezes/WORKFLOW2_STAGE2_ARCHITECTURE_FREEZE_AND_LINKED_ITP_HANDOFF.md')
          text = p.read_text()
          replacements = {
              '- `2.3` 的 Sobtop 参数化当前已敲定规则：**已专项冻结**；':
              '- `2.3` 的 Sobtop 参数化规则：**已专项冻结**；',
              '- `2.3` 的当前科研处理环节、六个核心结果文件、正式结果记录及向 2.5 交付的信息：**已冻结到当前版本**；':
              '- `2.3` 的当前科研处理环节、六个核心结果文件、最终实际采纳的 OPT / FREQ / SP 任务路径、正式结果记录及向 2.5 交付的信息：**已冻结到当前版本**；',
              '这里的阶段级检查只判断当前 Task Sheet 要求的结果覆盖是否闭合。它不重新执行 2.2 / 2.3 / 2.4 的科学 validation，也不替 2.5 检查实际 integration artifact 的内部一致性。':
              '这里的阶段级检查只判断当前 Task Sheet 要求的结果覆盖是否闭合。它不重新执行 2.2 / 2.3 / 2.4 各自的科研处理与检查，也不替 2.5 检查实际 integration artifact 的内部一致性。',
              'Sobtop 参数化当前已经敲定的规则保存于 `WORKFLOW2_STAGE2_2.3_SOBTOP_PARAMETERIZATION_RULES_FREEZE.md`，其余尚未敲定的详细规则继续在 2.3 设计中确定，不在 Stage 2 总架构中维护第二套规范。':
              'Sobtop 参数化相关规则保存于 `WORKFLOW2_STAGE2_2.3_SOBTOP_PARAMETERIZATION_RULES_FREEZE.md`，不在 Stage 2 总架构中维护第二套规范。',
              '作为本环节正式结果记录。该 YAML 统一登记六个核心结果的完整路径，并记录标准残基一侧需要删除的原子与残基级电荷修改范围。项目结果索引只登记 `topology_linked_parameterization_result.yaml`，不分别登记六个核心结果文件。':
              '作为本环节正式结果记录。该 YAML 统一登记六个核心结果的完整路径、最终实际采纳的 OPT / FREQ / SP 任务路径，并记录标准残基一侧需要删除的原子与残基级电荷修改范围。项目结果索引只登记 `topology_linked_parameterization_result.yaml`，不分别登记六个核心结果文件。',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'Missing expected text: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_authoring/architecture_freezes/WORKFLOW2_STAGE2_ARCHITECTURE_FREEZE_AND_LINKED_ITP_HANDOFF.md
          git commit -m 'Sync Stage 2 summary with finalized 2.3 rules'
          git push
