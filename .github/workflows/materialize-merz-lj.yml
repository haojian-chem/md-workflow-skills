name: Materialize Merz LJ refs

on:
  push:
    paths:
      - '.github/workflows/materialize-merz-lj.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Materialize Merz LJ references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 02_topology_preparation/references
          cat > /tmp/merz126.xz.b64 <<'EOF126'
          
          EOF126
          cat > /tmp/merz1264.xz.b64 <<'EOF1264'
          
          EOF1264
          base64 -d /tmp/merz126.xz.b64 | xz -d > 02_topology_preparation/references/merz_ion_lj_12-6.itp
          base64 -d /tmp/merz1264.xz.b64 | xz -d > 02_topology_preparation/references/merz_ion_lj_12-6-4.itp
          test "$(wc -c < 02_topology_preparation/references/merz_ion_lj_12-6.itp)" -eq 106909
          test "$(wc -c < 02_topology_preparation/references/merz_ion_lj_12-6-4.itp)" -eq 57365
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 02_topology_preparation/references/merz_ion_lj_12-6.itp 02_topology_preparation/references/merz_ion_lj_12-6-4.itp
          if ! git diff --cached --quiet; then
            git commit -m 'Add Stage 2 Merz LJ parameter references'
            git push origin HEAD:main
          fi
