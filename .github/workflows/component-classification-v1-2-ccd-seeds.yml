name: component-classification-v1-2-ccd-seeds

on:
  workflow_dispatch:
  push:
    branches:
      - skill-1-2-state-redesign
    paths:
      - ".github/ccd-seed-sync-trigger"

permissions:
  contents: write

jobs:
  sync-approved-seeds:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 02_validators/component_and_residue_classification_validator/scripts/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 02_validators/component_and_residue_classification_validator/scripts/requirements.txt
      - name: Synchronize approved RCSB CCD seeds
        run: |
          python 02_validators/component_and_residue_classification_validator/scripts/sync_approved_ccd_seeds.py \
            --manifest 02_validators/component_and_residue_classification_validator/references/approved_ccd_seed_manifest.yaml \
            --library 02_validators/component_and_residue_classification_validator/references/ccd_library \
            --download-dir .ccd_seed_downloads
      - name: Verify approved seed coverage and hashes
        run: |
          python 02_validators/component_and_residue_classification_validator/scripts/sync_approved_ccd_seeds.py \
            --manifest 02_validators/component_and_residue_classification_validator/references/approved_ccd_seed_manifest.yaml \
            --library 02_validators/component_and_residue_classification_validator/references/ccd_library \
            --verify-only
          git diff --check
      - name: Commit generated seed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 02_validators/component_and_residue_classification_validator/references/ccd_library
          if git diff --cached --quiet; then
            echo "No CCD seed changes"
            exit 0
          fi
          git commit -m "Add approved Skill 1.2 CCD seeds"
          git push origin "HEAD:${GITHUB_REF_NAME}"
