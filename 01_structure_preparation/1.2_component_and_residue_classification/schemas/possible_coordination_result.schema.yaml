$schema: https://json-schema.org/draft/2020-12/schema
$id: possible_coordination_result.schema.yaml
title: Possible metal coordination check result
type: object
additionalProperties: false
required: [schema_version, status, reason, input, definition_results]
properties:
  schema_version: {const: "1.0"}
  status: {enum: [COMPLETED, NOT_PERFORMED]}
  reason: {type: [string, "null"]}
  input:
    type: object
    additionalProperties: false
    required: [structure_path, structure_sha256, selected_model_id, definition_path, definition_sha256, observations_path]
    properties:
      structure_path: {type: string, minLength: 1}
      structure_sha256: {$ref: "#/$defs/sha256"}
      selected_model_id: {type: string, minLength: 1}
      definition_path: {type: [string, "null"]}
      definition_sha256:
        oneOf: [{type: "null"}, {$ref: "#/$defs/sha256"}]
      observations_path: {type: string, minLength: 1}
  definition_results:
    type: array
    items: {$ref: "#/$defs/definition_result"}
$defs:
  sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
  nullable_string: {type: [string, "null"]}
  source_resid:
    type: object
    additionalProperties: false
    required: [number, insertion_code]
    properties:
      number: {type: string, minLength: 1}
      insertion_code: {$ref: "#/$defs/nullable_string"}
  source_atom_identity:
    type: object
    additionalProperties: false
    required: [source_model_id, source_chain_id, source_resid, source_residue_name, source_atom_name, source_altloc_id]
    properties:
      source_model_id: {type: string, minLength: 1}
      source_chain_id: {$ref: "#/$defs/nullable_string"}
      source_resid: {$ref: "#/$defs/source_resid"}
      source_residue_name: {type: string, minLength: 1}
      source_atom_name: {type: string, minLength: 1}
      source_altloc_id: {$ref: "#/$defs/nullable_string"}
  current_atom_identity:
    type: object
    additionalProperties: false
    required: [current_model_id, current_chain_id, current_resid, current_residue_name, current_atom_name, current_altloc_id]
    properties:
      current_model_id: {type: string, minLength: 1}
      current_chain_id: {$ref: "#/$defs/nullable_string"}
      current_resid: {$ref: "#/$defs/source_resid"}
      current_residue_name: {type: string, minLength: 1}
      current_atom_name: {type: string, minLength: 1}
      current_altloc_id: {$ref: "#/$defs/nullable_string"}
  endpoint:
    type: object
    additionalProperties: true
    required: [chain_index, source_identity, current_identity, source_chain_id, source_resid, residue_name, atom_name, altloc_id]
    properties:
      chain_index: {type: integer, minimum: 1}
      source_identity: {$ref: "#/$defs/source_atom_identity"}
      current_identity: {$ref: "#/$defs/current_atom_identity"}
      source_chain_id: {$ref: "#/$defs/nullable_string"}
      source_resid: {$ref: "#/$defs/source_resid"}
      residue_name: {type: string, minLength: 1}
      atom_name: {type: string, minLength: 1}
      altloc_id: {$ref: "#/$defs/nullable_string"}
  geometry:
    oneOf:
      - {type: "null"}
      - type: object
        additionalProperties: false
        required: [distance_angstrom, configured_range, range_status]
        properties:
          distance_angstrom: {type: number, minimum: 0}
          configured_range:
            type: object
            additionalProperties: false
            required: [minimum, maximum]
            properties:
              minimum: {type: number, minimum: 0}
              maximum: {type: number, minimum: 0}
          range_status: {enum: [BELOW_MINIMUM, WITHIN_RANGE, ABOVE_MAXIMUM]}
  explicit_relation:
    type: object
    additionalProperties: false
    required: [status, source_type, relation_type]
    properties:
      status: {enum: [ABSENT, PRESENT, AMBIGUOUS]}
      source_type: {$ref: "#/$defs/nullable_string"}
      relation_type: {$ref: "#/$defs/nullable_string"}
  pair_result:
    type: object
    additionalProperties: false
    required: [relation_id, metal, donor, explicit_coordination, geometry, status, detail, confirmation_required, topology_effect_evaluation]
    properties:
      relation_id: {type: string, pattern: "^relation:v1/type/METAL_COORDINATION/endpoints/[0-9a-f]{64}$"}
      metal: {$ref: "#/$defs/endpoint"}
      donor: {$ref: "#/$defs/endpoint"}
      explicit_coordination: {$ref: "#/$defs/explicit_relation"}
      geometry: {$ref: "#/$defs/geometry"}
      status: {enum: [CONFIRMED_BY_STRUCTURE, GEOMETRY_SUPPORTED_COORDINATION_CANDIDATE, NOT_GEOMETRICALLY_SUPPORTED, COORDINATION_DEFINITION_CONFLICT, ELEMENT_MISMATCH, ELEMENT_UNRESOLVED, GEOMETRY_NOT_EVALUATED_MULTIPLE_CONFORMATIONS]}
      detail: {$ref: "#/$defs/nullable_string"}
      confirmation_required: {type: boolean}
      topology_effect_evaluation:
        type: object
        additionalProperties: false
        required: [promote_nonstandard_to_linked, application_status]
        properties:
          promote_nonstandard_to_linked: {type: boolean}
          application_status: {enum: [ELIGIBLE, PENDING_CONFIRMATION, NOT_APPLICABLE]}
  definition_result:
    type: object
    additionalProperties: true
    required: [definition_index, definition_status, matching_summary, pair_results]
    properties:
      definition_index: {type: integer, minimum: 1}
      definition_status: {enum: [EVALUATED, PARTNER_NOT_FOUND, ATOM_NOT_FOUND, ELEMENT_ISSUES]}
      pair_results:
        type: array
        items: {$ref: "#/$defs/pair_result"}
