$schema: https://json-schema.org/draft/2020-12/schema
$id: reference_manifest.schema.yaml
title: Stage 1.2 reference manifest
type: object
additionalProperties: false
required: [schema_version, classification_mode, references]
properties:
  schema_version:
    const: "2.0"
  classification_mode:
    enum: [REGISTRY, FORCE_FIELD_ANALYSIS]
  references:
    type: array
    items:
      $ref: "#/$defs/reference_record"
$defs:
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  reference_record:
    type: object
    additionalProperties: false
    required:
      - reference_id
      - roles
      - path
      - sha256
      - source
      - residue_names
      - component_ids
      - note
    properties:
      reference_id:
        type: string
        pattern: "^ref_[0-9]{3,}$"
      roles:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum:
            - PROJECT_RESIDUE_DEFINITIONS
            - SKILL_STANDARD_RESIDUE_REGISTRY
            - SKILL_TOPOLOGY_LINKED_REGISTRY
            - SKILL_INDEPENDENT_NONSTANDARD_REGISTRY
            - FORCE_FIELD_RESIDUE_DEFINITION
            - CCD_COMPONENT_DEFINITION
            - SEQUENCE_REFERENCE
            - COVALENT_RELATION_DEFINITION
            - METAL_COORDINATION_DEFINITION
            - OTHER
      path:
        type: string
        minLength: 1
      sha256:
        $ref: "#/$defs/sha256"
      source:
        enum: [PROJECT, SKILL, FORCE_FIELD, USER]
      residue_names:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      component_ids:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      note:
        type: [string, "null"]
