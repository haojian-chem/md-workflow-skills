$schema: https://json-schema.org/draft/2020-12/schema
$id: relation_decisions.schema.yaml
title: User decisions for Stage 1.2 relations
type: object
additionalProperties: false
required: [schema_version, model_id, decisions]
properties:
  schema_version:
    const: "2.0"
  model_id:
    type: string
    minLength: 1
  decisions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [relation_id, relation_type, decision]
      properties:
        relation_id:
          type: string
          pattern: "^relation_[0-9]{3,}$"
        relation_type:
          enum: [COVALENT_CONNECTION, METAL_COORDINATION]
        decision:
          enum: [CONFIRMED, REJECTED]
