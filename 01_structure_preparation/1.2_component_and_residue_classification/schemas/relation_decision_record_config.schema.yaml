$schema: https://json-schema.org/draft/2020-12/schema
$id: relation_decision_record_config.schema.yaml
title: Relation decision recording configuration
type: object
additionalProperties: false
required: [confirmation_requests, classification_observations, relation_decisions, decisions]
properties:
  confirmation_requests:
    $ref: "#/$defs/hashed_file"
  classification_observations:
    $ref: "#/$defs/file_path"
  relation_decisions:
    $ref: "#/$defs/file_path"
  decisions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [request_index, decision]
      properties:
        request_index: {type: integer, minimum: 1}
        decision: {enum: [CONFIRMED, REJECTED]}
  replace_existing: {type: boolean, default: false}
$defs:
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  hashed_file:
    type: object
    additionalProperties: false
    required: [path, sha256]
    properties:
      path: {type: string, minLength: 1}
      sha256: {$ref: "#/$defs/sha256"}
      schema: {type: string, minLength: 1}
  file_path:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: {type: string, minLength: 1}
      schema: {type: string, minLength: 1}
