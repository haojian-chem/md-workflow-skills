$schema: https://json-schema.org/draft/2020-12/schema
$id: classification_result.schema.yaml
title: Stage 1.2 component and residue classification result
type: object
additionalProperties: false
required:
  - schema_version
  - result_status
  - model
  - classification_mode
  - references
  - components
  - confirmed_relations
  - rejected_candidates
  - unresolved_items
properties:
  schema_version:
    const: "3.0"
  result_status:
    const: COMPLETE
  model:
    type: object
    additionalProperties: false
    required: [model_id, source_structure, source_format]
    properties:
      model_id:
        type: string
        minLength: 1
      source_structure:
        type: string
        minLength: 1
      source_format:
        enum: [PDB, MMCIF, AF3_CIF]
  classification_mode:
    enum: [REGISTRY, FORCE_FIELD_ANALYSIS]
  references:
    $ref: "#/$defs/reference_variables"
  components:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/component"
  confirmed_relations:
    $ref: "#/$defs/relation_collections"
  rejected_candidates:
    $ref: "#/$defs/relation_collections"
  unresolved_items:
    type: array
    items:
      $ref: "#/$defs/unresolved_item"

$defs:
  nullable_string:
    type: [string, "null"]

  evidence:
    oneOf:
      - type: string
        enum: ["智能体判断", "人工决策"]
      - type: string
        pattern: "^RTP_[1-9][0-9]*$"
      - type: string
        pattern: "^\\{CCD_PATH_[1-9][0-9]*\\}/[^{}]+\\.cif$"

  nullable_evidence:
    oneOf:
      - type: "null"
      - $ref: "#/$defs/evidence"

  reference_variables:
    type: object
    additionalProperties: false
    patternProperties:
      "^RTP_[1-9][0-9]*$":
        type: string
        minLength: 1
      "^CCD_PATH_[1-9][0-9]*$":
        type: string
        minLength: 1

  polymer_class:
    type: object
    additionalProperties: false
    required: [value, evidence]
    properties:
      value:
        enum: [POLYMER, BRANCHED, NONPOLYMER, WATER]
      evidence:
        $ref: "#/$defs/evidence"

  topology_class:
    type: object
    additionalProperties: false
    required: [value, evidence]
    properties:
      value:
        enum:
          - STANDARD_RESIDUE
          - TOPOLOGY_LINKED_NONSTANDARD
          - INDEPENDENT_NONSTANDARD
          - SOLVENT_COMPONENT
          - ION_COMPONENT
      evidence:
        $ref: "#/$defs/evidence"

  missing_residue_check:
    type: object
    additionalProperties: false
    required: [status, evidence]
    properties:
      status:
        enum: [PASS, ISSUE]
      evidence:
        $ref: "#/$defs/evidence"

  conformation_check:
    type: object
    additionalProperties: false
    required: [status, evidence]
    properties:
      status:
        enum: [PASS, ISSUE, SKIPPED]
      evidence:
        $ref: "#/$defs/nullable_evidence"
    allOf:
      - if:
          properties:
            status:
              const: SKIPPED
        then:
          properties:
            evidence:
              type: "null"
        else:
          properties:
            evidence:
              $ref: "#/$defs/evidence"

  atom_name_mismatch:
    type: object
    additionalProperties: false
    required: [current_atom_name, reference_atom_name]
    properties:
      current_atom_name:
        type: string
        minLength: 1
      reference_atom_name:
        type: string
        minLength: 1

  element_mismatch:
    type: object
    additionalProperties: false
    required: [atom_name, current_element, reference_element]
    properties:
      atom_name:
        type: string
        minLength: 1
      current_element:
        type: string
        minLength: 1
      reference_element:
        type: string
        minLength: 1

  heavy_atom_check:
    type: object
    additionalProperties: false
    required:
      - status
      - evidence
      - missing_heavy_atoms
      - extra_heavy_atoms
      - duplicate_atom_names
      - atom_name_mismatches
      - element_mismatches
    properties:
      status:
        enum: [PASS, ISSUE, SKIPPED, NOT_APPLICABLE]
      evidence:
        $ref: "#/$defs/nullable_evidence"
      missing_heavy_atoms:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      extra_heavy_atoms:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      duplicate_atom_names:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      atom_name_mismatches:
        type: array
        items:
          $ref: "#/$defs/atom_name_mismatch"
      element_mismatches:
        type: array
        items:
          $ref: "#/$defs/element_mismatch"
    allOf:
      - if:
          properties:
            status:
              const: SKIPPED
        then:
          properties:
            evidence:
              type: "null"
            missing_heavy_atoms:
              maxItems: 0
            extra_heavy_atoms:
              maxItems: 0
            duplicate_atom_names:
              maxItems: 0
            atom_name_mismatches:
              maxItems: 0
            element_mismatches:
              maxItems: 0
        else:
          properties:
            evidence:
              $ref: "#/$defs/evidence"
      - if:
          properties:
            status:
              const: PASS
        then:
          properties:
            missing_heavy_atoms:
              maxItems: 0
            extra_heavy_atoms:
              maxItems: 0
            duplicate_atom_names:
              maxItems: 0
            atom_name_mismatches:
              maxItems: 0
            element_mismatches:
              maxItems: 0
      - if:
          properties:
            status:
              const: ISSUE
        then:
          anyOf:
            - properties:
                missing_heavy_atoms:
                  minItems: 1
            - properties:
                extra_heavy_atoms:
                  minItems: 1
            - properties:
                duplicate_atom_names:
                  minItems: 1
            - properties:
                atom_name_mismatches:
                  minItems: 1
            - properties:
                element_mismatches:
                  minItems: 1

  residue:
    type: object
    additionalProperties: false
    required:
      - residue_id
      - source_chain_id
      - current_chain_id
      - source_resid
      - current_resid
      - source_residue_name
      - current_residue_name
      - polymer_class
      - topology_class
      - missing_residue_check
      - conformation_check
      - heavy_atom_check
    properties:
      residue_id:
        type: string
        pattern: "^residue_[0-9]{3,}$"
      source_chain_id:
        $ref: "#/$defs/nullable_string"
      current_chain_id:
        $ref: "#/$defs/nullable_string"
      source_resid:
        type: string
        minLength: 1
      current_resid:
        $ref: "#/$defs/nullable_string"
      source_residue_name:
        type: string
        minLength: 1
      current_residue_name:
        $ref: "#/$defs/nullable_string"
      polymer_class:
        $ref: "#/$defs/polymer_class"
      topology_class:
        $ref: "#/$defs/topology_class"
      missing_residue_check:
        $ref: "#/$defs/missing_residue_check"
      conformation_check:
        $ref: "#/$defs/conformation_check"
      heavy_atom_check:
        $ref: "#/$defs/heavy_atom_check"
    allOf:
      - if:
          properties:
            missing_residue_check:
              properties:
                status:
                  const: ISSUE
        then:
          properties:
            current_resid:
              type: "null"
            current_residue_name:
              type: "null"
            conformation_check:
              properties:
                status:
                  const: SKIPPED
            heavy_atom_check:
              properties:
                status:
                  const: SKIPPED
        else:
          properties:
            current_resid:
              type: string
              minLength: 1
            current_residue_name:
              type: string
              minLength: 1
      - if:
          properties:
            conformation_check:
              properties:
                status:
                  const: ISSUE
        then:
          properties:
            heavy_atom_check:
              properties:
                status:
                  const: SKIPPED
      - if:
          allOf:
            - properties:
                missing_residue_check:
                  properties:
                    status:
                      const: PASS
            - properties:
                conformation_check:
                  properties:
                    status:
                      const: PASS
        then:
          properties:
            heavy_atom_check:
              properties:
                status:
                  enum: [PASS, ISSUE, NOT_APPLICABLE]

  component:
    type: object
    additionalProperties: false
    required: [component_id, chain_index, residues]
    properties:
      component_id:
        type: string
        pattern: "^component_[0-9]{3,}$"
      chain_index:
        type: integer
        minimum: 1
      residues:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/residue"

  relation_endpoint:
    type: object
    additionalProperties: false
    required: [component_id, residue_id, atom_name]
    properties:
      component_id:
        type: string
        pattern: "^component_[0-9]{3,}$"
      residue_id:
        type: string
        pattern: "^residue_[0-9]{3,}$"
      atom_name:
        type: string
        minLength: 1

  relation:
    type: object
    additionalProperties: false
    required:
      - relation_id
      - endpoint_1
      - endpoint_2
      - evidence
      - topology_effect_applied
    properties:
      relation_id:
        type: string
        pattern: "^relation_[0-9]{3,}$"
      endpoint_1:
        $ref: "#/$defs/relation_endpoint"
      endpoint_2:
        $ref: "#/$defs/relation_endpoint"
      evidence:
        $ref: "#/$defs/evidence"
      topology_effect_applied:
        type: boolean

  relation_collections:
    type: object
    additionalProperties: false
    required: [covalent_connections, metal_coordination]
    properties:
      covalent_connections:
        type: array
        items:
          $ref: "#/$defs/relation"
      metal_coordination:
        type: array
        items:
          $ref: "#/$defs/relation"

  unresolved_item:
    type: object
    additionalProperties: false
    required: [subject, detail]
    properties:
      subject:
        type: string
        minLength: 1
      detail:
        type: string
        minLength: 1
