schema_version: 2
status: active_partial
purpose: lightweight_manager_initial_planning

runtime_policy:
  manager_reads_for:
    - new_task_initial_planning
    - explicit_task_replanning
  not_for:
    - scientific_execution
    - reuse_validation
    - step_preflight
    - validator_logic
    - runtime_state_tracking

workflow_order:
  - structure_preparation
  - topology_preparation
  - md_preparation
  - md_simulation
  - analysis

directory_policy:
  base_directory_initialization_owner: project_initialization
  manager_may_ensure_defined_base_directories: true
  manager_creates_task_execution_directories: false
  task_execution_directory_pattern: "{base_work_directory}/{task_id}"
  task_execution_directory_creation_owner: task_execution_agent
  create_task_directory_only_when_execution_is_required: true
  reuse_without_local_execution_does_not_require_task_directory: true

workflows:
  structure_preparation:
    workflow_id: "1"
    name: structure_preparation
    project_directory: 01_structure_preparation
    step_catalog_status: defined
    steps:
      - id: "1.1"
        name: source_recognition
        base_work_directory: 01_structure_preparation/01_source_recognition
        conditional: false

      - id: "1.2"
        name: component_and_residue_classification
        base_work_directory: 01_structure_preparation/02_component_and_residue_classification
        conditional: false

      - id: "1.3"
        name: chain_and_component_selection
        base_work_directory: 01_structure_preparation/03_chain_and_component_selection
        conditional: false

      - id: "1.4"
        name: altloc_occupancy_resolution
        base_work_directory: 01_structure_preparation/04_altloc_occupancy_resolution
        conditional: true

      - id: "1.5"
        name: completeness_check
        base_work_directory: 01_structure_preparation/05_completeness_check
        conditional: false

      - id: "1.6"
        name: missing_region_completion
        base_work_directory: 01_structure_preparation/06_missing_region_completion
        conditional: true

      - id: "1.7"
        name: protein_protonation_assignment
        base_work_directory: 01_structure_preparation/07_protein_protonation_assignment
        conditional: true

      - id: "1.8"
        name: reorder_and_mapping
        base_work_directory: 01_structure_preparation/08_reorder_and_mapping
        conditional: false

      - id: "1.9"
        name: validation
        base_work_directory: 01_structure_preparation/09_validation
        conditional: false

  topology_preparation:
    workflow_id: "2"
    name: topology_preparation
    project_directory: 02_topology_preparation
    step_catalog_status: not_defined
    steps: []

  md_preparation:
    workflow_id: "3"
    name: md_preparation
    project_directory: 03_md_preparation
    step_catalog_status: not_defined
    steps: []

  md_simulation:
    workflow_id: "4"
    name: md_simulation
    project_directory: 04_md_simulation
    step_catalog_status: not_defined
    steps: []

  analysis:
    workflow_id: "5"
    name: analysis
    project_directory: 05_analysis
    step_catalog_status: not_defined
    steps: []

planning_rules:
  - preserve_defined_step_order
  - task_scope_is_the_set_of_steps_written_into_the_task_sheet
  - do_not_create_start_end_or_route_objects
  - do_not_invent_steps_for_workflows_with_undefined_step_catalogs
  - conditional_steps_may_be_listed_initially_when_no_evidence_resolves_them
  - task_sheet_work_directory_is_planned_as_base_work_directory_plus_task_id
  - manager_records_but_does_not_create_task_specific_execution_directories
  - task_execution_agent_may_remove_or_add_steps_later_based_on_execution_evidence_or_explicit_user_scope_change

forbidden_content:
  - scientific_decision_rules
  - reuse_conditions
  - input_output_schemas
  - preflight_rules
  - validator_rules
  - commands
  - software_dependencies
  - failure_recovery_protocols
  - user_confirmation_logic
  - artifact_lineage
  - subagent_prompts
