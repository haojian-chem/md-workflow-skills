$schema: https://json-schema.org/draft/2020-12/schema
$id: md_simulation_protocol_spec.schema.yaml
title: MD Simulation Scientific Protocol Specification
type: object
required:
  - schema_version
  - spec_id
  - workstream_id
  - system_artifact_set_ids
  - run_units
  - field_provenance
  - resolved_decision_ids
  - unresolved_items
  - supersedes_spec_id
  - revision_reason
  - policies
properties:
  schema_version: {type: integer, const: 2}
  spec_id: {type: string, minLength: 1}
  workstream_id: {type: string, minLength: 1}
  system_artifact_set_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  run_units:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/run_unit_spec'}
  field_provenance:
    type: array
    minItems: 1
    items:
      type: object
      required: [field_path, source_type, source_id]
      properties:
        field_path: {type: string, minLength: 1}
        source_type:
          enum:
            - STRUCTURED_PROTOCOL_INPUT
            - DECISION_RECORD
            - FILE
            - TEMPLATE_PROFILE
            - SYSTEM_ARTIFACT
            - MD_OUTPUT_ARTIFACT
            - ROUTE_SCOPE
        source_id: {type: string, minLength: 1}
        source_path: {type: [string, 'null']}
        notes: {type: [string, 'null']}
      additionalProperties: false
  resolved_decision_ids:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  unresolved_items:
    type: array
    items:
      type: object
      required: [item_id, category, description, blocking_stage, affected_field_paths, affected_run_unit_ids]
      properties:
        item_id: {type: string, minLength: 1}
        category: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        blocking_stage:
          enum: [PROTOCOL_VALIDATION, INPUT_PREPARATION, ATTEMPT_SPECIFICATION]
        affected_field_paths:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        affected_run_unit_ids:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
      additionalProperties: false
  supersedes_spec_id: {type: [string, 'null']}
  revision_reason: {type: [string, 'null']}
  policies:
    type: object
    required:
      - allow_implicit_scientific_defaults
      - require_explicit_run_dependencies
      - require_explicit_mdp_specification
      - require_field_provenance
      - preserve_source_files
      - runtime_configuration_is_external
    properties:
      allow_implicit_scientific_defaults: {const: false}
      require_explicit_run_dependencies: {const: true}
      require_explicit_mdp_specification: {const: true}
      require_field_provenance: {const: true}
      preserve_source_files: {const: true}
      runtime_configuration_is_external: {const: true}
    additionalProperties: false
additionalProperties: false
$defs:
  file_identity:
    type: object
    required: [path, sha256]
    properties:
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
      artifact_set_id: {type: [string, 'null']}
    additionalProperties: false
  typed_override:
    type: object
    required: [parameter, value_type, value, unit]
    properties:
      parameter: {type: string, minLength: 1}
      value_type: {enum: [STRING, INTEGER, NUMBER, BOOLEAN, STRING_LIST]}
      value: {}
      unit: {type: [string, 'null']}
    allOf:
      - if:
          properties: {value_type: {const: STRING}}
          required: [value_type]
        then:
          properties: {value: {type: string}}
      - if:
          properties: {value_type: {const: INTEGER}}
          required: [value_type]
        then:
          properties: {value: {type: integer}}
      - if:
          properties: {value_type: {const: NUMBER}}
          required: [value_type]
        then:
          properties: {value: {type: number}}
      - if:
          properties: {value_type: {const: BOOLEAN}}
          required: [value_type]
        then:
          properties: {value: {type: boolean}}
      - if:
          properties: {value_type: {const: STRING_LIST}}
          required: [value_type]
        then:
          properties:
            value:
              type: array
              items: {type: string}
    additionalProperties: false
  mdp_spec:
    type: object
    required: [source_kind, source, typed_overrides, rendering_policy]
    properties:
      source_kind: {enum: [FINAL_FILE, TEMPLATE_WITH_TYPED_OVERRIDES]}
      source: {$ref: '#/$defs/file_identity'}
      typed_overrides:
        type: array
        items: {$ref: '#/$defs/typed_override'}
      rendering_policy:
        enum: [USE_FILE_UNCHANGED, EXACT_PARAMETER_REPLACEMENT]
    allOf:
      - if:
          properties: {source_kind: {const: FINAL_FILE}}
          required: [source_kind]
        then:
          properties:
            typed_overrides: {maxItems: 0}
            rendering_policy: {const: USE_FILE_UNCHANGED}
      - if:
          properties: {source_kind: {const: TEMPLATE_WITH_TYPED_OVERRIDES}}
          required: [source_kind]
        then:
          properties:
            rendering_policy: {const: EXACT_PARAMETER_REPLACEMENT}
    additionalProperties: false
  expected_output:
    type: object
    required: [role, required, custom_role]
    properties:
      role:
        enum:
          - LOG
          - ENERGY
          - TRAJECTORY_FULL
          - TRAJECTORY_COMPRESSED
          - FINAL_STRUCTURE
          - CHECKPOINT
          - OTHER
      required: {type: boolean}
      custom_role: {type: [string, 'null']}
    allOf:
      - if:
          properties: {role: {const: OTHER}}
          required: [role]
        then:
          properties:
            custom_role: {type: string, minLength: 1}
      - if:
          properties:
            role:
              enum: [LOG, ENERGY, TRAJECTORY_FULL, TRAJECTORY_COMPRESSED, FINAL_STRUCTURE, CHECKPOINT]
          required: [role]
        then:
          properties:
            custom_role: {type: 'null'}
    additionalProperties: false
  completion_check:
    type: object
    required: [check_id, metric_id, operator, value, unit, blocking]
    properties:
      check_id: {type: string, minLength: 1}
      metric_id: {type: string, minLength: 1}
      operator: {enum: [LT, LE, EQ, GE, GT, BETWEEN]}
      value:
        oneOf:
          - type: number
          - type: array
            minItems: 2
            maxItems: 2
            items: {type: number}
      unit: {type: [string, 'null']}
      blocking: {type: boolean}
    additionalProperties: false
  completion_criteria:
    type: object
    required:
      - completion_mode
      - require_normal_termination
      - target_nsteps
      - target_time_ps
      - require_checkpoint
      - role_specific_checks
    properties:
      completion_mode:
        enum: [TARGET_STEP_OR_TIME, NORMAL_TERMINATION_ONLY, ROLE_SPECIFIC]
      require_normal_termination: {type: boolean}
      target_nsteps: {type: [integer, 'null'], minimum: 0}
      target_time_ps: {type: [number, 'null'], minimum: 0}
      require_checkpoint: {type: boolean}
      role_specific_checks:
        type: array
        items: {$ref: '#/$defs/completion_check'}
    allOf:
      - if:
          properties: {completion_mode: {const: TARGET_STEP_OR_TIME}}
          required: [completion_mode]
        then:
          anyOf:
            - properties: {target_nsteps: {type: integer}}
            - properties: {target_time_ps: {type: number}}
      - if:
          properties: {completion_mode: {const: ROLE_SPECIFIC}}
          required: [completion_mode]
        then:
          properties:
            role_specific_checks: {minItems: 1}
    additionalProperties: false
  run_unit_spec:
    type: object
    required:
      - run_unit_id
      - role
      - depends_on
      - mdp_spec
      - start_state
      - preprocessing_policy
      - expected_outputs
      - completion_criteria
    properties:
      run_unit_id: {type: string, minLength: 1}
      role:
        enum: [ENERGY_MINIMIZATION, EQUILIBRATION, PRODUCTION, CUSTOM]
      depends_on:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      mdp_spec: {$ref: '#/$defs/mdp_spec'}
      start_state:
        type: object
        required: [source_type, source_run_unit_id, input_checkpoint]
        properties:
          source_type: {enum: [SYSTEM, PRIOR_RUN_OUTPUT]}
          source_run_unit_id: {type: [string, 'null']}
          input_checkpoint:
            oneOf:
              - type: 'null'
              - $ref: '#/$defs/file_identity'
        allOf:
          - if:
              properties: {source_type: {const: SYSTEM}}
              required: [source_type]
            then:
              properties:
                source_run_unit_id: {type: 'null'}
                input_checkpoint: {type: 'null'}
          - if:
              properties: {source_type: {const: PRIOR_RUN_OUTPUT}}
              required: [source_type]
            then:
              properties:
                source_run_unit_id: {type: string, minLength: 1}
        additionalProperties: false
      preprocessing_policy:
        type: object
        required: [maxwarn, require_index, require_reference_coordinates]
        properties:
          maxwarn: {type: integer, minimum: 0}
          require_index: {type: boolean}
          require_reference_coordinates: {type: boolean}
        additionalProperties: false
      expected_outputs:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/expected_output'}
      completion_criteria: {$ref: '#/$defs/completion_criteria'}
    additionalProperties: false