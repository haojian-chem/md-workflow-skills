$schema: https://json-schema.org/draft/2020-12/schema
$id: md_simulation_plan.schema.yaml
title: Immutable MD Simulation Task Projection Plan
type: object
required:
  - schema_version
  - plan_id
  - workstream_id
  - protocol_spec
  - protocol_spec_id
  - protocol_validator_task_id
  - system_artifact_set_ids
  - run_unit_projection
  - unresolved_gates
  - supersedes_plan_id
  - revision_reason
  - policies
properties:
  schema_version: {type: integer, const: 2}
  plan_id: {type: string, minLength: 1}
  workstream_id: {type: string, minLength: 1}
  protocol_spec: {$ref: '#/$defs/file_identity'}
  protocol_spec_id: {type: string, minLength: 1}
  protocol_validator_task_id: {type: string, minLength: 1}
  system_artifact_set_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  run_unit_projection:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/run_unit_projection'}
  unresolved_gates:
    type: array
    items:
      type: object
      required: [item_id, blocking_stage, affected_run_unit_ids]
      properties:
        item_id: {type: string, minLength: 1}
        blocking_stage:
          enum: [INPUT_PREPARATION, ATTEMPT_SPECIFICATION]
        affected_run_unit_ids:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
      additionalProperties: false
  supersedes_plan_id: {type: [string, 'null']}
  revision_reason: {type: [string, 'null']}
  policies:
    type: object
    required:
      - immutable
      - protocol_is_scientific_owner
      - route_is_derived_projection
      - runtime_status_not_embedded
      - preserve_previous_plan
    properties:
      immutable: {const: true}
      protocol_is_scientific_owner: {const: true}
      route_is_derived_projection: {const: true}
      runtime_status_not_embedded: {const: true}
      preserve_previous_plan: {const: true}
    additionalProperties: false
additionalProperties: false
$defs:
  file_identity:
    type: object
    required: [path, sha256]
    properties:
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
    additionalProperties: false
  run_unit_projection:
    type: object
    required:
      - run_unit_id
      - protocol_field_path
      - role
      - depends_on
      - work_directory
      - input_work_directory
      - attempts_work_directory
      - start_state_source_type
      - start_state_source_run_unit_id
      - input_gate_status
      - attempt_gate_status
      - blocking_item_ids
    properties:
      run_unit_id: {type: string, minLength: 1}
      protocol_field_path: {type: string, minLength: 1}
      role:
        enum: [ENERGY_MINIMIZATION, EQUILIBRATION, PRODUCTION, CUSTOM]
      depends_on:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      work_directory: {type: string, minLength: 1}
      input_work_directory: {type: string, minLength: 1}
      attempts_work_directory: {type: string, minLength: 1}
      start_state_source_type: {enum: [SYSTEM, PRIOR_RUN_OUTPUT]}
      start_state_source_run_unit_id: {type: [string, 'null']}
      input_gate_status: {enum: [READY, BLOCKED_BY_UNRESOLVED_ITEM]}
      attempt_gate_status: {enum: [READY, BLOCKED_BY_UNRESOLVED_ITEM]}
      blocking_item_ids:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
    allOf:
      - if:
          properties: {start_state_source_type: {const: SYSTEM}}
        then:
          properties:
            start_state_source_run_unit_id: {type: 'null'}
      - if:
          properties: {start_state_source_type: {const: PRIOR_RUN_OUTPUT}}
        then:
          properties:
            start_state_source_run_unit_id: {type: string, minLength: 1}
    additionalProperties: false