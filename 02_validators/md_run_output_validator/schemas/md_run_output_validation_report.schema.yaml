$schema: https://json-schema.org/draft/2020-12/schema
$id: md_run_output_validation_report.schema.yaml
title: MD Run Output Validation Report
type: object
required:
  - schema_version
  - task_id
  - workstream_id
  - protocol_spec_id
  - plan_id
  - run_unit_id
  - md_input_artifact_set_id
  - attempt_results
  - accepted_attempt_order
  - output_files
  - actual_completion
  - chain_findings
  - role_specific_checks
  - run_output_manifest
  - warnings
  - outcome_code
  - gate_recommendation
properties:
  schema_version: {type: integer, const: 1}
  task_id: {type: string, minLength: 1}
  workstream_id: {type: string, minLength: 1}
  protocol_spec_id: {type: string, minLength: 1}
  plan_id: {type: string, minLength: 1}
  run_unit_id: {type: string, minLength: 1}
  md_input_artifact_set_id: {type: string, minLength: 1}
  attempt_results:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - attempt_id
        - execution_spec_id
        - attempt_kind
        - parent_attempt_id
        - classification
        - terminal_status
        - accepted
        - reason
      properties:
        attempt_id: {type: string, minLength: 1}
        execution_spec_id: {type: string, minLength: 1}
        attempt_kind: {enum: [FRESH, RETRY_SAME_INPUT, CONTINUE_NOAPPEND]}
        parent_attempt_id: {type: [string, 'null']}
        classification: {enum: [ACCEPTED, FAILED, CANCELLED, SUPERSEDED, UNRESOLVED]}
        terminal_status: {enum: [FINISHED_UNVERIFIED, FAILED, CANCELLED, UNKNOWN]}
        accepted: {type: boolean}
        reason: {type: string}
      additionalProperties: false
  accepted_attempt_order:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  output_files:
    type: array
    items:
      type: object
      required: [attempt_id, path, role, required, exists, readable, sha256, size_bytes, included_in_candidate]
      properties:
        attempt_id: {type: string, minLength: 1}
        path: {type: string, minLength: 1}
        role: {type: string, minLength: 1}
        required: {type: boolean}
        exists: {type: boolean}
        readable: {type: boolean}
        sha256:
          type: [string, 'null']
          pattern: '^[A-Fa-f0-9]{64}$'
        size_bytes: {type: [integer, 'null'], minimum: 0}
        included_in_candidate: {type: boolean}
      additionalProperties: false
  actual_completion:
    type: object
    required: [final_attempt_id, final_step, final_time_ps, target_step_met, target_time_met]
    properties:
      final_attempt_id: {type: [string, 'null']}
      final_step: {type: [integer, 'null'], minimum: 0}
      final_time_ps: {type: [number, 'null'], minimum: 0}
      target_step_met: {type: [boolean, 'null']}
      target_time_met: {type: [boolean, 'null']}
    additionalProperties: false
  chain_findings:
    type: object
    required:
      - graph_acyclic
      - branch_unique
      - tpr_identity_consistent
      - checkpoint_continuity
      - step_time_continuity
      - output_isolation
      - final_structure_unique
      - final_checkpoint_unique
    properties:
      graph_acyclic: {type: boolean}
      branch_unique: {type: boolean}
      tpr_identity_consistent: {type: boolean}
      checkpoint_continuity: {type: boolean}
      step_time_continuity: {type: boolean}
      output_isolation: {type: boolean}
      final_structure_unique: {type: boolean}
      final_checkpoint_unique: {type: boolean}
    additionalProperties: false
  role_specific_checks:
    type: array
    items:
      type: object
      required: [check_id, metric_id, blocking, status, measured_value, unit, details]
      properties:
        check_id: {type: string, minLength: 1}
        metric_id: {type: string, minLength: 1}
        blocking: {type: boolean}
        status: {enum: [PASS, FAIL, UNRESOLVED, NOT_APPLICABLE]}
        measured_value:
          oneOf:
            - type: 'null'
            - type: number
            - type: array
              items: {type: number}
        unit: {type: [string, 'null']}
        details: {type: string}
      additionalProperties: false
  run_output_manifest: {$ref: '#/$defs/file_identity'}
  warnings:
    type: array
    items: {type: string}
  outcome_code:
    enum:
      - MD_RUN_OUTPUT_VALIDATED
      - MD_RUN_OUTPUT_VALIDATED_WITH_WARNINGS
      - RUN_OUTPUT_VALIDATOR_INPUT_INCOMPLETE
      - RUN_OUTPUT_ATTEMPT_GRAPH_INVALID
      - RUN_OUTPUT_ATTEMPT_BRANCH_UNRESOLVED
      - RUN_OUTPUT_ACTIVE_OR_UNKNOWN_ATTEMPT
      - RUN_OUTPUT_INPUT_OR_COMMAND_MISMATCH
      - RUN_OUTPUT_REQUIRED_ATTEMPT_FILE_MISSING
      - RUN_OUTPUT_FILE_UNREADABLE_OR_TRUNCATED
      - RUN_OUTPUT_FATAL_OR_NONZERO_EXIT
      - RUN_OUTPUT_CHECKPOINT_CHAIN_INVALID
      - RUN_OUTPUT_STEP_OR_TIME_CONTINUITY_INVALID
      - RUN_OUTPUT_TARGET_NOT_REACHED
      - RUN_OUTPUT_CROSS_FILE_INCONSISTENCY
      - RUN_OUTPUT_ROLE_SPECIFIC_CHECK_FAILED
      - RUN_OUTPUT_ROLE_SPECIFIC_CHECK_UNRESOLVED
      - RUN_OUTPUT_VALIDATOR_INTERNAL_FAILURE
  gate_recommendation:
    enum: [ACCEPT_RUN_MD_OUTPUT, REJECT_RUN_MD_OUTPUT, PAUSE_FOR_DECISION, BLOCK_FOR_RECOVERY]
additionalProperties: false
$defs:
  file_identity:
    type: object
    required: [path, sha256]
    properties:
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
      artifact_set_id: {type: [string, 'null']}
    additionalProperties: false