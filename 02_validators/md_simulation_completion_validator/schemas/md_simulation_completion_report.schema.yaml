$schema: https://json-schema.org/draft/2020-12/schema
$id: md_simulation_completion_report.schema.yaml
title: MD Simulation Completion Report
type: object
required:
  - schema_version
  - task_id
  - workstream_id
  - route_id
  - protocol_spec_id
  - plan_id
  - scope
  - run_units
  - dependency_closure
  - input_closure
  - attempt_closure
  - run_output_closure
  - stage_output_closure
  - lineage_valid
  - unresolved_items
  - warnings
  - outcome_code
  - gate_recommendation
properties:
  schema_version: {type: integer, const: 1}
  task_id: {type: string, minLength: 1}
  workstream_id: {type: string, minLength: 1}
  route_id: {type: string, minLength: 1}
  protocol_spec_id: {type: string, minLength: 1}
  plan_id: {type: string, minLength: 1}
  scope:
    type: object
    required: [start_substep, end_substep, workflow_exit_required]
    properties:
      start_substep: {type: [string, 'null']}
      end_substep: {type: [string, 'null']}
      workflow_exit_required: {type: boolean}
    additionalProperties: false
  run_units:
    type: object
    required: [required, skipped, out_of_scope]
    properties:
      required:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      skipped:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      out_of_scope:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
    additionalProperties: false
  dependency_closure:
    type: array
    items:
      type: object
      required: [run_unit_id, dependencies, closed]
      properties:
        run_unit_id: {type: string, minLength: 1}
        dependencies:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        closed: {type: boolean}
      additionalProperties: false
  input_closure:
    type: array
    items:
      type: object
      required: [run_unit_id, md_input_artifact_set_id, validator_task_id, accepted]
      properties:
        run_unit_id: {type: string, minLength: 1}
        md_input_artifact_set_id: {type: [string, 'null']}
        validator_task_id: {type: [string, 'null']}
        accepted: {type: boolean}
      additionalProperties: false
  attempt_closure:
    type: array
    items:
      type: object
      required: [run_unit_id, accepted_attempt_ids, unresolved_attempt_ids, closed]
      properties:
        run_unit_id: {type: string, minLength: 1}
        accepted_attempt_ids:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        unresolved_attempt_ids:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        closed: {type: boolean}
      additionalProperties: false
  run_output_closure:
    type: array
    items:
      type: object
      required: [run_unit_id, artifact_set_id, manifest, accepted]
      properties:
        run_unit_id: {type: string, minLength: 1}
        artifact_set_id: {type: [string, 'null']}
        manifest:
          oneOf:
            - type: 'null'
            - $ref: '#/$defs/file_identity'
        accepted: {type: boolean}
      additionalProperties: false
  stage_output_closure:
    type: object
    required:
      - required
      - artifact_set_id
      - manifest
      - validator_task_id
      - included_run_output_artifact_set_ids
      - scope_matches
      - validated
    properties:
      required: {type: boolean}
      artifact_set_id: {type: [string, 'null']}
      manifest:
        oneOf:
          - type: 'null'
          - $ref: '#/$defs/file_identity'
      validator_task_id: {type: [string, 'null']}
      included_run_output_artifact_set_ids:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      scope_matches: {type: boolean}
      validated: {type: boolean}
    additionalProperties: false
  lineage_valid: {type: boolean}
  unresolved_items:
    type: array
    items: {type: string}
  warnings:
    type: array
    items: {type: string}
  outcome_code:
    enum:
      - MD_SIMULATION_SCOPE_COMPLETED
      - MD_SIMULATION_WORKFLOW_COMPLETED
      - COMPLETION_SCOPE_UNRESOLVED
      - SIMULATION_PROTOCOL_OR_PLAN_MISSING_OR_STALE
      - ROUTE_PLAN_MISMATCH
      - RUN_UNIT_SET_OR_DEPENDENCY_INVALID
      - REQUIRED_MD_INPUT_NOT_VALIDATED
      - ACTIVE_OR_UNVERIFIED_ATTEMPT_REMAINS
      - REQUIRED_RUN_OUTPUT_NOT_VALIDATED
      - STAGE_MD_OUTPUT_MISSING_OR_NOT_VALIDATED
      - STAGE_MD_OUTPUT_SCOPE_OR_LINEAGE_INVALID
      - FAILED_OR_CANCELLED_ATTEMPT_UNRESOLVED
      - COMPLETION_RECORD_MISMATCH
      - COMPLETION_VALIDATOR_INTERNAL_FAILURE
  gate_recommendation:
    enum: [COMPLETE_SCOPE, COMPLETE_WORKFLOW, REVISE_ROUTE, PAUSE_FOR_DECISION, BLOCK_FOR_RECOVERY]
additionalProperties: false
$defs:
  file_identity:
    type: object
    required: [path, sha256]
    properties:
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
      artifact_set_id: {type: [string, 'null']}
    additionalProperties: false