$schema: https://json-schema.org/draft/2020-12/schema
$id: md_simulation_protocol_validation_report.schema.yaml
title: MD Simulation Protocol Validation Report
type: object
required:
  - schema_version
  - task_id
  - workstream_id
  - protocol_spec
  - system_artifact_set_ids
  - source_findings
  - field_provenance_findings
  - run_unit_findings
  - mdp_findings
  - completion_findings
  - runtime_separation_findings
  - unresolved_item_findings
  - revision_findings
  - warnings
  - outcome_code
  - gate_recommendation
properties:
  schema_version: {type: integer, const: 2}
  task_id: {type: string, minLength: 1}
  workstream_id: {type: string, minLength: 1}
  protocol_spec:
    type: object
    required: [spec_id, path, sha256]
    properties:
      spec_id: {type: string, minLength: 1}
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
    additionalProperties: false
  system_artifact_set_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  source_findings:
    type: object
    required: [structured_inputs_valid, decisions_traceable, files_match_hashes, route_scope_matches]
    properties:
      structured_inputs_valid: {type: boolean}
      decisions_traceable: {type: boolean}
      files_match_hashes: {type: boolean}
      route_scope_matches: {type: boolean}
    additionalProperties: false
  field_provenance_findings:
    type: object
    required: [required_field_count, covered_field_count, uncovered_field_paths, conflicting_field_paths, invalid_source_paths]
    properties:
      required_field_count: {type: integer, minimum: 0}
      covered_field_count: {type: integer, minimum: 0}
      uncovered_field_paths:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      conflicting_field_paths:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      invalid_source_paths:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
    additionalProperties: false
  run_unit_findings:
    type: array
    items:
      type: object
      required: [run_unit_id, role_valid, dependency_valid, start_state_valid, output_roles_valid]
      properties:
        run_unit_id: {type: string, minLength: 1}
        role_valid: {type: boolean}
        dependency_valid: {type: boolean}
        start_state_valid: {type: boolean}
        output_roles_valid: {type: boolean}
      additionalProperties: false
  mdp_findings:
    type: array
    items:
      type: object
      required: [run_unit_id, source_kind, source_valid, overrides_valid, rendering_policy_valid]
      properties:
        run_unit_id: {type: string, minLength: 1}
        source_kind: {enum: [FINAL_FILE, TEMPLATE_WITH_TYPED_OVERRIDES]}
        source_valid: {type: boolean}
        overrides_valid: {type: boolean}
        rendering_policy_valid: {type: boolean}
      additionalProperties: false
  completion_findings:
    type: array
    items:
      type: object
      required: [run_unit_id, completion_mode, target_condition_valid, role_checks_valid]
      properties:
        run_unit_id: {type: string, minLength: 1}
        completion_mode: {enum: [TARGET_STEP_OR_TIME, NORMAL_TERMINATION_ONLY, ROLE_SPECIFIC]}
        target_condition_valid: {type: boolean}
        role_checks_valid: {type: boolean}
      additionalProperties: false
  runtime_separation_findings:
    type: object
    required: [runtime_fields_present, misplaced_field_paths]
    properties:
      runtime_fields_present: {type: boolean}
      misplaced_field_paths:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
    additionalProperties: false
  unresolved_item_findings:
    type: array
    items:
      type: object
      required: [item_id, blocking_stage, affected_field_paths, affected_run_unit_ids, classification_valid]
      properties:
        item_id: {type: string, minLength: 1}
        blocking_stage: {enum: [PROTOCOL_VALIDATION, INPUT_PREPARATION, ATTEMPT_SPECIFICATION]}
        affected_field_paths:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        affected_run_unit_ids:
          type: array
          items: {type: string, minLength: 1}
        classification_valid: {type: boolean}
      additionalProperties: false
  revision_findings:
    type: object
    required: [is_revision, supersedes_valid, revision_reason_present, old_spec_unchanged]
    properties:
      is_revision: {type: boolean}
      supersedes_valid: {type: boolean}
      revision_reason_present: {type: boolean}
      old_spec_unchanged: {type: boolean}
    additionalProperties: false
  warnings:
    type: array
    items: {type: string}
  outcome_code:
    enum:
      - SIMULATION_PROTOCOL_VALIDATED
      - SIMULATION_PROTOCOL_VALIDATED_WITH_DEFERRED_GATES
      - PROTOCOL_VALIDATOR_INPUT_INCOMPLETE
      - PROTOCOL_SPEC_SOURCE_MISMATCH
      - PROTOCOL_FIELD_PROVENANCE_INVALID
      - PROTOCOL_IMPLICIT_DEFAULT_DETECTED
      - PROTOCOL_RUN_UNIT_OR_DAG_INVALID
      - PROTOCOL_MDP_SPEC_INVALID
      - PROTOCOL_START_STATE_INVALID
      - PROTOCOL_COMPLETION_CRITERIA_INVALID
      - PROTOCOL_UNRESOLVED_ITEM_MISCLASSIFIED
      - PROTOCOL_RUNTIME_FIELD_MISPLACED
      - PROTOCOL_REVISION_CHAIN_INVALID
      - PROTOCOL_VALIDATOR_INTERNAL_FAILURE
  gate_recommendation:
    enum: [ACCEPT_PROTOCOL, REJECT_PROTOCOL, PAUSE_FOR_DECISION, BLOCK_FOR_RECOVERY]
additionalProperties: false