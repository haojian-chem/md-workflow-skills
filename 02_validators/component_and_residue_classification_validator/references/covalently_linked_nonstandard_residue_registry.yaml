schema_version: "1.0"
status: draft
purpose: Exact-name fallback classifications for commonly linked nonstandard residues.
matching:
  case_sensitive: true
  aliases: false
  regular_expressions: false
  duplicate_exact_names_allowed: false
principles:
  - A registry classification does not create a structure connection.
  - Instance-level covalent connections and topology-forming metal coordination are checked separately.
  - A confirmed topology-forming relation may promote an instance even when its baseline registry class was independent.
residue_definitions:
  - residue_name: MSE
    polymer_class: POLYMER
    topology_class: COVALENTLY_LINKED_NONSTANDARD
    ccd_id: MSE
  - residue_name: SEC
    polymer_class: POLYMER
    topology_class: COVALENTLY_LINKED_NONSTANDARD
    ccd_id: SEC
  - residue_name: PYL
    polymer_class: POLYMER
    topology_class: COVALENTLY_LINKED_NONSTANDARD
    ccd_id: PYL
  - residue_name: ACE
    polymer_class: NONPOLYMER
    topology_class: COVALENTLY_LINKED_NONSTANDARD
    ccd_id: ACE
  - residue_name: NME
    polymer_class: NONPOLYMER
    topology_class: COVALENTLY_LINKED_NONSTANDARD
    ccd_id: NME
  - residue_name: NH2
    polymer_class: NONPOLYMER
    topology_class: COVALENTLY_LINKED_NONSTANDARD
    ccd_id: NH2
