schema_version: 1
status: draft
principles:
  - Residue name alone is insufficient; atom composition, polymer context and explicit metadata must not conflict.
  - STANDARD_RESIDUE means eligible for the standard-residue workflow branch, not guaranteed support by every force field.
  - Entries with requires_force_field_check true must be rechecked during topology preparation.
canonical:
  protein:
    names: [ALA, ARG, ASN, ASP, CYS, GLN, GLU, GLY, HIS, ILE, LEU, LYS, MET, PHE, PRO, SER, THR, TRP, TYR, VAL]
    polymer_class: PROTEIN
    topology_class: STANDARD_RESIDUE
  dna:
    names: [DA, DC, DG, DT]
    polymer_class: DNA
    topology_class: STANDARD_RESIDUE
  rna:
    names: [A, C, G, U]
    polymer_class: RNA
    topology_class: STANDARD_RESIDUE
aliases:
  - names: [HID, HIE, HIP, HSD, HSE, HSP]
    canonical_parent: HIS
    polymer_class: PROTEIN
    topology_class: STANDARD_RESIDUE
    interpretation: histidine protonation/tautomer alias
    requires_polymer_context: true
    requires_force_field_check: true
  - names: [ASH]
    canonical_parent: ASP
    polymer_class: PROTEIN
    topology_class: STANDARD_RESIDUE
    interpretation: protonated aspartate alias
    requires_polymer_context: true
    requires_force_field_check: true
  - names: [GLH]
    canonical_parent: GLU
    polymer_class: PROTEIN
    topology_class: STANDARD_RESIDUE
    interpretation: protonated glutamate alias
    requires_polymer_context: true
    requires_force_field_check: true
  - names: [LYN]
    canonical_parent: LYS
    polymer_class: PROTEIN
    topology_class: STANDARD_RESIDUE
    interpretation: neutral lysine alias
    requires_polymer_context: true
    requires_force_field_check: true
  - names: [CYM, CYX]
    canonical_parent: CYS
    polymer_class: PROTEIN
    topology_class: STANDARD_RESIDUE
    interpretation: cysteine ionization/disulfide alias
    requires_polymer_context: true
    requires_connection_context: true
    requires_force_field_check: true
  - names: [ACE, NME, NH2]
    canonical_parent: null
    polymer_class: NONPOLYMER
    topology_class: COVALENTLY_LINKED_NONSTANDARD
    interpretation: common terminal cap candidate
    requires_explicit_or_backbone_connection: true
    requires_force_field_check: true
  - names: [MSE]
    canonical_parent: MET
    polymer_class: PROTEIN
    topology_class: COVALENTLY_LINKED_NONSTANDARD
    interpretation: selenomethionine polymer residue
    requires_polymer_context: true
    requires_force_field_check: true
  - names: [SEC]
    canonical_parent: CYS
    polymer_class: PROTEIN
    topology_class: COVALENTLY_LINKED_NONSTANDARD
    interpretation: selenocysteine polymer residue
    requires_polymer_context: true
    requires_force_field_check: true
  - names: [PYL]
    canonical_parent: LYS
    polymer_class: PROTEIN
    topology_class: COVALENTLY_LINKED_NONSTANDARD
    interpretation: pyrrolysine polymer residue
    requires_polymer_context: true
    requires_force_field_check: true
solvent_aliases:
  - names: [HOH, WAT, SOL, TIP3, TIP4, TIP5]
    polymer_class: WATER
    topology_class: SOLVENT
    required_elements: [O]
    hydrogen_atoms_optional: true
ion_rules:
  monoatomic_residue_names: [NA, K, CL, BR, I, F, LI, MG, CA, ZN, CU, FE, MN, CO, NI, AL, CD, HG, CS, SR, BA]
  requirements:
    atom_count: 1
    residue_element_must_match_name: true
    polymer_context_must_be_absent: true
  polymer_class: ION
  topology_class: ION
unknown_policy:
  on_name_match_with_conflicting_atoms: UNKNOWN
  on_missing_required_context: UNKNOWN
  decision_required_when_route_changes: true
