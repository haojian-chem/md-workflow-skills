$schema: https://json-schema.org/draft/2020-12/schema
$id: model_scope.schema.yaml
title: Model scope inspection result
schema_version: "1.0"
type: object
additionalProperties: false
required:
  - schema_version
  - input_structure
  - model_count
  - models
  - selection
properties:
  schema_version:
    const: "1.0"
  input_structure:
    type: object
    additionalProperties: false
    required:
      - path
      - sha256
      - source_format
    properties:
      path:
        type: string
        minLength: 1
      sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
      source_format:
        enum:
          - PDB
          - MMCIF
          - AF3_CIF
  model_count:
    type: integer
    minimum: 1
  models:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - model_id
        - chain_count
        - residue_count
        - atom_count
      properties:
        model_id:
          type: string
          minLength: 1
        chain_count:
          type: integer
          minimum: 0
        residue_count:
          type: integer
          minimum: 1
        atom_count:
          type: integer
          minimum: 1
  selection:
    type: object
    additionalProperties: false
    required:
      - status
      - selected_model_id
    properties:
      status:
        enum:
          - AUTO_SELECTED
          - USER_SELECTION_REQUIRED
          - USER_SELECTED
      selected_model_id:
        type:
          - string
          - "null"
allOf:
  - if:
      properties:
        model_count:
          const: 1
      required: [model_count]
    then:
      properties:
        selection:
          properties:
            status:
              const: AUTO_SELECTED
            selected_model_id:
              type: string
          required:
            - status
            - selected_model_id
  - if:
      properties:
        model_count:
          minimum: 2
      required: [model_count]
    then:
      properties:
        selection:
          oneOf:
            - properties:
                status:
                  const: USER_SELECTION_REQUIRED
                selected_model_id:
                  type: "null"
              required:
                - status
                - selected_model_id
            - properties:
                status:
                  const: USER_SELECTED
                selected_model_id:
                  type: string
              required:
                - status
                - selected_model_id
