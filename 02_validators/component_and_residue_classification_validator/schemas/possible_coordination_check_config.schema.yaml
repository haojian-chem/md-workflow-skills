$schema: https://json-schema.org/draft/2020-12/schema
$id: possible_coordination_check_config.schema.yaml
title: Possible metal coordination check configuration
type: object
additionalProperties: false
required: [structure, possible_coordination, classification_observations, output]
properties:
  structure: {$ref: "#/$defs/structure_input"}
  possible_coordination: {$ref: "#/$defs/optional_hashed_file"}
  classification_observations: {$ref: "#/$defs/file_path"}
  relation_decisions: {$ref: "#/$defs/file_path"}
  output:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: {type: string, minLength: 1}
      schema: {type: string, minLength: 1}
$defs:
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  structure_input:
    type: object
    additionalProperties: false
    required: [path, sha256, source_format, selected_model_id]
    properties:
      path: {type: string, minLength: 1}
      sha256: {$ref: "#/$defs/sha256"}
      source_format: {enum: [PDB, MMCIF, AF3_CIF]}
      selected_model_id: {type: string, minLength: 1}
  file_path:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path: {type: string, minLength: 1}
      schema: {type: string, minLength: 1}
  optional_hashed_file:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path:
        type: [string, "null"]
        minLength: 1
      sha256:
        oneOf:
          - {$ref: "#/$defs/sha256"}
          - {type: "null"}
      schema: {type: string, minLength: 1}
    allOf:
      - if:
          properties: {path: {type: string}}
          required: [path]
        then:
          required: [sha256]
          properties: {sha256: {$ref: "#/$defs/sha256"}}
