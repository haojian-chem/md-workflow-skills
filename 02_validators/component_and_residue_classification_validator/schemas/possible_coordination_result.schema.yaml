$schema: https://json-schema.org/draft/2020-12/schema
$id: possible_coordination_result.schema.yaml
title: Possible metal coordination check results
schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, status, input, definition_results]
properties:
  schema_version: {const: "1.0"}
  status:
    enum: [COMPLETED, NOT_PERFORMED]
  reason:
    type: [string, "null"]
  input:
    $ref: "#/$defs/input"
  definition_results:
    type: array
    items:
      $ref: "#/$defs/definition_result"
$defs:
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  nullable_string:
    type: [string, "null"]
  source_resid:
    type: object
    additionalProperties: false
    required: [number, insertion_code]
    properties:
      number: {type: string, minLength: 1}
      insertion_code:
        $ref: "#/$defs/nullable_string"
  endpoint_definition:
    type: object
    additionalProperties: false
    required: [residue_name, atom_name, element]
    properties:
      residue_name: {type: string, minLength: 1}
      atom_name: {type: string, minLength: 1}
      element: {type: string, pattern: "^[A-Z][a-z]?$"}
  endpoint:
    type: object
    additionalProperties: false
    required:
      - chain_index
      - source_chain_id
      - source_resid
      - residue_name
      - atom_name
      - altloc_id
      - expected_element
      - observed_element
      - element_source
    properties:
      chain_index: {type: integer, minimum: 1}
      source_chain_id:
        $ref: "#/$defs/nullable_string"
      source_resid:
        $ref: "#/$defs/source_resid"
      residue_name: {type: string, minLength: 1}
      atom_name: {type: string, minLength: 1}
      altloc_id:
        $ref: "#/$defs/nullable_string"
      expected_element: {type: string, pattern: "^[A-Z][a-z]?$"}
      observed_element:
        type: [string, "null"]
      element_source:
        type: [string, "null"]
  distance_range:
    type: object
    additionalProperties: false
    required: [minimum, maximum]
    properties:
      minimum: {type: number, minimum: 0}
      maximum: {type: number, exclusiveMinimum: 0}
  input:
    type: object
    additionalProperties: false
    required:
      - structure_path
      - structure_sha256
      - selected_model_id
      - definition_path
      - definition_sha256
      - observations_path
      - observations_sha256
    properties:
      structure_path: {type: string, minLength: 1}
      structure_sha256:
        $ref: "#/$defs/sha256"
      selected_model_id: {type: string, minLength: 1}
      definition_path:
        type: [string, "null"]
      definition_sha256:
        type: [string, "null"]
        pattern: "^[0-9a-f]{64}$"
      observations_path: {type: string, minLength: 1}
      observations_sha256:
        $ref: "#/$defs/sha256"
  matching_summary:
    type: object
    additionalProperties: false
    required:
      - metal_residue_count
      - metal_atom_count
      - donor_residue_count
      - donor_atom_count
      - considered_pair_count
      - recorded_pair_count
      - omitted_above_maximum_pair_count
    properties:
      metal_residue_count: {type: integer, minimum: 0}
      metal_atom_count: {type: integer, minimum: 0}
      donor_residue_count: {type: integer, minimum: 0}
      donor_atom_count: {type: integer, minimum: 0}
      considered_pair_count: {type: integer, minimum: 0}
      recorded_pair_count: {type: integer, minimum: 0}
      omitted_above_maximum_pair_count: {type: integer, minimum: 0}
  issue_instance:
    type: object
    additionalProperties: false
    required:
      - endpoint_role
      - chain_index
      - source_chain_id
      - source_resid
      - residue_name
      - atom_name
      - issue_type
    properties:
      endpoint_role: {enum: [METAL, DONOR]}
      chain_index: {type: integer, minimum: 1}
      source_chain_id:
        $ref: "#/$defs/nullable_string"
      source_resid:
        $ref: "#/$defs/source_resid"
      residue_name: {type: string, minLength: 1}
      atom_name: {type: string, minLength: 1}
      issue_type: {enum: [ATOM_NOT_FOUND, ELEMENT_MISMATCH, ELEMENT_UNRESOLVED]}
  explicit_coordination:
    type: object
    additionalProperties: false
    required: [status, source_type, relation_type]
    properties:
      status: {enum: [PRESENT, ABSENT, AMBIGUOUS]}
      source_type:
        type: [string, "null"]
      relation_type:
        type: [string, "null"]
  geometry:
    oneOf:
      - type: "null"
      - type: object
        additionalProperties: false
        required: [distance_angstrom, configured_range, range_status]
        properties:
          distance_angstrom: {type: number, minimum: 0}
          configured_range:
            $ref: "#/$defs/distance_range"
          range_status:
            enum: [BELOW_MINIMUM, WITHIN_RANGE, ABOVE_MAXIMUM]
  topology_effect_evaluation:
    type: object
    additionalProperties: false
    required: [promote_nonstandard_to_linked, application_status]
    properties:
      promote_nonstandard_to_linked: {type: boolean}
      application_status:
        enum: [ELIGIBLE, PENDING_CONFIRMATION, NOT_APPLICABLE]
  pair_result:
    type: object
    additionalProperties: false
    required:
      - metal
      - donor
      - explicit_coordination
      - geometry
      - status
      - detail
      - confirmation_required
      - topology_effect_evaluation
    properties:
      metal:
        $ref: "#/$defs/endpoint"
      donor:
        $ref: "#/$defs/endpoint"
      explicit_coordination:
        $ref: "#/$defs/explicit_coordination"
      geometry:
        $ref: "#/$defs/geometry"
      status:
        enum:
          - CONFIRMED_BY_STRUCTURE
          - GEOMETRY_SUPPORTED_COORDINATION_CANDIDATE
          - NOT_GEOMETRICALLY_SUPPORTED
          - COORDINATION_DEFINITION_CONFLICT
          - ELEMENT_MISMATCH
          - ELEMENT_UNRESOLVED
          - GEOMETRY_NOT_EVALUATED_MULTIPLE_CONFORMATIONS
      detail:
        type: [string, "null"]
      confirmation_required: {type: boolean}
      topology_effect_evaluation:
        $ref: "#/$defs/topology_effect_evaluation"
  omitted_pairs:
    type: object
    additionalProperties: false
    required: [count, minimum_distance_angstrom, maximum_distance_angstrom]
    properties:
      count: {type: integer, minimum: 0}
      minimum_distance_angstrom:
        type: [number, "null"]
        minimum: 0
      maximum_distance_angstrom:
        type: [number, "null"]
        minimum: 0
  definition_result:
    type: object
    additionalProperties: false
    required:
      - definition_index
      - label
      - definition
      - definition_status
      - missing_partner
      - matching_summary
      - issue_instances
      - pair_results
      - omitted_above_maximum_pairs
    properties:
      definition_index: {type: integer, minimum: 1}
      label:
        $ref: "#/$defs/nullable_string"
      definition:
        type: object
        additionalProperties: false
        required: [metal, donor, distance_range_angstrom, topology_effect]
        properties:
          metal:
            $ref: "#/$defs/endpoint_definition"
          donor:
            $ref: "#/$defs/endpoint_definition"
          distance_range_angstrom:
            $ref: "#/$defs/distance_range"
          topology_effect:
            type: object
            additionalProperties: false
            required: [promote_nonstandard_to_linked]
            properties:
              promote_nonstandard_to_linked: {type: boolean}
      definition_status:
        enum: [EVALUATED, PARTNER_NOT_FOUND, ATOM_NOT_FOUND, ELEMENT_ISSUES]
      missing_partner:
        type: [string, "null"]
        enum: [METAL, DONOR, BOTH, null]
      matching_summary:
        $ref: "#/$defs/matching_summary"
      issue_instances:
        type: array
        items:
          $ref: "#/$defs/issue_instance"
      pair_results:
        type: array
        items:
          $ref: "#/$defs/pair_result"
      omitted_above_maximum_pairs:
        $ref: "#/$defs/omitted_pairs"
