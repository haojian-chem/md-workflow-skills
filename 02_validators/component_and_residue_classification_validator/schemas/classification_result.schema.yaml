$schema: https://json-schema.org/draft/2020-12/schema
$id: classification_result.schema.yaml
title: Final component and residue classification result
schema_version: "1.0"
type: object
additionalProperties: false
required:
  - schema_version
  - result_status
  - selected_model_id
  - classification_mode
  - source_hashes
  - chain_groups
  - residue_records
  - confirmed_relations
  - rejected_candidates
  - unresolved_items
  - summary
properties:
  schema_version:
    const: "1.0"
  result_status:
    enum: [COMPLETE, PENDING_USER_CONFIRMATION]
  selected_model_id:
    type: string
    minLength: 1
  classification_mode:
    enum: [REGISTRY, FORCE_FIELD_ANALYSIS]
  source_hashes:
    type: object
    additionalProperties: false
    required:
      - model_scope
      - classification_observations
      - reference_manifest
      - possible_connections_result
      - possible_coordination_result
      - confirmation_requests
    properties:
      model_scope: {$ref: "#/$defs/sha256"}
      classification_observations: {$ref: "#/$defs/sha256"}
      reference_manifest: {$ref: "#/$defs/sha256"}
      possible_connections_result: {$ref: "#/$defs/sha256"}
      possible_coordination_result: {$ref: "#/$defs/sha256"}
      confirmation_requests: {$ref: "#/$defs/sha256"}
  chain_groups:
    type: array
    items:
      $ref: "#/$defs/chain_group"
  residue_records:
    type: array
    items:
      $ref: "#/$defs/residue_record"
  confirmed_relations:
    type: object
    additionalProperties: false
    required: [covalent_connections, metal_coordination]
    properties:
      covalent_connections:
        type: array
        items:
          $ref: "#/$defs/relation"
      metal_coordination:
        type: array
        items:
          $ref: "#/$defs/relation"
  rejected_candidates:
    type: object
    additionalProperties: false
    required: [covalent_connections, metal_coordination]
    properties:
      covalent_connections:
        type: array
        items:
          $ref: "#/$defs/relation"
      metal_coordination:
        type: array
        items:
          $ref: "#/$defs/relation"
  unresolved_items:
    type: array
    items:
      type: object
  summary:
    type: object
    additionalProperties: false
    required:
      - chain_group_count
      - standard_residue_count
      - topology_linked_nonstandard_count
      - independent_nonstandard_count
      - solvent_component_count
      - ion_component_count
      - multiple_conformation_residue_count
      - missing_residue_count
      - heavy_atom_issue_count
      - unresolved_item_count
    properties:
      chain_group_count: {type: integer, minimum: 0}
      standard_residue_count: {type: integer, minimum: 0}
      topology_linked_nonstandard_count: {type: integer, minimum: 0}
      independent_nonstandard_count: {type: integer, minimum: 0}
      solvent_component_count: {type: integer, minimum: 0}
      ion_component_count: {type: integer, minimum: 0}
      multiple_conformation_residue_count: {type: integer, minimum: 0}
      missing_residue_count: {type: integer, minimum: 0}
      heavy_atom_issue_count: {type: integer, minimum: 0}
      unresolved_item_count: {type: integer, minimum: 0}
$defs:
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  nullable_string:
    type: [string, "null"]
  source_resid:
    type: object
    additionalProperties: false
    required: [number, insertion_code]
    properties:
      number: {type: string, minLength: 1}
      insertion_code:
        $ref: "#/$defs/nullable_string"
  source_residue_identity:
    type: object
    additionalProperties: false
    required: [source_model_id, source_chain_id, source_resid, source_residue_name]
    properties:
      source_model_id: {type: string, minLength: 1}
      source_chain_id:
        $ref: "#/$defs/nullable_string"
      source_resid:
        $ref: "#/$defs/source_resid"
      source_residue_name: {type: string, minLength: 1}
  current_residue_identity:
    type: object
    additionalProperties: false
    required: [current_model_id, current_chain_id, current_resid, current_residue_name]
    properties:
      current_model_id: {type: string, minLength: 1}
      current_chain_id:
        $ref: "#/$defs/nullable_string"
      current_resid:
        $ref: "#/$defs/source_resid"
      current_residue_name: {type: string, minLength: 1}
  source_atom_identity:
    type: object
    additionalProperties: false
    required: [source_model_id, source_chain_id, source_resid, source_residue_name, source_atom_name]
    properties:
      source_model_id: {type: string, minLength: 1}
      source_chain_id:
        $ref: "#/$defs/nullable_string"
      source_resid:
        $ref: "#/$defs/source_resid"
      source_residue_name: {type: string, minLength: 1}
      source_atom_name: {type: string, minLength: 1}
  current_atom_identity:
    type: object
    additionalProperties: false
    required: [current_model_id, current_chain_id, current_resid, current_residue_name, current_atom_name]
    properties:
      current_model_id: {type: string, minLength: 1}
      current_chain_id:
        $ref: "#/$defs/nullable_string"
      current_resid:
        $ref: "#/$defs/source_resid"
      current_residue_name: {type: string, minLength: 1}
      current_atom_name: {type: string, minLength: 1}
  source_association:
    type: object
    additionalProperties: false
    required: [polymer_chain_index, instance_count]
    properties:
      polymer_chain_index: {type: integer, minimum: 1}
      instance_count: {type: integer, minimum: 1}
  chain_group:
    type: object
    additionalProperties: false
    required:
      - chain_index
      - grouping_status
      - group_type
      - source_chain_id
      - entity_id
      - instance_count
      - linked_polymer_chain_indices
    properties:
      chain_index: {type: integer, minimum: 1}
      grouping_status: {const: FINAL}
      group_type:
        enum:
          - POLYMER_CHAIN
          - BRANCHED_CHAIN
          - MULTICHAIN_LINKED_COMPONENT
          - LINKED_NONSTANDARD_GROUP
          - INDEPENDENT_COMPONENT
          - REPEATED_SMALL_MOLECULE_GROUP
          - SOLVENT_GROUP
          - ION_GROUP
      source_chain_id:
        $ref: "#/$defs/nullable_string"
      entity_id:
        $ref: "#/$defs/nullable_string"
      residue_name:
        type: string
        minLength: 1
      instance_count: {type: integer, minimum: 1}
      linked_polymer_chain_indices:
        type: array
        items: {type: integer, minimum: 1}
      source_associations:
        type: array
        items:
          $ref: "#/$defs/source_association"
  classification:
    type: object
    additionalProperties: false
    required:
      - polymer_class
      - topology_class
      - resolution_status
      - evidence
    properties:
      polymer_class:
        type: [string, "null"]
        enum: [POLYMER, BRANCHED, NONPOLYMER, WATER, null]
      topology_class:
        type: [string, "null"]
        enum:
          - STANDARD_RESIDUE
          - TOPOLOGY_LINKED_NONSTANDARD
          - INDEPENDENT_NONSTANDARD
          - SOLVENT_COMPONENT
          - ION_COMPONENT
          - null
      resolution_status:
        enum: [RESOLVED, PENDING_CONFIRMATION]
      evidence:
        type: array
        items: {type: string, minLength: 1}
  conformation:
    type: object
    additionalProperties: false
    required: [status, altloc_ids]
    properties:
      status:
        enum: [SINGLE_CONFORMATION, MULTIPLE_CONFORMATIONS, NOT_APPLICABLE]
      altloc_ids:
        type: array
        items: {type: string, minLength: 1}
  heavy_atom_check:
    type: object
    additionalProperties: false
    required: [status, reference_type, reference_name, missing_atoms, unexpected_atoms, reason]
    properties:
      status:
        enum:
          - HEAVY_ATOMS_COMPLETE
          - MISSING_EXPECTED_HEAVY_ATOMS
          - UNEXPECTED_HEAVY_ATOMS
          - MISSING_AND_UNEXPECTED_HEAVY_ATOMS
          - ATOM_NAME_MAPPING_REQUIRED
          - REFERENCE_TEMPLATE_UNAVAILABLE
          - NOT_PERFORMED
          - NOT_APPLICABLE
      reference_type:
        type: [string, "null"]
        enum: [CCD, RTP, null]
      reference_name:
        $ref: "#/$defs/nullable_string"
      missing_atoms:
        type: array
        items: {type: string, minLength: 1}
      unexpected_atoms:
        type: array
        items: {type: string, minLength: 1}
      reason:
        $ref: "#/$defs/nullable_string"
  residue_record:
    type: object
    additionalProperties: false
    required:
      - source_identity
      - current_identity
      - chain_index
      - source_chain_id
      - source_resid
      - residue_name
      - presence_status
      - sequence_position
      - classification
      - conformation
      - heavy_atom_check
    properties:
      source_identity:
        $ref: "#/$defs/source_residue_identity"
      current_identity:
        oneOf:
          - $ref: "#/$defs/current_residue_identity"
          - type: "null"
      chain_index: {type: integer, minimum: 1}
      source_chain_id:
        $ref: "#/$defs/nullable_string"
      source_resid:
        $ref: "#/$defs/source_resid"
      residue_name: {type: string, minLength: 1}
      presence_status: {enum: [OBSERVED, MISSING_EXPECTED]}
      sequence_position:
        type: [integer, "null"]
        minimum: 1
      classification:
        $ref: "#/$defs/classification"
      conformation:
        $ref: "#/$defs/conformation"
      heavy_atom_check:
        $ref: "#/$defs/heavy_atom_check"
    allOf:
      - if:
          properties:
            presence_status: {const: OBSERVED}
          required: [presence_status]
        then:
          properties:
            current_identity:
              $ref: "#/$defs/current_residue_identity"
      - if:
          properties:
            presence_status: {const: MISSING_EXPECTED}
          required: [presence_status]
        then:
          properties:
            current_identity:
              type: "null"
  endpoint:
    type: object
    additionalProperties: false
    required: [source_identity, current_identity, chain_index, source_chain_id, source_resid, residue_name, atom_name]
    properties:
      source_identity:
        $ref: "#/$defs/source_atom_identity"
      current_identity:
        $ref: "#/$defs/current_atom_identity"
      chain_index: {type: integer, minimum: 1}
      source_chain_id:
        $ref: "#/$defs/nullable_string"
      source_resid:
        $ref: "#/$defs/source_resid"
      residue_name: {type: string, minLength: 1}
      atom_name: {type: string, minLength: 1}
  relation:
    type: object
    additionalProperties: false
    required:
      - relation_type
      - endpoint_1
      - endpoint_2
      - evidence_status
      - topology_effect_applied
    properties:
      relation_type:
        enum: [COVALENT_CONNECTION, METAL_COORDINATION]
      endpoint_1:
        $ref: "#/$defs/endpoint"
      endpoint_2:
        $ref: "#/$defs/endpoint"
      evidence_status:
        enum: [CONFIRMED_BY_STRUCTURE, CONFIRMED_BY_USER, REJECTED_BY_USER]
      topology_effect_applied: {type: boolean}
