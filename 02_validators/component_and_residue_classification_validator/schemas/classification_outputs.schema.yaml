$schema: https://json-schema.org/draft/2020-12/schema
$id: classification_outputs.schema.yaml
title: Component and Residue Classification Result Data
type: object
required:
  - schema_version
  - task_id
  - workstream_id
  - input_structure
  - outcome_code
  - summary
  - models
  - chains
  - components
  - residues
  - explicit_connections
  - covalent_candidates
  - coordination_candidates
  - ambiguities
  - warnings
properties:
  schema_version:
    type: integer
    const: 1
  task_id:
    type: string
    minLength: 1
  workstream_id:
    type: string
    minLength: 1
  input_structure:
    $ref: '#/$defs/file_identity'
  outcome_code:
    enum:
      - CLASSIFIED_CLEAR
      - CLASSIFIED_WITH_WARNINGS
      - CLASSIFICATION_DECISION_REQUIRED
      - INPUT_SCOPE_INVALID
      - UNSUPPORTED_OR_UNPARSEABLE_STRUCTURE
      - VALIDATOR_INTERNAL_FAILURE
  summary:
    type: object
    required:
      - model_count
      - chain_count
      - component_count
      - residue_count
      - standard_residue_count
      - covalently_linked_nonstandard_count
      - independent_nonstandard_count
      - solvent_count
      - ion_count
      - unknown_count
      - blocking_ambiguity_count
    properties:
      model_count: {type: integer, minimum: 0}
      chain_count: {type: integer, minimum: 0}
      component_count: {type: integer, minimum: 0}
      residue_count: {type: integer, minimum: 0}
      standard_residue_count: {type: integer, minimum: 0}
      covalently_linked_nonstandard_count: {type: integer, minimum: 0}
      independent_nonstandard_count: {type: integer, minimum: 0}
      solvent_count: {type: integer, minimum: 0}
      ion_count: {type: integer, minimum: 0}
      unknown_count: {type: integer, minimum: 0}
      blocking_ambiguity_count: {type: integer, minimum: 0}
    additionalProperties: false
  models:
    type: array
    items:
      type: object
      required: [model_id, chain_count, residue_count, atom_count, classification_signature]
      properties:
        model_id: {type: string, minLength: 1}
        chain_count: {type: integer, minimum: 0}
        residue_count: {type: integer, minimum: 0}
        atom_count: {type: integer, minimum: 0}
        classification_signature: {type: string, minLength: 1}
      additionalProperties: false
  chains:
    type: array
    items: {$ref: '#/$defs/chain'}
  components:
    type: array
    items: {$ref: '#/$defs/component'}
  residues:
    type: array
    items: {$ref: '#/$defs/residue'}
  explicit_connections:
    type: array
    items: {$ref: '#/$defs/connection'}
  covalent_candidates:
    type: array
    items: {$ref: '#/$defs/connection_candidate'}
  coordination_candidates:
    type: array
    items: {$ref: '#/$defs/coordination_candidate'}
  ambiguities:
    type: array
    items: {$ref: '#/$defs/ambiguity'}
  warnings:
    type: array
    items: {type: string}
additionalProperties: false
$defs:
  file_identity:
    type: object
    required: [path, sha256, format]
    properties:
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[a-fA-F0-9]{64}$'
      format:
        enum: [PDB, MMCIF, AF3_CIF]
    additionalProperties: false
  confidence:
    enum: [HIGH, MEDIUM, LOW]
  polymer_class:
    enum: [PROTEIN, DNA, RNA, CARBOHYDRATE, OTHER_POLYMER, NONPOLYMER, WATER, ION, UNKNOWN]
  topology_class:
    enum: [STANDARD_RESIDUE, COVALENTLY_LINKED_NONSTANDARD, INDEPENDENT_NONSTANDARD, SOLVENT, ION, UNKNOWN]
  component_role:
    enum: [POLYMER, MODIFIED_POLYMER_RESIDUE, LIGAND, COFACTOR, GLYCAN, SOLVENT, ION, BUFFER_OR_ADDITIVE, UNKNOWN]
  atom_ref:
    type: object
    required: [model_id, chain_id, residue_name, residue_number, atom_name, element]
    properties:
      model_id: {type: string, minLength: 1}
      chain_id: {type: string}
      residue_name: {type: string, minLength: 1}
      residue_number: {type: string, minLength: 1}
      insertion_code: {type: [string, 'null']}
      atom_name: {type: string, minLength: 1}
      altloc: {type: [string, 'null']}
      element: {type: string, minLength: 1}
    additionalProperties: false
  chain:
    type: object
    required:
      - model_id
      - chain_id
      - entity_id
      - polymer_class
      - residue_count
      - standard_residue_count
      - nonstandard_residue_count
      - confidence
      - evidence
    properties:
      model_id: {type: string, minLength: 1}
      chain_id: {type: string}
      entity_id: {type: [string, 'null']}
      polymer_class: {$ref: '#/$defs/polymer_class'}
      residue_count: {type: integer, minimum: 0}
      standard_residue_count: {type: integer, minimum: 0}
      nonstandard_residue_count: {type: integer, minimum: 0}
      confidence: {$ref: '#/$defs/confidence'}
      evidence:
        type: array
        minItems: 1
        items: {type: string}
    additionalProperties: false
  component:
    type: object
    required:
      - component_id
      - model_id
      - chain_ids
      - residue_ids
      - polymer_class
      - topology_class
      - component_role
      - confidence
      - evidence
      - decision_required
    properties:
      component_id: {type: string, minLength: 1}
      model_id: {type: string, minLength: 1}
      chain_ids:
        type: array
        items: {type: string}
      residue_ids:
        type: array
        minItems: 1
        items: {type: string}
      polymer_class: {$ref: '#/$defs/polymer_class'}
      topology_class: {$ref: '#/$defs/topology_class'}
      component_role: {$ref: '#/$defs/component_role'}
      confidence: {$ref: '#/$defs/confidence'}
      evidence:
        type: array
        minItems: 1
        items: {type: string}
      decision_required: {type: boolean}
    additionalProperties: false
  residue:
    type: object
    required:
      - residue_id
      - model_id
      - chain_id
      - residue_name
      - residue_number
      - atom_count
      - polymer_class
      - topology_class
      - component_role
      - confidence
      - evidence
      - decision_required
    properties:
      residue_id: {type: string, minLength: 1}
      model_id: {type: string, minLength: 1}
      chain_id: {type: string}
      entity_id: {type: [string, 'null']}
      residue_name: {type: string, minLength: 1}
      residue_number: {type: string, minLength: 1}
      insertion_code: {type: [string, 'null']}
      atom_count: {type: integer, minimum: 0}
      polymer_class: {$ref: '#/$defs/polymer_class'}
      topology_class: {$ref: '#/$defs/topology_class'}
      component_role: {$ref: '#/$defs/component_role'}
      canonical_parent: {type: [string, 'null']}
      confidence: {$ref: '#/$defs/confidence'}
      evidence:
        type: array
        minItems: 1
        items: {type: string}
      decision_required: {type: boolean}
    additionalProperties: false
  connection:
    type: object
    required: [connection_id, atom_1, atom_2, relation_type, source_record, confidence]
    properties:
      connection_id: {type: string, minLength: 1}
      atom_1: {$ref: '#/$defs/atom_ref'}
      atom_2: {$ref: '#/$defs/atom_ref'}
      relation_type:
        enum: [COVALENT, DISULFIDE, GLYCOSIDIC, EXPLICIT_COORDINATION, OTHER_EXPLICIT]
      source_record: {type: string, minLength: 1}
      confidence: {$ref: '#/$defs/confidence'}
    additionalProperties: false
  connection_candidate:
    type: object
    required: [candidate_id, atom_1, atom_2, distance_angstrom, threshold_angstrom, confidence, changes_topology_route]
    properties:
      candidate_id: {type: string, minLength: 1}
      atom_1: {$ref: '#/$defs/atom_ref'}
      atom_2: {$ref: '#/$defs/atom_ref'}
      distance_angstrom: {type: number, exclusiveMinimum: 0}
      threshold_angstrom: {type: number, exclusiveMinimum: 0}
      confidence: {$ref: '#/$defs/confidence'}
      changes_topology_route: {type: boolean}
      notes: {type: string}
    additionalProperties: false
  coordination_candidate:
    type: object
    required:
      - candidate_id
      - metal_atom
      - donor_atom
      - distance_angstrom
      - threshold_angstrom
      - status
      - evidence_source
      - confidence
    properties:
      candidate_id: {type: string, minLength: 1}
      metal_atom: {$ref: '#/$defs/atom_ref'}
      donor_atom: {$ref: '#/$defs/atom_ref'}
      distance_angstrom: {type: number, exclusiveMinimum: 0}
      threshold_angstrom: {type: number, exclusiveMinimum: 0}
      status:
        enum: [EXPLICIT_COORDINATION, GEOMETRIC_COORDINATION_CANDIDATE, AMBIGUOUS_CLOSE_CONTACT]
      evidence_source: {type: string, minLength: 1}
      confidence: {$ref: '#/$defs/confidence'}
      notes: {type: string}
    additionalProperties: false
  ambiguity:
    type: object
    required: [ambiguity_id, blocking, category, question, reason, affected_object_ids, options]
    properties:
      ambiguity_id: {type: string, minLength: 1}
      blocking: {type: boolean}
      category:
        enum: [MODEL_SELECTION, POLYMER_MEMBERSHIP, COVALENT_LINKAGE, RESIDUE_ALIAS, METADATA_CONFLICT, OBJECT_IDENTITY, OTHER]
      question: {type: string, minLength: 1}
      reason: {type: string, minLength: 1}
      affected_object_ids:
        type: array
        minItems: 1
        items: {type: string}
      options:
        type: array
        minItems: 1
        items: {type: string}
      recommended_option: {type: [string, 'null']}
    additionalProperties: false
