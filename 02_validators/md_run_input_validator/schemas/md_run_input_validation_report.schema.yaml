$schema: https://json-schema.org/draft/2020-12/schema
$id: md_run_input_validation_report.schema.yaml
title: MD Run Input Validation Report
type: object
required:
  - schema_version
  - task_id
  - workstream_id
  - protocol_identity
  - plan_identity
  - run_unit_id
  - source_artifact_set_ids
  - input_manifest
  - mdp_findings
  - source_file_findings
  - topology_findings
  - tpr_findings
  - grompp_findings
  - warnings
  - outcome_code
  - gate_recommendation
properties:
  schema_version: {type: integer, const: 2}
  task_id: {type: string, minLength: 1}
  workstream_id: {type: string, minLength: 1}
  protocol_identity: {$ref: '#/$defs/versioned_identity'}
  plan_identity: {$ref: '#/$defs/versioned_identity'}
  run_unit_id: {type: string, minLength: 1}
  source_artifact_set_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  input_manifest: {$ref: '#/$defs/file_identity'}
  mdp_findings:
    type: object
    required:
      - source_kind
      - source_hash_matches
      - rendering_policy_matches
      - override_set_matches
      - rendered_parameters_match
      - undeclared_changes
    properties:
      source_kind: {enum: [FINAL_FILE, TEMPLATE_WITH_TYPED_OVERRIDES]}
      source_hash_matches: {type: boolean}
      rendering_policy_matches: {type: boolean}
      override_set_matches: {type: boolean}
      rendered_parameters_match: {type: boolean}
      undeclared_changes:
        type: array
        items: {type: string, minLength: 1}
    additionalProperties: false
  source_file_findings:
    type: array
    items:
      type: object
      required: [role, path, hash_matches, source_unchanged]
      properties:
        role: {type: string, minLength: 1}
        path: {type: string, minLength: 1}
        hash_matches: {type: boolean}
        source_unchanged: {type: boolean}
      additionalProperties: false
  topology_findings:
    type: object
    required: [root_readable, include_closure_complete, coordinate_compatible, optional_inputs_satisfied]
    properties:
      root_readable: {type: boolean}
      include_closure_complete: {type: boolean}
      coordinate_compatible: {type: boolean}
      optional_inputs_satisfied: {type: boolean}
    additionalProperties: false
  tpr_findings:
    type: object
    required: [readable, atom_count, rendered_mdp_parameters_match, start_state_matches_protocol, source_identity_matches]
    properties:
      readable: {type: boolean}
      atom_count: {type: [integer, 'null'], minimum: 0}
      rendered_mdp_parameters_match: {type: boolean}
      start_state_matches_protocol: {type: boolean}
      source_identity_matches: {type: boolean}
      inspected_fields:
        type: object
        additionalProperties: true
    additionalProperties: false
  grompp_findings:
    type: object
    required: [argv_matches, actual_version_recorded, version_constraint_satisfied, maxwarn_matches, warnings_complete, warning_policy_passed]
    properties:
      argv_matches: {type: boolean}
      actual_version_recorded: {type: boolean}
      version_constraint_satisfied: {type: boolean}
      maxwarn_matches: {type: boolean}
      warnings_complete: {type: boolean}
      warning_policy_passed: {type: boolean}
    additionalProperties: false
  warnings:
    type: array
    items: {type: string}
  outcome_code:
    enum:
      - MD_RUN_INPUT_VALIDATED
      - MD_RUN_INPUT_VALIDATED_WITH_WARNINGS
      - RUN_INPUT_VALIDATOR_INPUT_INCOMPLETE
      - RUN_INPUT_PROTOCOL_OR_PLAN_MISMATCH
      - RUN_INPUT_MANIFEST_OR_SOURCE_MISMATCH
      - RUN_INPUT_MDP_RENDERING_MISMATCH
      - RUN_INPUT_UNDECLARED_MDP_CHANGE
      - RUN_INPUT_TOPOLOGY_OR_SOURCE_INVALID
      - RUN_INPUT_GROMPP_COMMAND_OR_WARNING_INVALID
      - RUN_INPUT_TPR_UNREADABLE_OR_INCONSISTENT
      - RUN_INPUT_SOURCE_FILE_MUTATION_DETECTED
      - RUN_INPUT_VALIDATOR_INTERNAL_FAILURE
  gate_recommendation:
    enum: [ACCEPT_MD_INPUT, REJECT_MD_INPUT, PAUSE_FOR_DECISION, BLOCK_FOR_RECOVERY]
additionalProperties: false
$defs:
  file_identity:
    type: object
    required: [path, sha256]
    properties:
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
      artifact_set_id: {type: [string, 'null']}
    additionalProperties: false
  versioned_identity:
    type: object
    required: [id, path, sha256]
    properties:
      id: {type: string, minLength: 1}
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
    additionalProperties: false