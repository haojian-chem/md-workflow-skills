$schema: https://json-schema.org/draft/2020-12/schema
$id: md_simulation_plan_validation_report.schema.yaml
title: MD Simulation Plan Projection Validation Report
type: object
required:
  - schema_version
  - task_id
  - workstream_id
  - protocol_spec
  - plan
  - system_artifact_set_ids
  - projection_findings
  - dependency_findings
  - path_findings
  - gate_findings
  - owner_separation_findings
  - revision_findings
  - warnings
  - outcome_code
  - gate_recommendation
properties:
  schema_version: {type: integer, const: 2}
  task_id: {type: string, minLength: 1}
  workstream_id: {type: string, minLength: 1}
  protocol_spec:
    type: object
    required: [spec_id, path, sha256, validator_task_id, validation_outcome]
    properties:
      spec_id: {type: string, minLength: 1}
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
      validator_task_id: {type: string, minLength: 1}
      validation_outcome:
        enum:
          - SIMULATION_PROTOCOL_VALIDATED
          - SIMULATION_PROTOCOL_VALIDATED_WITH_DEFERRED_GATES
    additionalProperties: false
  plan:
    type: object
    required: [plan_id, path, sha256]
    properties:
      plan_id: {type: string, minLength: 1}
      path: {type: string, minLength: 1}
      sha256:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
    additionalProperties: false
  system_artifact_set_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  projection_findings:
    type: array
    items:
      type: object
      required:
        - run_unit_id
        - protocol_field_path_valid
        - role_matches
        - dependency_set_matches
        - start_state_matches
        - projection_complete
      properties:
        run_unit_id: {type: string, minLength: 1}
        protocol_field_path_valid: {type: boolean}
        role_matches: {type: boolean}
        dependency_set_matches: {type: boolean}
        start_state_matches: {type: boolean}
        projection_complete: {type: boolean}
      additionalProperties: false
  dependency_findings:
    type: object
    required: [ids_unique, references_valid, acyclic, start_state_references_valid]
    properties:
      ids_unique: {type: boolean}
      references_valid: {type: boolean}
      acyclic: {type: boolean}
      start_state_references_valid: {type: boolean}
    additionalProperties: false
  path_findings:
    type: array
    items:
      type: object
      required: [run_unit_id, run_path_valid, input_path_valid, attempts_path_valid, collision_free]
      properties:
        run_unit_id: {type: string, minLength: 1}
        run_path_valid: {type: boolean}
        input_path_valid: {type: boolean}
        attempts_path_valid: {type: boolean}
        collision_free: {type: boolean}
      additionalProperties: false
  gate_findings:
    type: array
    items:
      type: object
      required: [item_id, blocking_stage, affected_run_unit_ids, projection_valid]
      properties:
        item_id: {type: string, minLength: 1}
        blocking_stage: {enum: [INPUT_PREPARATION, ATTEMPT_SPECIFICATION]}
        affected_run_unit_ids:
          type: array
          items: {type: string, minLength: 1}
        projection_valid: {type: boolean}
      additionalProperties: false
  owner_separation_findings:
    type: object
    required: [scientific_fields_copied, runtime_fields_embedded, runtime_status_embedded, violating_paths]
    properties:
      scientific_fields_copied: {type: boolean}
      runtime_fields_embedded: {type: boolean}
      runtime_status_embedded: {type: boolean}
      violating_paths:
        type: array
        items: {type: string, minLength: 1}
    additionalProperties: false
  revision_findings:
    type: object
    required: [is_revision, supersedes_valid, revision_reason_present, old_plan_unchanged]
    properties:
      is_revision: {type: boolean}
      supersedes_valid: {type: boolean}
      revision_reason_present: {type: boolean}
      old_plan_unchanged: {type: boolean}
    additionalProperties: false
  warnings:
    type: array
    items: {type: string}
  outcome_code:
    enum:
      - SIMULATION_PLAN_VALIDATED
      - SIMULATION_PLAN_VALIDATED_WITH_DEFERRED_GATES
      - PLAN_VALIDATOR_INPUT_INCOMPLETE
      - PLAN_PROTOCOL_OR_SYSTEM_MISMATCH
      - PLAN_PROJECTION_SET_MISMATCH
      - PLAN_DAG_OR_START_STATE_INVALID
      - PLAN_GATE_PROJECTION_INVALID
      - PLAN_PATH_CONFLICT
      - PLAN_OWNER_SEPARATION_VIOLATION
      - PLAN_RUNTIME_STATUS_EMBEDDED
      - PLAN_REVISION_CHAIN_INVALID
      - PLAN_VALIDATOR_INTERNAL_FAILURE
  gate_recommendation:
    enum: [ACCEPT_PLAN, REJECT_PLAN, PAUSE_FOR_DECISION, BLOCK_FOR_RECOVERY]
additionalProperties: false