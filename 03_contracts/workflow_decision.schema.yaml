$schema: https://json-schema.org/draft/2020-12/schema
$id: workflow_decision.schema.yaml
title: MD Workflow Decision
type: object
required:
  - schema_version
  - workstream_id
  - workflow_name
  - current_substep
  - workflow_status
  - decision
  - reason
  - next_task_unit
  - confirmation_items
properties:
  schema_version: {type: integer, const: 2}
  workstream_id: {type: string, minLength: 1}
  workflow_name: {type: string, minLength: 1}
  current_substep: {type: [string, 'null']}
  workflow_status:
    type: string
    enum: [NOT_STARTED, ACTIVE, WAITING, DONE, FAILED]
  decision:
    type: string
    enum: [EXECUTE, SKIP, PAUSE, COMPLETE, BLOCKED]
  reason: {type: string, minLength: 1}
  next_task_unit:
    oneOf:
      - type: 'null'
      - $ref: '#/$defs/task_unit_spec'
  skipped_substep: {type: [string, 'null']}
  confirmation_items:
    type: array
    items: {$ref: confirmation_item.schema.yaml}
allOf:
  - if:
      properties: {decision: {const: EXECUTE}}
    then:
      properties: {next_task_unit: {$ref: '#/$defs/task_unit_spec'}}
    else:
      properties: {next_task_unit: {type: 'null'}}
additionalProperties: false
$defs:
  task_unit_spec:
    type: object
    required:
      - task_id
      - mode
      - operation
      - validator
      - work_directory
      - required_inputs
      - expected_outputs
      - gate_requirements
    properties:
      task_id: {type: string, minLength: 1}
      mode: {$ref: common_types.schema.yaml#/$defs/task_unit_mode}
      operation:
        oneOf:
          - type: 'null'
          - $ref: common_types.schema.yaml#/$defs/skill_ref
      validator:
        oneOf:
          - type: 'null'
          - $ref: common_types.schema.yaml#/$defs/skill_ref
      work_directory: {type: string, minLength: 1}
      required_inputs:
        type: array
        items: {type: string}
      expected_outputs:
        type: array
        items: {type: string}
      gate_requirements:
        type: array
        items: {type: string}
    allOf:
      - if:
          properties: {mode: {const: OPERATION}}
        then:
          properties:
            operation: {$ref: common_types.schema.yaml#/$defs/skill_ref}
            validator: {type: 'null'}
      - if:
          properties: {mode: {const: VALIDATOR}}
        then:
          properties:
            operation: {type: 'null'}
            validator: {$ref: common_types.schema.yaml#/$defs/skill_ref}
      - if:
          properties: {mode: {const: OPERATION_WITH_VALIDATOR}}
        then:
          properties:
            operation: {$ref: common_types.schema.yaml#/$defs/skill_ref}
            validator: {$ref: common_types.schema.yaml#/$defs/skill_ref}
    additionalProperties: false
