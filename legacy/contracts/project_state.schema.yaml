$schema: https://json-schema.org/draft/2020-12/schema
$id: project_state.schema.yaml
title: MD Project State Index
type: object
required:
  - schema_version
  - project
  - entry_state
  - focus
  - related_workstreams
  - workstreams
  - pending_project_decision_ids
  - last_project_event_id
  - last_updated_by
  - last_updated_at
properties:
  schema_version: {type: integer, const: 2}
  project:
    type: object
    required: [project_id, skill_architecture_root, md_project_root]
    properties:
      project_id: {type: string, minLength: 1}
      skill_architecture_root: {type: string, minLength: 1}
      md_project_root: {type: string, minLength: 1}
    additionalProperties: false
  entry_state: {$ref: common_types.schema.yaml#/$defs/entry_state}
  focus: {$ref: common_types.schema.yaml#/$defs/focus}
  related_workstreams:
    type: array
    uniqueItems: true
    items: {$ref: common_types.schema.yaml#/$defs/related_workstream}
  workstreams:
    type: array
    items:
      type: object
      required: [workstream_id, state_path]
      properties:
        workstream_id: {type: string, minLength: 1}
        state_path: {type: string, minLength: 1}
      additionalProperties: false
  pending_project_decision_ids:
    type: array
    items: {type: string}
  last_project_event_id: {type: [string, 'null']}
  last_updated_by: {type: string, minLength: 1}
  last_updated_at: {type: string, format: date-time}
additionalProperties: false
