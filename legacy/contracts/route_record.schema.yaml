$schema: https://json-schema.org/draft/2020-12/schema
$id: route_record.schema.yaml
title: MD Workstream Route Record
type: object
required:
  - schema_version
  - route_id
  - workstream_id
  - created_at
  - created_by
  - supersedes
  - planning_status
  - scope_resolution
  - scope
  - source_fragments
  - steps
  - change_reason
  - assumptions
  - conditional_steps
  - known_blockers
  - stop_conditions
properties:
  schema_version: {type: integer, const: 3}
  route_id: {type: string, minLength: 1}
  workstream_id: {type: string, minLength: 1}
  created_at: {type: string, format: date-time}
  created_by: {$ref: common_types.schema.yaml#/$defs/event_actor}
  supersedes: {type: [string, 'null']}
  planning_status:
    type: string
    enum: [COMPLETE, PARTIAL, BLOCKED]
  scope_resolution:
    type: object
    required: [source, resolved_event_id, decision_id]
    properties:
      source:
        type: string
        enum: [USER_REQUEST, RESOLVED_DECISION, ACTIVE_ROUTE, RECORDED_WORKSTREAM_GOAL]
      resolved_event_id: {type: string, minLength: 1}
      decision_id: {type: [string, 'null']}
    allOf:
      - if:
          properties: {source: {const: RESOLVED_DECISION}}
        then:
          properties: {decision_id: {type: string, minLength: 1}}
    additionalProperties: false
  scope:
    type: object
    required: [start, end]
    properties:
      start: {$ref: '#/$defs/route_point'}
      end: {$ref: '#/$defs/route_point'}
    additionalProperties: false
  source_fragments:
    type: array
    minItems: 1
    items:
      type: object
      required: [fragment_id, workflow_name, fragment_status]
      properties:
        fragment_id: {type: string, minLength: 1}
        workflow_name: {type: string, minLength: 1}
        workflow_path: {type: [string, 'null']}
        workflow_revision: {type: [string, 'null']}
        fragment_status:
          type: string
          enum: [COMPLETE, PARTIAL, BLOCKED]
      additionalProperties: false
  steps:
    type: array
    items: {$ref: '#/$defs/route_step'}
  change_reason:
    type: array
    minItems: 1
    items: {type: string}
  assumptions:
    type: array
    items: {type: string}
  conditional_steps:
    type: array
    items: {type: string}
  known_blockers:
    type: array
    items:
      type: object
      required: [code, reason, blocking_scope]
      properties:
        code: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
        blocking_scope:
          type: string
          enum: [ROUTE, WORKFLOW_BOUNDARY, WORKSTREAM]
        workflow_name: {type: [string, 'null']}
      additionalProperties: false
  stop_conditions:
    type: array
    minItems: 1
    items: {type: string}
allOf:
  - if:
      properties: {planning_status: {const: COMPLETE}}
    then:
      properties:
        steps: {minItems: 1}
        known_blockers: {maxItems: 0}
  - if:
      properties: {planning_status: {const: PARTIAL}}
    then:
      properties:
        steps: {minItems: 1}
  - if:
      properties: {planning_status: {const: BLOCKED}}
    then:
      properties:
        known_blockers: {minItems: 1}
additionalProperties: false
$defs:
  route_point:
    type: object
    required: [workflow_name, substep, point_kind]
    properties:
      workflow_name: {type: [string, 'null']}
      substep: {type: [string, 'null']}
      artifact_set_id: {type: [string, 'null']}
      point_kind:
        type: string
        enum:
          - CURRENT
          - WORKFLOW_ENTRY
          - WORKFLOW_EXIT
          - SPECIFIC_SUBSTEP
          - ARTIFACT
          - WORKSTREAM_GOAL
          - PROJECT_END
    additionalProperties: false
  skill_ref:
    oneOf:
      - type: 'null'
      - type: object
        required: [skill_name, skill_path]
        properties:
          skill_name: {type: string, minLength: 1}
          skill_path: {type: string, minLength: 1}
        additionalProperties: false
  route_step:
    type: object
    required:
      - sequence
      - workflow_name
      - step_id
      - task_name
      - task_unit_mode
      - operation
      - validator
      - necessity
      - condition
      - work_directory
      - prerequisites
      - expected_outputs
      - gate_requirements
    properties:
      sequence: {type: integer, minimum: 1}
      workflow_name: {type: string, minLength: 1}
      step_id: {type: string, minLength: 1}
      task_name: {type: string, minLength: 1}
      task_unit_mode: {$ref: common_types.schema.yaml#/$defs/task_unit_mode}
      operation: {$ref: '#/$defs/skill_ref'}
      validator: {$ref: '#/$defs/skill_ref'}
      necessity:
        type: string
        enum: [REQUIRED, CONDITIONAL]
      condition: {type: [string, 'null']}
      work_directory: {type: string, minLength: 1}
      prerequisites:
        type: array
        items: {type: string}
      expected_outputs:
        type: array
        items: {type: string}
      gate_requirements:
        type: array
        items: {type: string}
    allOf:
      - if:
          properties: {task_unit_mode: {const: OPERATION}}
        then:
          properties:
            operation: {type: object}
            validator: {type: 'null'}
      - if:
          properties: {task_unit_mode: {const: VALIDATOR}}
        then:
          properties:
            operation: {type: 'null'}
            validator: {type: object}
      - if:
          properties: {task_unit_mode: {const: OPERATION_WITH_VALIDATOR}}
        then:
          properties:
            operation: {type: object}
            validator: {type: object}
      - if:
          properties: {necessity: {const: REQUIRED}}
        then:
          properties: {condition: {type: 'null'}}
    additionalProperties: false
