$schema: https://json-schema.org/draft/2020-12/schema
$id: artifact_set.schema.yaml
title: MD Artifact Set Record
type: object
required:
  - schema_version
  - artifact_set_id
  - artifact_type
  - workstream_id
  - created_at
  - created_by_task_id
  - derived_from_artifact_set_ids
  - files
  - validation_status
  - validator_task_id
  - supersedes
  - notes
properties:
  schema_version: {type: integer, const: 1}
  artifact_set_id: {type: string, minLength: 1}
  artifact_type: {$ref: common_types.schema.yaml#/$defs/artifact_type}
  workstream_id: {type: string, minLength: 1}
  created_at: {type: string, format: date-time}
  created_by_task_id: {type: [string, 'null']}
  derived_from_artifact_set_ids:
    type: array
    items: {type: string}
  files:
    type: array
    minItems: 1
    items: {$ref: common_types.schema.yaml#/$defs/file_identity}
  validation_status: {$ref: common_types.schema.yaml#/$defs/validation_status}
  validator_task_id: {type: [string, 'null']}
  supersedes:
    type: array
    items: {type: string}
  notes: {type: string}
allOf:
  - if:
      properties: {validation_status: {const: VALIDATED}}
    then:
      properties:
        validator_task_id: {type: string, minLength: 1}
additionalProperties: false
