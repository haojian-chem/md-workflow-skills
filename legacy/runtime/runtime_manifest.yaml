  - path: 00_manager/md_workflow_manager/references/manager_runtime_source.yaml
    git_blob_sha: c3c1897743ea49581b9f38acfc8f6872108fee3e
  - path: 01_workflows/structure_preparation_workflow/references/runtime_source.yaml
    git_blob_sha: d216422e6751209381aa7af86c4f4d8a48bda070
  - path: 00_manager/md_workflow_manager/references/stage_registry.yaml
    git_blob_sha: 8dfd745d7ed6c6322694e5752f40d821bea20cf7
  - path: 05_tools/tool_registry.yaml
    git_blob_sha: fd96a873733ac56062fa548a1717542e20a54e2a
