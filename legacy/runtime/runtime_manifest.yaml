    git_blob_sha: e561779db0bc62f1c2b3c241a8a611852a40e2c8
  - path: 00_authoring/md-workflow-skill-authoring/references/runtime_record_commit_protocol.md
    git_blob_sha: d0a86a3564da1c86fd71d5f30ed819acac0be91c
  - path: 00_manager/md_workflow_manager/references/route_fast_path_protocol.md
