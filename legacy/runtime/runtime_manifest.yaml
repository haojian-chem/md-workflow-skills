  - path: 03_contracts/workflow_decision.schema.yaml
    git_blob_sha: 21a51f986f2076986fcf863be7a82a3d8f619a04
  - path: 03_contracts/subagent_task.schema.yaml
    git_blob_sha: 0a8b1f4ad897d61c9efe5d444e94a9deac0d0db7
  - path: 03_contracts/subagent_result.schema.yaml
    git_blob_sha: 6f943dd0e570922594f42b64803def6f01ccaf9a
  - path: 03_contracts/confirmation_item.schema.yaml
    git_blob_sha: a81a7e9bdfeca5c8f5b2342ea094453686e30213
runtime_entry:
  manager_spec: runtime/manager_runtime_spec.yaml
  contract_index: runtime/task_contracts/index.yaml
  tool_registry: 05_tools/tool_registry.yaml
  workflow_specs:
    structure_preparation_workflow: runtime/workflows/structure_preparation.runtime.yaml
loading_policy:
  real_md_runtime_default:
    load:
    - AGENTS.md
    - runtime/runtime_manifest.yaml
    - runtime/manager_runtime_spec.yaml
    - project current state needed for the request
    do_not_load_by_default:
    - 00_authoring/**
    - design_records/**
    - 03_contracts/*.schema.yaml bodies
    - full Manager references
    - manager_display_rules.md
    - project_events.jsonl full history when direct record IDs are available
    - backup scope/route/state files outside recovery
    - unrelated Workflow SKILL.md files
    - unrelated Operation/Validator Skills
    - full project history
  fallback_authoring_read_allowed_when:
  - runtime_projection_missing
  - runtime_projection_provenance_invalid
  - runtime_contract_conflict
  - project_needs_recovery
  - semantic_route_replanning_not_expressible_by_compact_spec
  - explicit_architecture_audit_or_debug
execution_backends:
  DETERMINISTIC:
    status: enabled_when_required_capability_is_ACTIVE
    creates_foreground_agent: false
  AGENT_TASK:
    status: enabled
    creates_foreground_agent: true
  AGENT_SEQUENCE:
    status: disabled_by_default
    creates_foreground_agent: true
    activation_requires:
    - sequence_contract
    - eligibility_validator
    - multi_result_commit_support
    - recovery_fixtures
foreground_agent_limit: 1
stage_registry_projection:
- stage_id: structure_preparation
  workflow_name: structure_preparation_workflow
  project_directory: 01_structure_preparation
  connection_status: connected
  runtime_spec: runtime/workflows/structure_preparation.runtime.yaml
- stage_id: topology_preparation
  workflow_name: topology_preparation_workflow
  project_directory: 02_topology_preparation
  connection_status: planned
  runtime_spec: null
- stage_id: md_preparation
  workflow_name: md_preparation_workflow
  project_directory: 03_md_preparation
  connection_status: planned
  runtime_spec: null
- stage_id: md_simulation
  workflow_name: md_simulation_workflow
  project_directory: 04_md_simulation
  connection_status: planned
  runtime_spec: null
- stage_id: analysis
  workflow_name: analysis_workflow
  project_directory: 05_analysis
  connection_status: planned
  runtime_spec: null
runtime_guards:
- normal_NEW_initialization_uses_ACTIVE_runtime_project_initializer
- do_not_manually_construct_initialization_state_when_initializer_is_ACTIVE
- do_not_parse_business_structure_content_during_manager_entry_or_initialization
- do_not_read_full_initialization_or_route_protocol_on_normal_compact_runtime_path
- do_not_read_backup_records_outside_recovery
- do_not_scan_project_event_history_when_direct_state_or_record_ids_are_available
- do_not_read_schema_bodies_when_a_registered_validator_can_consume_them
- do_not_repeat_authoring_reads_for_rules_already_projected_here
- do_not_enable_AGENT_SEQUENCE_until_activation_requirements_pass
- do_not_treat_runtime_projection_as_independent_authority
