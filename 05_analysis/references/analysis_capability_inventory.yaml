# Stage 5 analysis capability inventory.
#
# Discovery aid for 05_analysis/SKILL.md. This is not a parser or mandatory
# dispatcher schema.
#
# Add an entry only when the referenced capability entry actually exists and is
# intended to be discoverable by Stage 5.
#
# Minimum fields for each entry:
# - name
# - purpose
# - required_files
# - entry
#
# required_files records input roles and acceptable file types. It must not
# duplicate capability-specific execution, selection, preprocessing, validation,
# result-lifecycle, or project_result_index.md whitelist rules owned by the
# referenced capability Skill / README.
#
# Initial planned capability cohort is documented in the Stage 5 architecture
# freeze. No placeholder rows are created here before the corresponding entries
# exist.

- name: trjconv
  purpose: Process an existing trajectory according to a Stage 5 plan item and produce a traceable processed trajectory when needed.
  required_files:
    - role: trajectory
      types:
        - xtc
        - trr
        - tng
        - gro
        - g96
        - pdb
  entry: 05_analysis/trjconv/SKILL.md

- name: trjcat
  purpose: Concatenate multiple trajectory inputs according to a Stage 5 plan item and produce a traceable concatenated trajectory.
  required_files:
    - role: trajectories
      types:
        - xtc
        - trr
        - tng
        - h5md
        - gro
        - g96
        - pdb
        - cpt
  entry: 05_analysis/trjcat/SKILL.md

- name: make_ndx
  purpose: Generate or supplement the index groups required by a Stage 5 analysis item.
  required_files:
    - role: structure_or_index
      types:
        - gro
        - g96
        - pdb
        - tpr
        - ndx
  entry: 05_analysis/make_ndx/SKILL.md
